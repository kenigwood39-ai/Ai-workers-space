    const compressImage = (file) => {
      return new Promise((resolve) => {
        const reader = new FileReader(); reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image(); img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const scaleSize = 600 / img.width;
            canvas.width = 600; canvas.height = img.height * scaleSize;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          };
        };
      });
    };

    const playNotificationBeep = () => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } catch (e) {
        console.warn("Audio notification failed", e);
      }
    };

        if (!isGlobalMode) {
           if (authPassword.length < 6) { setAuthError('Пароль должен быть от 6 символов'); setAuthLoading(false); return; }
           setUser({ id: 'u_'+Date.now(), email: em, name: em.split('@')[0], avatar: MINIMAL_AVATARS[0].url, avatarFrame: 'frame-none', cardFrame: 'card-frame-default' }); 
           setBalance(em === ADMIN_EMAIL.toLowerCase() ? 25000 : 1000); setAuthModalOpen(false); showToast('Локальный вход'); setAuthLoading(false); return;
        }

        try {
          if (authMode === 'register') {
            if(authPassword.length < 6) throw { code: 'auth/weak-password' };
            const cred = await window.Firebase.createUserWithEmailAndPassword(auth, em, authPassword);
            try { 
              await window.Firebase.sendEmailVerification(cred.user); 
              showToast('Письмо подтверждения отправлено на почту!', 'success');

            await window.Firebase.signInWithEmailAndPassword(auth, em, authPassword);

          if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') setAuthError('Неверный email или пароль.');

                   {adminSubTab === 'support' && (

                    <div ref={chatScrollRef} className="flex-1 p-4 overflow-y-auto space-y-3 bg-[#05070A]/50">
                       <div className="text-center text-[10px] text-slate-500 mb-2">Напишите нам, мы скоро ответим!</div>

    function App() {
      const [tab, setTab] = useState('feed');
      const [role, setRole] = useState('freelancer');
      const [cabinetSubTab, setCabinetSubTab] = useState('my-orders');
      
      const [user, setUser] = useState(() => {
        const savedUser = localStorage.getItem('aws_active_user');
        return savedUser ? JSON.parse(savedUser) : null;
      });

      const [balance, setBalance] = useState(() => {
        const b = localStorage.getItem('aws_balance_v6');
        if (b) return Number(b);
        return user?.email === 'kenigwood39@gmail.com' ? 25000 : 1000;
      });

      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem('aws_tasks_v6');
        return saved ? JSON.parse(saved) : RICH_INITIAL_TASKS;
      });

      const [inventory, setInventory] = useState(() => {
        const saved = localStorage.getItem('aws_inventory');
        return saved ? JSON.parse(saved) : {};
      });

      const [paidUnlocks, setPaidUnlocks] = useState(() => {
        const saved = localStorage.getItem('aws_paid_unlocks');
        return saved ? JSON.parse(saved) : {};
      });

      const [favorites, setFavorites] = useState([]);
      const [selectedCat, setSelectedCat] = useState('All');

      // Модалки
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [verificationCode, setVerificationCode] = useState('');
      const [generatedOtp, setGeneratedOtp] = useState('');
      const [authError, setAuthError] = useState('');

      const [walletModalOpen, setWalletModalOpen] = useState(false);
      const [selectedCurrency, setSelectedCurrency] = useState('usdt');
      const [depositAmountAWS, setDepositAmountAWS] = useState('1000');
      const [depositSuccess, setDepositSuccess] = useState(false);

      // Форма создания таска с загрузкой фото с устройства
      const [newTitle, setNewTitle] = useState('');
      const [newCategory, setNewCategory] = useState('art');
      const [newPrompt, setNewPrompt] = useState('');
      const [newBudget, setNewBudget] = useState('');
      const [newTool, setNewTool] = useState('Midjourney v6');
      const [taskPhotos, setTaskPhotos] = useState([]); // массив загруженных Data URL или ссылок
      const [mainPhotoIndex, setMainPhotoIndex] = useState(0);

      const [viewingTask, setViewingTask] = useState(null);
      const [currentPhotoSlide, setCurrentPhotoSlide] = useState(0);
      const [selectedTaskForChat, setSelectedTaskForChat] = useState(null);
      const [dealMessages, setDealMessages] = useState({});
      const [chatInput, setChatInput] = useState('');

      useEffect(() => {
        localStorage.setItem('aws_tasks_v6', JSON.stringify(tasks));
      }, [tasks]);

      useEffect(() => {
        localStorage.setItem('aws_inventory', JSON.stringify(inventory));
      }, [inventory]);

      useEffect(() => {
        localStorage.setItem('aws_balance_v6', balance.toString());
      }, [balance]);

      // Загрузка аватарки с устройства (File -> Base64)
      const handleUploadAvatarFromFile = (e) => {
        const file = e.target.files[0];
        if (!file || !user) return;

        const reader = new FileReader();
        reader.onloadend = () => {
          const base64Data = reader.result;
          const updated = { ...user, avatar: base64Data };
          setUser(updated);
          localStorage.setItem('aws_active_user', JSON.stringify(updated));
          alert('✓ Ваша аватарка успешно загружена с устройства!');
        };
        reader.readAsDataURL(file);
      };

      // Загрузка фото для создания таска с устройства (Multiple Files)
      const handleUploadTaskPhotos = (e) => {
        const files = Array.from(e.target.files);
        if (!files.length) return;

        files.forEach((file) => {
          if (taskPhotos.length >= 5) return;
          const reader = new FileReader();
          reader.onloadend = () => {
            setTaskPhotos(prev => {
              if (prev.length >= 5) return prev;
              return [...prev, reader.result];
            });
          };
          reader.readAsDataURL(file);
        });
      };

      const handleRemoveTaskPhoto = (index) => {
        const updated = taskPhotos.filter((_, i) => i !== index);
        setTaskPhotos(updated);
        if (mainPhotoIndex >= updated.length) {
          setMainPhotoIndex(Math.max(0, updated.length - 1));
        }
      };

      // Регистрация с подарком 1000 AWS
      const handleStartRegister = (e) => {
        e.preventDefault();
        setAuthError('');
        if (authPassword.length < 6) {
          setAuthError('Пароль должен содержать минимум 6 символов');
          return;
        }
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        setGeneratedOtp(code);
        setAuthMode('verify_email');
      };

      const handleVerifyEmail = (e) => {
        e.preventDefault();
        if (verificationCode.trim() !== generatedOtp) {
          setAuthError('Неверный код подтверждения!');
          return;
        }
        const cleanEmail = authEmail.trim().toLowerCase();
        const isMaster = cleanEmail === 'kenigwood39@gmail.com';
        
        const newUser = {
          id: 'user_' + btoa(cleanEmail).substring(0, 10),
          email: cleanEmail,
          name: cleanEmail.split('@')[0],
          avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80',
          avatarFrame: 'frame-none',
          cardFrame: 'card-frame-default',
          verified: true
        };

        const initialGiftBalance = isMaster ? 25000 : 1000;
        setBalance(initialGiftBalance);

        setUser(newUser);
        localStorage.setItem('aws_active_user', JSON.stringify(newUser));
        setAuthModalOpen(false);
        setAuthEmail('');
        setAuthPassword('');
        setVerificationCode('');
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const cleanEmail = authEmail.trim().toLowerCase();
        const isMaster = cleanEmail === 'kenigwood39@gmail.com';

        const loggedUser = {
          id: 'user_' + btoa(cleanEmail).substring(0, 10),
          email: cleanEmail,
          name: cleanEmail.split('@')[0],
          avatar: user?.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80',
          avatarFrame: user?.avatarFrame || 'frame-none',
          cardFrame: user?.cardFrame || 'card-frame-default',
          verified: true
        };

        if (isMaster && balance < 25000) setBalance(25000);

        setUser(loggedUser);
        localStorage.setItem('aws_active_user', JSON.stringify(loggedUser));
        setAuthModalOpen(false);
        setAuthEmail('');
        setAuthPassword('');
      };

      const handleLogout = () => {
        setUser(null);
        localStorage.removeItem('aws_active_user');
      };

      const handleSelectAvatar = (item) => {
        if (!user) return;
        const userInv = inventory[user.id] || { avatars: [], frames: [], cardFrames: [] };

        if (item.price === 0 || userInv.avatars.includes(item.id)) {
          const updated = { ...user, avatar: item.url };
          setUser(updated);
          localStorage.setItem('aws_active_user', JSON.stringify(updated));
        } else {
          if (balance < item.price) {
            alert(`Недостаточно средств. Стоимость: ${item.price} AWS`);
            setWalletModalOpen(true);
            return;
          }
          setBalance(prev => prev - item.price);
          const newInv = {
            ...inventory,
            [user.id]: {
              ...userInv,
              avatars: [...userInv.avatars, item.id]
            }
          };
          setInventory(newInv);
          const updated = { ...user, avatar: item.url };
          setUser(updated);
          localStorage.setItem('aws_active_user', JSON.stringify(updated));
          alert(`🎉 Аватар "${item.name}" успешно куплен и установлен!`);
        }
      };

      const handleSelectAvatarFrame = (frame) => {
        if (!user) return;
        const userInv = inventory[user.id] || { avatars: [], frames: [], cardFrames: [] };

        if (frame.price === 0 || userInv.frames.includes(frame.id)) {
          const updated = { ...user, avatarFrame: frame.class };
          setUser(updated);
          localStorage.setItem('aws_active_user', JSON.stringify(updated));
        } else {
          if (balance < frame.price) {
            alert(`Недостаточно средств. Стоимость: ${frame.price} AWS`);
            setWalletModalOpen(true);
            return;
          }
          setBalance(prev => prev - frame.price);
          const newInv = {
            ...inventory,
            [user.id]: {

              frames: [...userInv.frames, frame.id]
            }
          };
          setInventory(newInv);
          const updated = { ...user, avatarFrame: frame.class };
          setUser(updated);
          localStorage.setItem('aws_active_user', JSON.stringify(updated));
          alert(`🎉 Рамка "${frame.name}" успешно куплена!`);
        }
      };

      const handleSelectCardFrame = (cFrame) => {
        if (!user) return;
        const userInv = inventory[user.id] || { avatars: [], frames: [], cardFrames: [] };

        if (cFrame.price === 0 || userInv.cardFrames.includes(cFrame.id)) {
          const updated = { ...user, cardFrame: cFrame.class };
          setUser(updated);
          localStorage.setItem('aws_active_user', JSON.stringify(updated));
          setTasks(tasks.map(t => t.author_id === user.id ? { ...t, card_frame: cFrame.class } : t));
        } else {
          if (balance < cFrame.price) {
            alert(`Недостаточно средств. Стоимость: ${cFrame.price} AWS`);
            setWalletModalOpen(true);
            return;

          setBalance(prev => prev - cFrame.price);
          const newInv = {
            ...inventory,
            [user.id]: {
              ...userInv,
              cardFrames: [...userInv.cardFrames, cFrame.id]
            }
          };
          setInventory(newInv);
          const updated = { ...user, cardFrame: cFrame.class };
          setUser(updated);
          localStorage.setItem('aws_active_user', JSON.stringify(updated));
          setTasks(tasks.map(t => t.author_id === user.id ? { ...t, card_frame: cFrame.class } : t));
          alert(`🎉 Рамка объявлений "${cFrame.name}" куплена и применена ко всем вашим таскам!`);
        }
      };

      const handleCreateTask = (e) => {
        e.preventDefault();
        if (!user) { setAuthModalOpen(true); return; }
        if (!newTitle || !newBudget) return;

        const taskBudget = Number(newBudget);
        if (balance < taskBudget) { setWalletModalOpen(true); return; }

          id: Date.now(),
          category: newCategory,
          title: newTitle,
          prompt: newPrompt || 'ТЗ предоставлено в чате сделки',
          tool: newTool,
          budget: taskBudget,
          response_fee: calculateResponseFee(taskBudget),
          currency: 'AWS',

          author_id: user.id,
          card_frame: user.cardFrame || 'card-frame-default',
          executor_id: null,
          status: 'open',
          views: 1,
          mainPhotoIndex: mainPhotoIndex < finalPhotos.length ? mainPhotoIndex : 0,

        setBalance(prev => prev - taskBudget);
        setTasks([taskObj, ...tasks]);

        setNewPrompt('');
        setNewBudget('');
        setTaskPhotos([]);

        if (!user) return false;
        if (user.id === authorId) return true;
        return (paidUnlocks[user.id] || []).includes(taskId);
      };

      const handleUnlockAndEnterChat = (task) => {
        if (!user) { setAuthModalOpen(true); return; }
        const fee = task.response_fee || calculateResponseFee(task.budget);
        if (balance < fee) { setWalletModalOpen(true); return; }

        setBalance(prev => prev - fee);
        setPaidUnlocks(prev => ({ ...prev, [user.id]: [...(prev[user.id] || []), task.id] }));
        openTaskChat(task);
      };

      const openTaskModal = (task) => {
        setViewingTask(task);
        setCurrentPhotoSlide(task.mainPhotoIndex || 0);
      };

      const openTaskChat = (task) => {
        setViewingTask(null);
        setSelectedTaskForChat(task);
        if (!dealMessages[task.id]) {
          setDealMessages(prev => ({
            ...prev,
            [task.id]: [{ id: 1, sender: task.author, text: `Привет! Заказ #${task.id} запущен в работу. Escrow: ${task.budget.toLocaleString()} AWS.`, isMe: false }]
          }));
        }
        setTab('deal_chat');
      };

      const handleSendDealMessage = (e) => {
        e.preventDefault();
        if (!chatInput.trim() || !selectedTaskForChat) return;

        const newMsg = {
          id: Date.now(),
          sender: user ? user.name : 'Вы',
          text: chatInput,
          isMe: true
        };

        setDealMessages(prev => ({
          ...prev,
          [selectedTaskForChat.id]: [...(prev[selectedTaskForChat.id] || []), newMsg]
        }));
        setChatInput('');
      };

      const displayedTasks = selectedCat === 'All' ? tasks : tasks.filter(t => t.category === selectedCat);

                          <button onClick={() => setTab('create')} className="mt-3 px-4 py-2 bg-cyan-500 text-black font-bold text-xs rounded-xl">
                            Создать таск
                          </button>
                        </div>
                      ) : (
                        <div className="grid grid-cols-1 gap-3">
                          {myClientTasks.map(item => (
                            <div key={item.id} className="bg-[#0D121F] p-4 rounded-2xl border border-cyan-500/30 flex flex-col sm:flex-row gap-3 sm:items-center justify-between min-w-0">
                              <div className="min-w-0 space-y-1">
                                <h4 className="font-bold text-sm text-slate-100">{item.title}</h4>
                                <div className="text-xs text-slate-400 font-mono">
                                  Бюджет: {item.budget.toLocaleString()} AWS • Отклик: {item.response_fee} AWS
                                </div>
                              </div>
                              <button onClick={() => openTaskChat(item)} className="px-3.5 py-2 bg-slate-900 border border-cyan-500/40 text-cyan-300 text-xs font-semibold rounded-xl">
                                Чат сделки
                              </button>
                            </div>
                          ))}
                        </div>
                      )
                    ) : (
                      myFreelancerTasks.length === 0 ? (
                        <div className="text-center py-12 bg-[#0D121F] rounded-2xl border border-slate-800">
                          <i className="fa-solid fa-bolt text-2xl text-slate-600 mb-2"></i>
                          <p className="text-slate-300 font-medium text-xs sm:text-sm">Вы еще не взяли ни одного заказа</p>
                          <button onClick={() => setTab('feed')} className="mt-3 px-4 py-2 bg-cyan-500 text-black font-bold text-xs rounded-xl">
                            Выбрать таск
                          </button>
                        </div>
                      ) : (
                        <div className="grid grid-cols-1 gap-3">
                          {myFreelancerTasks.map(item => (
                            <div key={item.id} className="bg-[#0D121F] p-4 rounded-2xl border border-emerald-500/30 flex flex-col sm:flex-row gap-3 sm:items-center justify-between min-w-0">
                              <div className="min-w-0 space-y-1">
                                <h4 className="font-bold text-sm text-slate-100">{item.title}</h4>
                                <p className="text-xs text-slate-400 font-mono">Выплата: {Math.round(item.budget * 0.9).toLocaleString()} AWS (Escrow)</p>
                              </div>
                              <button onClick={() => openTaskChat(item)} className="px-3.5 py-2 bg-emerald-500 text-black text-xs font-bold rounded-xl">
                                Чат / Сдать работу
                              </button>
                            </div>
                          ))}
                        </div>
                      )
                    )
                  )}
                </div>
              )}

              {/* ЧАТ И ESCROW */}
              {tab === 'deal_chat' && selectedTaskForChat && (
                <div className="bg-[#0D121F] rounded-2xl border border-cyan-500/30 overflow-hidden flex flex-col h-[560px]">
                  <div className="bg-slate-950 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
                    <div className="flex items-center gap-2">
                      <button onClick={() => setTab('cabinet')} className="text-xs text-slate-400 hover:text-cyan-300 mr-1">
                        <i className="fa-solid fa-arrow-left"></i>
                      </button>
                      <span className="text-xs sm:text-sm font-bold text-slate-200 truncate">Таск #{selectedTaskForChat.id}: {selectedTaskForChat.title}</span>
                    </div>
                    <span className="text-[11px] text-teal-400 font-mono bg-teal-950/80 px-2 py-0.5 rounded border border-teal-800/50">
                      🔒 Escrow: {selectedTaskForChat.budget.toLocaleString()} AWS
                    </span>
                  </div>

                  <div className="flex-1 p-3 sm:p-4 overflow-y-auto space-y-3">
                    {(dealMessages[selectedTaskForChat.id] || []).map((m) => (
                      <div key={m.id} className={`flex flex-col ${m.isMe ? 'items-end' : 'items-start'}`}>
                        <span className="text-[10px] text-slate-500 mb-0.5">{m.sender}</span>
                        <div className={`max-w-[85%] rounded-xl px-3.5 py-2 text-xs sm:text-sm break-words ${m.isMe ? 'bg-cyan-600 text-white' : 'bg-slate-900 border border-slate-800 text-slate-200'}`}>
                          <p>{m.text}</p>
                        </div>
                      </div>
                    ))}
                  </div>

                  {isChatUnlocked(selectedTaskForChat.id, selectedTaskForChat.author_id) ? (
                    <form onSubmit={handleSendDealMessage} className="p-2.5 bg-slate-950 border-t border-slate-800 flex gap-2">
                      <input
                        type="text"
                        placeholder="Сообщение или ссылка на готовую работу..."
                        value={chatInput}
                        onChange={(e) => setChatInput(e.target.value)}
                        className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2 text-xs sm:text-sm outline-none"
                      />
                      <button type="submit" className="p-2 px-3.5 bg-cyan-500 text-black rounded-xl font-bold">
                        <i className="fa-solid fa-paper-plane text-xs"></i>
                      </button>
                    </form>
                  ) : (
                    <div className="p-3 bg-slate-950 border-t border-amber-500/40 flex items-center justify-between">
                      <span className="text-xs text-amber-400 font-mono">Чат закрыт до оплаты отклика</span>
                      <button
                        onClick={() => handleUnlockAndEnterChat(selectedTaskForChat)}
                        className="px-4 py-2 rounded-xl bg-amber-500 text-black font-bold text-xs"
                      >
                        Оплатить отклик ({selectedTaskForChat.response_fee} AWS)
                      </button>
                    </div>
                  )}
                </div>
              )}

              {/* СОЗДАНИЕ ТАСКА С ЗАГРУЗКОЙ ФОТО С УСТРОЙСТВА */}
              {tab === 'create' && (
                <div className="bg-[#0D121F] p-5 sm:p-7 rounded-2xl border border-cyan-500/30">
                  <h2 className="text-lg sm:text-xl font-bold text-cyan-400 mb-1">Создать задание</h2>
                  <p className="text-xs text-slate-400 mb-5">Загрузите фото с телефона/компьютера и выберите главное.</p>
                  <form onSubmit={handleCreateTask} className="space-y-4">
                    <input
                      type="text"
                      required
                      placeholder="Название проекта"
                      value={newTitle}
                      onChange={(e) => setNewTitle(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:border-cyan-500 outline-none"
                    />

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <select
                        value={newCategory}
                        onChange={(e) => setNewCategory(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 text-sm outline-none text-slate-200"
                      >
                        <option value="art">🎨 Арт и Графика</option>
                        <option value="arch">🏛️ Архитектура</option>
                        <option value="video">🎬 AI-Видео</option>
                        <option value="music">🎵 Музыка</option>
                        <option value="web">💻 Web / Кодинг</option>
                        <option value="biz">⚡ Автоматизация</option>
                      </select>

                      <select
                        value={newTool}
                        onChange={(e) => setNewTool(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 text-sm outline-none text-slate-200"
                      >
                        <option value="Midjourney v6">Midjourney v6</option>
                        <option value="FLUX.1 Pro">FLUX.1 Pro</option>
                        <option value="Runway Gen-3">Runway Gen-3</option>
                        <option value="ComfyUI">ComfyUI</option>
                      </select>

                      <input
                        type="number"
                        required
                        placeholder="Бюджет (AWS)"
                        value={newBudget}
                        onChange={(e) => setNewBudget(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm outline-none"
                      />
                    </div>

                    {/* Блок прикрепления фото с устройства */}
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-3">
                      <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-2">
                        <label className="text-xs font-semibold text-slate-200">
                          <i className="fa-solid fa-images text-cyan-400 mr-1.5"></i>
                          Прикрепленные фото / Референсы ({taskPhotos.length}/5)
                        </label>
                        
                        {taskPhotos.length < 5 && (
                          <label className="px-3.5 py-1.5 bg-cyan-500 text-black font-bold text-xs rounded-xl cursor-pointer hover:bg-cyan-400 self-start sm:self-auto flex items-center gap-1.5">
                            <i className="fa-solid fa-plus"></i>
                            <span>Загрузить фото с устройства</span>
                            <input type="file" accept="image/*" multiple className="hidden" onChange={handleUploadTaskPhotos} />
                          </label>
                        )}
                      </div>

                      {taskPhotos.length > 0 ? (
                        <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 pt-2">
                          {taskPhotos.map((photo, idx) => (
                            <div key={idx} className="relative group rounded-xl overflow-hidden border border-slate-800 bg-slate-900 h-28 flex flex-col justify-between p-1.5">
                              <img src={photo} className="w-full h-full object-cover rounded-lg absolute inset-0 -z-0" />
                              
                              <div className="relative z-10 flex justify-between items-start">
                                <button
                                  type="button"
                                  onClick={() => setMainPhotoIndex(idx)}
                                  className={`px-2 py-0.5 rounded-full text-[10px] font-bold backdrop-blur-md transition-colors ${
                                    mainPhotoIndex === idx ? 'bg-amber-500 text-black' : 'bg-black/60 text-slate-300 hover:text-white'
                                  }`}
                                >
                                  {mainPhotoIndex === idx ? '★ Главное' : 'Сделать главным'}
                                </button>

                                <button
                                  type="button"
                                  onClick={() => handleRemoveTaskPhoto(idx)}
                                  className="w-6 h-6 rounded-full bg-red-500/80 text-white flex items-center justify-center text-xs hover:bg-red-500 backdrop-blur-md"
                                >
                                  <i className="fa-solid fa-xmark"></i>
                                </button>
                              </div>
                            </div>
                          ))}
                        </div>
                      ) : (
                        <div className="py-6 border-2 border-dashed border-slate-800 rounded-xl text-center space-y-1">
                          <i className="fa-solid fa-cloud-arrow-up text-slate-600 text-2xl"></i>
                          <p className="text-xs text-slate-400">Нажмите кнопку выше, чтобы добавить фото с телефона</p>
                        </div>
                      )}
                    </div>

                    <textarea
                      rows="4"
                      placeholder="Вставьте промпт или ТЗ..."
                      value={newPrompt}
                      onChange={(e) => setNewPrompt(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm outline-none"
                    ></textarea>

                    <button
                      type="submit"
                      className="w-full py-3.5 rounded-xl bg-gradient-to-r from-fuchsia-500 to-cyan-500 text-white font-bold text-sm"
                    >
                      Опубликовать заказ (Escrow)
                    </button>
                  </form>
                </div>
              )}

              {/* КРЕАТОРЫ */}
              {tab === 'creators' && (
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {CREATORS.map((c) => (
                    <div key={c.id} className="bg-[#0D121F] p-4 sm:p-5 rounded-2xl border border-slate-800 space-y-3">
                      <div className="flex items-center gap-3">
                        <div className={`w-12 h-12 rounded-xl overflow-hidden ${c.frame}`}>
                          <img src={c.avatar} className="w-full h-full object-cover" />
                        </div>
                        <div>
                          <h3 className="font-bold text-sm text-slate-100">{c.name}</h3>
                          <div className="text-[11px] text-cyan-400 font-medium">{c.category}</div>
                          <span className="text-xs text-slate-400 font-mono">{c.deals} сделок • ★ {c.rating}</span>
                        </div>
                      </div>
                      <div className="flex flex-wrap gap-1.5">
                        {c.skills.map(s => <span key={s} className="text-[10px] bg-slate-900 px-2 py-0.5 rounded text-cyan-300 border border-slate-800 font-mono">{s}</span>)}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </section>
          </main>

          {/* МОДАЛЬНЫЙ ПРОСМОТР ТАСКА С ГАЛЕРЕЕЙ */}
          {viewingTask && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0D121F] border border-cyan-500/40 rounded-2xl p-5 sm:p-7 max-w-2xl w-full max-h-[90vh] flex flex-col relative overflow-y-auto">
                <button onClick={() => setViewingTask(null)} className="absolute top-4 right-4 text-slate-400 hover:text-white z-10">
                  <i className="fa-solid fa-xmark text-lg"></i>
                </button>

                <div className="relative w-full h-64 sm:h-80 rounded-xl overflow-hidden bg-slate-950 mb-4 border border-cyan-500/20">
                  <img src={viewingTask.photos[currentPhotoSlide] || viewingTask.photos[0]} className="w-full h-full object-cover" />
                  {viewingTask.photos.length > 1 && (
                    <>
                      <button onClick={() => setCurrentPhotoSlide(prev => prev > 0 ? prev - 1 : viewingTask.photos.length - 1)} className="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/70 text-white flex items-center justify-center">
                        <i className="fa-solid fa-chevron-left"></i>
                      </button>
                      <button onClick={() => setCurrentPhotoSlide(prev => prev < viewingTask.photos.length - 1 ? prev + 1 : 0)} className="absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/70 text-white flex items-center justify-center">
                        <i className="fa-solid fa-chevron-right"></i>
                      </button>
                    </>
                  )}
                </div>

                <div className="space-y-3">
                  <div className="flex justify-between items-center">
                    <span className="text-xs bg-cyan-950 text-cyan-400 border border-cyan-800/40 px-2.5 py-1 rounded font-mono font-bold">{viewingTask.tool}</span>
                    <div className="font-mono text-xl font-extrabold text-cyan-400">{viewingTask.budget.toLocaleString()} AWS</div>
                  </div>
                  <h2 className="text-lg font-bold text-slate-100">{viewingTask.title}</h2>
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 text-xs font-mono text-slate-300">
                    <span className="text-cyan-400 block mb-1">Prompt / ТЗ:</span>
                    {viewingTask.prompt}
                  </div>

                  {isChatUnlocked(viewingTask.id, viewingTask.author_id) ? (
                    <button onClick={() => openTaskChat(viewingTask)} className="w-full py-3 rounded-xl bg-emerald-500 text-black font-bold text-sm">
                      Перейти в чат сделки
                    </button>
                  ) : (
                    <button
                      onClick={() => handleUnlockAndEnterChat(viewingTask)}
                      className="w-full py-3.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-black font-bold text-sm"
                    >
                      Оплатить отклик ({viewingTask.response_fee} AWS) и открыть чат
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* КАССА */}
          {walletModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0D121F] border border-cyan-500/40 rounded-2xl p-5 sm:p-7 max-w-md w-full relative">
                <button onClick={() => setWalletModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white">
                  <i className="fa-solid fa-xmark text-lg"></i>
                </button>

                <h3 className="text-lg font-bold text-slate-100 mb-1">Касса платформы</h3>
                <p className="text-xs text-slate-400 mb-4">100 AWS = 100 USDT</p>

                <div className="space-y-4">
                  <div className="grid grid-cols-3 gap-2">
                    {Object.entries(CRYPTO_RATES).map(([key, item]) => (
                      <button
                        key={key}
                        onClick={() => setSelectedCurrency(key)}
                        className={`p-2 rounded-xl border text-center ${selectedCurrency === key ? 'bg-cyan-500/20 border-cyan-400 text-cyan-300' : 'bg-slate-950 border-slate-800 text-slate-400'}`}
                      >
                        <div className="text-xs font-bold">{item.symbol}</div>
                        <div className="text-[9px] opacity-70">{item.net}</div>
                      </button>
                    ))}
                  </div>

                  <input
                    type="number"
                    value={depositAmountAWS}
                    onChange={(e) => setDepositAmountAWS(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm font-mono text-cyan-300 outline-none"
                    placeholder="Сумма в AWS"
                  />

                  <div className="p-2.5 rounded-lg bg-cyan-950/40 border border-cyan-500/30 text-xs flex justify-between">
                    <span>К оплате:</span>
                    <span className="font-mono font-bold text-cyan-400">
                      {(Number(depositAmountAWS) * CRYPTO_RATES[selectedCurrency].rate).toFixed(2)} {CRYPTO_RATES[selectedCurrency].symbol}
                    </span>
                  </div>

                  <button
                    onClick={() => {
                      setBalance(prev => prev + Number(depositAmountAWS));
                      setDepositSuccess(true);
                      setTimeout(() => { setDepositSuccess(false); setWalletModalOpen(false); }, 1200);
                    }}
                    className="w-full py-3 rounded-xl bg-cyan-500 text-black font-bold text-sm"
                  >
                    {depositSuccess ? '✓ Успешно пополнено!' : 'Оплатить'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* АВТОРИЗАЦИЯ */}
          {authModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0D121F] border border-cyan-500/40 rounded-2xl p-5 sm:p-7 max-w-sm w-full relative">
                <button onClick={() => setAuthModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white">
                  <i className="fa-solid fa-xmark text-lg"></i>
                </button>

                {authMode === 'login' && (
                  <>
                    <h3 className="text-lg font-bold text-slate-100 mb-1">Вход в аккаунт</h3>
                    <form onSubmit={handleLogin} className="space-y-3 mt-3">
                      <input
                        type="email"
                        required
                        placeholder="Email"
                        value={authEmail}
                        onChange={(e) => setAuthEmail(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm outline-none"
                      />
                      <input
                        type="password"
                        required
                        placeholder="Пароль"
                        value={authPassword}
                        onChange={(e) => setAuthPassword(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm outline-none"
                      />
                      <button type="submit" className="w-full py-3 rounded-xl bg-cyan-500 text-black font-bold text-sm">
                        Войти
                      </button>
                    </form>
                    <div className="mt-3 text-center text-xs text-slate-400">
                      Нет аккаунта?{' '}
                      <button onClick={() => setAuthMode('register')} className="text-cyan-400 font-semibold underline">
                        Регистрация (+1000 AWS)
                      </button>
                    </div>
                  </>
                )}

                {authMode === 'register' && (
                  <>
                    <div className="flex items-center gap-2 mb-1">
                      <h3 className="text-lg font-bold text-slate-100">Регистрация</h3>
                      <span className="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full font-mono font-bold">+1000 AWS</span>
                    </div>
                    <form onSubmit={handleStartRegister} className="space-y-3 mt-3">
                      <input
                        type="email"
                        required
                        placeholder="Email"
                        value={authEmail}
                        onChange={(e) => setAuthEmail(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm outline-none"
                      />
                      <input
                        type="password"
                        required
                        placeholder="Пароль (от 6 символов)"
                        value={authPassword}
                        onChange={(e) => setAuthPassword(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm outline-none"
                      />
                      <button type="submit" className="w-full py-3 rounded-xl bg-cyan-500 text-black font-bold text-sm">
                        Получить код на Email
                      </button>
                    </form>
                  </>
                )}

                {authMode === 'verify_email' && (
                  <>
                    <h3 className="text-lg font-bold text-slate-100 mb-1">Код подтверждения</h3>
                    <div className="p-2.5 mb-3 rounded-xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 text-xs font-mono text-center">
                      OTP: <b>{generatedOtp}</b>
                    </div>
                    <form onSubmit={handleVerifyEmail} className="space-y-3">
                      <input
                        type="text"
                        required
                        maxLength="6"
                        placeholder="6-значный код"
                        value={verificationCode}
                        onChange={(e) => setVerificationCode(e.target.value)}
                        className="w-full bg-slate-950 border border-cyan-500 text-center text-lg font-mono rounded-xl px-3.5 py-2.5 text-cyan-300 outline-none"
                      />
                      <button type="submit" className="w-full py-3 rounded-xl bg-emerald-500 text-black font-bold text-sm">
                        Забрать +1000 AWS и войти
                      </button>
                    </form>
                  </>
                )}
              </div>
            </div>
          )}

          {/* Футер */}
          <footer className="mt-12 border-t border-cyan-500/20 bg-[#06080C] px-4 py-8 text-xs text-slate-400">
            <div className="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
              <div className="space-y-1 text-center md:text-left">
                <div className="font-bold text-slate-200 text-sm">AI WORKERS SPACE</div>
                <div className="font-mono text-[11px]">Самозанятая: Храппа Марина Николаевна • ИНН: 390400469138</div>
              </div>
              <div className="text-center md:text-right font-mono text-[11px] text-slate-500">
                © 2026 AI WORKERS SPACE. Все права защищены.
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

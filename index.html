    html { scroll-behavior: smooth; background-color: #07090E; }

      background-color: #07090E;

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .frame-none { border: 2px solid transparent; }
    .frame-cyan { border: 2px solid #06b6d4; box-shadow: 0 0 10px rgba(6, 182, 212, 0.7); }
    .frame-fuchsia { border: 2px solid #d946ef; box-shadow: 0 0 12px rgba(217, 70, 239, 0.8); }
    .frame-emerald { border: 2px solid #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.8); }
    .frame-amber { border: 2px solid #f59e0b; box-shadow: 0 0 18px rgba(245, 158, 11, 0.9); }
    .frame-rainbow { border: 2px solid #ec4899; box-shadow: 0 0 22px rgba(236, 72, 153, 1); animation: pulse 2s infinite; }

    .card-frame-default { border: 1px solid rgba(51, 65, 85, 0.8); }
    .card-frame-neon { border: 1.5px solid #06b6d4; box-shadow: 0 0 15px rgba(6, 182, 212, 0.25); }
    .card-frame-cyber { border: 1.5px solid #d946ef; box-shadow: 0 0 18px rgba(217, 70, 239, 0.3); }
    .card-frame-gold { border: 1.5px solid #f59e0b; box-shadow: 0 0 20px rgba(245, 158, 11, 0.35); }
    .card-frame-fire { border: 1.5px solid #ef4444; box-shadow: 0 0 25px rgba(239, 68, 68, 0.4); }

    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .toast-enter { animation: slideIn 0.3s ease-out forwards; }
  </style>
</head>
<body class="bg-[#07090E] min-h-screen text-slate-100 selection:bg-cyan-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const TELEGRAM_LINK = "https://t.me/aiworkersspace";
    const ADMIN_EMAIL = "kenigwood39@gmail.com";

    const calculateResponseFee = (budget) => {
      const b = Number(budget) || 0;
      if (b <= 2000) return 100;
      if (b <= 5000) return Math.max(100, Math.round(b * 0.05));
      const fee = 250 + ((b - 5000) / (100000 - 5000)) * (1200 - 250);
      return Math.round(fee);
    };

    const CRYPTO_RATES = {
      usdt: { rate: 1.0, symbol: 'USDT', net: 'TRC-20' },
      ton: { rate: 0.18, symbol: 'TON', net: 'The Open Network' },
      trx: { rate: 6.8, symbol: 'TRX', net: 'TRON' },
      btc: { rate: 0.000016, symbol: 'BTC', net: 'Bitcoin' },
      rub: { rate: 92.5, symbol: 'RUB', net: 'Банковская карта' }
    };

    const MINIMAL_AVATARS = [
      { id: 'min_free_1', url: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=300&q=80', name: 'Dark Sphere', price: 0 },
      { id: 'min_free_2', url: 'https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?auto=format&fit=crop&w=300&q=80', name: 'Minimal Glow', price: 0 },
      { id: 'min_500', url: 'https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?auto=format&fit=crop&w=300&q=80', name: 'Glass Wave', price: 500 },
      { id: 'min_1000', url: 'https://images.unsplash.com/photo-1633167606207-d840b5070fc2?auto=format&fit=crop&w=300&q=80', name: 'Obsidian Cube', price: 1000 },
      { id: 'min_2000', url: 'https://images.unsplash.com/photo-1614680376593-902f749f7ffc?auto=format&fit=crop&w=300&q=80', name: 'Cyber Minimal', price: 2000 },
      { id: 'min_3000', url: 'https://images.unsplash.com/photo-1618005198919-d3d4b5a92ead?auto=format&fit=crop&w=300&q=80', name: 'Liquid Chrome', price: 3000 },
      { id: 'min_5000', url: 'https://images.unsplash.com/photo-1634926878768-2a5b3c42f139?auto=format&fit=crop&w=300&q=80', name: 'Matte VIP Gold', price: 5000 }
    ];

    const AVATAR_FRAMES = [
      { id: 'frame-none', name: 'Без рамки', class: 'frame-none', price: 0 },
      { id: 'frame-cyan', name: 'Cyan Glow', class: 'frame-cyan', price: 500 },
      { id: 'frame-fuchsia', name: 'Fuchsia Neon', class: 'frame-fuchsia', price: 1000 },
      { id: 'frame-emerald', name: 'Emerald Edge', class: 'frame-emerald', price: 2000 },
      { id: 'frame-amber', name: 'Gold Emperor', class: 'frame-amber', price: 3000 },
      { id: 'frame-rainbow', name: 'Rainbow Mythic', class: 'frame-rainbow', price: 5000 }
    ];

    const TASK_CARD_FRAMES = [
      { id: 'card-frame-default', name: 'Стандартная', class: 'card-frame-default', price: 0 },
      { id: 'card-frame-neon', name: 'Неон Cyan', class: 'card-frame-neon', price: 1000 },
      { id: 'card-frame-cyber', name: 'Кибер Fuchsia', class: 'card-frame-cyber', price: 2500 },
      { id: 'card-frame-gold', name: 'Золотой VIP', class: 'card-frame-gold', price: 5000 },
      { id: 'card-frame-fire', name: 'Fire Flame Ultra', class: 'card-frame-fire', price: 10000 }
    ];

    const SYSTEM_TASKS = [
      {
        id: 101,
        category: 'video',
        title: 'Мультфильм для Корейского ТВ',
        prompt: 'Многосерийный мультфильм по сценарию для корейской киностудии в реалистичном стиле.',
        tool: 'ComfyUI',
        budget: 150000,
        response_fee: 1500,
        currency: 'AWS',
        author: 'RestoGroup',
        author_id: 'client_demo_1',
        card_frame: 'card-frame-gold',
        executor_id: null,
        status: 'open',
        hidden: false,
        views: 480,
        mainPhotoIndex: 0,
        photos: [
          'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80',
          'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=800&q=80'
        ]
      },
      {
        id: 102,
        category: 'art',
        title: 'Фотореалистичный фуд-арт сет для мишленовского ресторана',
        prompt: 'Gourmet wagyu truffle burger, dripping cheddar, macro lens, dramatic restaurant lighting --v 6.0',
        tool: 'Midjourney v6',
        budget: 35000,
        response_fee: 580,
        currency: 'AWS',
        author: 'RestoGroup Luxury',
        author_id: 'client_demo_2',
        card_frame: 'card-frame-neon',
        executor_id: null,
        status: 'open',
        hidden: false,
        views: 310,
        mainPhotoIndex: 0,
        photos: [
          'https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=800&q=80'
        ]
      },
      {
        id: 103,
        category: 'art',
        title: 'Киберпанк-обложка для виниловой пластинки Synthwave альбома',
        prompt: 'Futuristic Tokyo skyline at night, glowing neon kanji, retro synthwave 80s aesthetic --stylize 750',
        tool: 'FLUX.1 Pro',
        budget: 5000,
        response_fee: 250,
        currency: 'AWS',
        author: 'NeonRecords NY',
        author_id: 'client_demo_3',
        card_frame: 'card-frame-default',
        executor_id: null,
        status: 'open',
        hidden: false,
        views: 220,
        mainPhotoIndex: 0,
        photos: [
          'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=800&q=80'
        ]
      }
    ];

    function App() {
      // Инициализация состояний
      const [lang, setLang] = useState('ru');
      const [tab, setTab] = useState('feed'); 
      const [role, setRole] = useState('client');
      const [cabinetSubTab, setCabinetSubTab] = useState('my-orders');
      
      const [user, setUser] = useState(() => {
        const saved = localStorage.getItem('aws_active_user');
        return saved ? JSON.parse(saved) : null;
      });

      const isAdmin = user && user.email?.toLowerCase() === ADMIN_EMAIL.toLowerCase();

      // Данные платформы
      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem('aws_db_tasks_v3');
        if (saved) { try { return JSON.parse(saved); } catch(e) {} }
        return SYSTEM_TASKS;
      });

      const [balance, setBalance] = useState(() => {
        const b = localStorage.getItem('aws_db_balance_v3');
        if (b) return Number(b);
        return isAdmin ? 25000 : 1000;
      });

      const [inventory, setInventory] = useState(() => {
        const saved = localStorage.getItem('aws_db_inventory');
        return saved ? JSON.parse(saved) : {};
      });

      const [paidUnlocks, setPaidUnlocks] = useState(() => {
        const saved = localStorage.getItem('aws_db_unlocks');
        return saved ? JSON.parse(saved) : {};
      });

      const [platformStats, setPlatformStats] = useState(() => {
        const saved = localStorage.getItem('aws_db_stats');
        return saved ? JSON.parse(saved) : { visits: 1421, purchasedAWS: 420000, clientsCount: 84, creatorsCount: 142 };
      });

      const [supportTickets, setSupportTickets] = useState(() => {
        const saved = localStorage.getItem('aws_db_tickets');
        return saved ? JSON.parse(saved) : [
          { id: 1, userEmail: 'creator_demo@gmail.com', userName: 'Alex Prompt', text: 'Здравствуйте! Как работает вывод на TON?', reply: 'Здравствуйте! Выплаты обрабатываются автоматически через шлюз BlockBee.', status: 'answered', time: '10:15' }
        ];
      });

      // Локальные состояния UI
      const [toasts, setToasts] = useState([]);
      const [selectedCat, setSelectedCat] = useState('All');
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [verificationCode, setVerificationCode] = useState('');
      const [generatedOtp, setGeneratedOtp] = useState('');
      
      const [walletModalOpen, setWalletModalOpen] = useState(false);
      const [selectedCurrency, setSelectedCurrency] = useState('usdt');
      const [depositAmountAWS, setDepositAmountAWS] = useState('1000');
      
      // Форма создания
      const [newTitle, setNewTitle] = useState('');
      const [newCategory, setNewCategory] = useState('video');
      const [newPrompt, setNewPrompt] = useState('');
      const [newBudget, setNewBudget] = useState('150000');
      const [newTool, setNewTool] = useState('ComfyUI');
      const [taskPhotos, setTaskPhotos] = useState([]);
      const [mainPhotoIndex, setMainPhotoIndex] = useState(0);

      const [editingTask, setEditingTask] = useState(null);
      const [viewingTask, setViewingTask] = useState(null);
      const [currentPhotoSlide, setCurrentPhotoSlide] = useState(0);
      const [selectedTaskForChat, setSelectedTaskForChat] = useState(null);
      const [dealMessages, setDealMessages] = useState({});
      const [chatInput, setChatInput] = useState('');

      // AI Studio
      const [aiMode, setAiMode] = useState('image'); // image, text, video
      const [aiPrompt, setAiPrompt] = useState('');
      const [aiResultImg, setAiResultImg] = useState(null);
      const [aiResultText, setAiResultText] = useState('');
      const [aiResultVideo, setAiResultVideo] = useState(null);
      const [aiLoading, setAiLoading] = useState(false);

      const [userTicketMsg, setUserTicketMsg] = useState('');
      const [adminReplyTexts, setAdminReplyTexts] = useState({});

      // Сохранение состояний
      useEffect(() => { localStorage.setItem('aws_db_tasks_v3', JSON.stringify(tasks)); }, [tasks]);
      useEffect(() => { localStorage.setItem('aws_db_balance_v3', balance.toString()); }, [balance]);
      useEffect(() => { localStorage.setItem('aws_db_inventory', JSON.stringify(inventory)); }, [inventory]);
      useEffect(() => { localStorage.setItem('aws_db_unlocks', JSON.stringify(paidUnlocks)); }, [paidUnlocks]);
      useEffect(() => { localStorage.setItem('aws_db_stats', JSON.stringify(platformStats)); }, [platformStats]);
      useEffect(() => { localStorage.setItem('aws_db_tickets', JSON.stringify(supportTickets)); }, [supportTickets]);

      useEffect(() => {
        if (!sessionStorage.getItem('aws_session_v1')) {
          sessionStorage.setItem('aws_session_v1', 'true');
          setPlatformStats(prev => ({ ...prev, visits: prev.visits + 1 }));
        }
      }, []);

      const showToast = (message, type = 'success') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
      };

      const openTaskModalWithViewCount = (task) => {
        const updated = tasks.map(t => t.id === task.id ? { ...t, views: (t.views || 0) + 1 } : t);
        setTasks(updated);
        const target = updated.find(t => t.id === task.id);
        setViewingTask(target);
        setCurrentPhotoSlide(target.mainPhotoIndex || 0);
      };

      const handleUploadAvatarFromFile = (e) => {
        const file = e.target.files[0];
        if (!file || !user) return;
        const reader = new FileReader();
        reader.onloadend = () => {
          try {
            const updated = { ...user, avatar: reader.result };
            setUser(updated);
            localStorage.setItem('aws_active_user', JSON.stringify(updated));
            showToast('Аватарка успешно обновлена!');
          } catch(err) {
            showToast('Файл слишком большой', 'error');
          }
        };
        reader.readAsDataURL(file);
      };

      const handleUploadTaskPhotos = (e) => {
        const files = Array.from(e.target.files);
        files.forEach((file) => {
          if (taskPhotos.length >= 5) return;
          const reader = new FileReader();
          reader.onloadend = () => {
            setTaskPhotos(prev => (prev.length >= 5 ? prev : [...prev, reader.result]));
          };
          reader.readAsDataURL(file);
        });
      };

      // ИСПРАВЛЕНО: Безопасное удаление фото без конфликта с формой
      const handleRemoveTaskPhoto = (index) => {
        const updated = taskPhotos.filter((_, i) => i !== index);
        setTaskPhotos(updated);
        if (mainPhotoIndex >= updated.length) {
          setMainPhotoIndex(Math.max(0, updated.length - 1));
        }
      };

      const handleSelectAvatar = (item) => {
        if (!user) { setAuthModalOpen(true); return; }
        const userInv = inventory[user.id] || { avatars: [], frames: [], cardFrames: [] };
        if (item.price === 0 || (userInv.avatars && userInv.avatars.includes(item.id))) {
          const updated = { ...user, avatar: item.url };
          setUser(updated);
          localStorage.setItem('aws_active_user', JSON.stringify(updated));
          showToast(`Аватар "${item.name}" установлен!`);
        } else {
          if (balance < item.price) { setWalletModalOpen(true); return; }
          setBalance(prev => prev - item.price);
          setInventory({ ...inventory, [user.id]: { ...userInv, avatars: [...(userInv.avatars || []), item.id] } });
          const updated = { ...user, avatar: item.url };
          setUser(updated);
          localStorage.setItem('aws_active_user', JSON.stringify(updated));
          showToast(`Аватар куплен и установлен!`);
        }
      };

      const handleSelectAvatarFrame = (frame) => {
        if (!user) { setAuthModalOpen(true); return; }
        const userInv = inventory[user.id] || { avatars: [], frames: [], cardFrames: [] };
        if (frame.price === 0 || (userInv.frames && userInv.frames.includes(frame.id))) {
          const updated = { ...user, avatarFrame: frame.class };
          setUser(updated);
          localStorage.setItem('aws_active_user', JSON.stringify(updated));
          showToast(`Рамка применена!`);
        } else {
          if (balance < frame.price) { setWalletModalOpen(true); return; }
          setBalance(prev => prev - frame.price);
          setInventory({ ...inventory, [user.id]: { ...userInv, frames: [...(userInv.frames || []), frame.id] } });
          const updated = { ...user, avatarFrame: frame.class };
          setUser(updated);
          localStorage.setItem('aws_active_user', JSON.stringify(updated));
          showToast(`Неоновая рамка куплена!`);
        }
      };

      const handleSelectCardFrame = (cf) => {
        if (!user) { setAuthModalOpen(true); return; }
        const userInv = inventory[user.id] || { avatars: [], frames: [], cardFrames: [] };
        if (cf.price === 0 || (userInv.cardFrames && userInv.cardFrames.includes(cf.id))) {
          const updated = { ...user, cardFrame: cf.class };
          setUser(updated);
          localStorage.setItem('aws_active_user', JSON.stringify(updated));
          setTasks(tasks.map(t => t.author_id === user.id ? { ...t, card_frame: cf.class } : t));
          showToast(`Рамка объявлений активна!`);
        } else {
          if (balance < cf.price) { setWalletModalOpen(true); return; }
          setBalance(prev => prev - cf.price);
          setInventory({ ...inventory, [user.id]: { ...userInv, cardFrames: [...(userInv.cardFrames || []), cf.id] } });
          const updated = { ...user, cardFrame: cf.class };
          setUser(updated);
          localStorage.setItem('aws_active_user', JSON.stringify(updated));
          setTasks(tasks.map(t => t.author_id === user.id ? { ...t, card_frame: cf.class } : t));
          showToast(`Премиум рамка куплена!`);
        }
      };

      const handleCreateTask = (e) => {
        e.preventDefault();
        if (!newTitle.trim()) return;

        const authorName = user ? user.name : 'Guest Client';
        const authorId = user ? user.id : 'guest_1';
        const budgetVal = Number(newBudget) || 150000;

        const finalPhotos = taskPhotos.length > 0 ? taskPhotos : ['https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80'];

        const taskObj = {
          id: Date.now(),
          category: newCategory,
          title: newTitle,
          prompt: newPrompt || 'ТЗ обсуждается в чате',
          tool: newTool,
          budget: budgetVal,
          response_fee: calculateResponseFee(budgetVal),
          currency: 'AWS',
          author: authorName,
          author_id: authorId,
          card_frame: user?.cardFrame || 'card-frame-default',
          executor_id: null,
          status: 'open',
          hidden: false,
          views: 0,
          mainPhotoIndex: mainPhotoIndex < finalPhotos.length ? mainPhotoIndex : 0,
          photos: finalPhotos
        };

        try {
          const newArr = [taskObj, ...tasks];
          localStorage.setItem('aws_db_tasks_v3', JSON.stringify(newArr));
          setTasks(newArr);
          showToast('Таск успешно опубликован!');
          setNewTitle(''); setNewPrompt(''); setTaskPhotos([]); setMainPhotoIndex(0);
          setTab('feed');
        } catch(err) {
          showToast('Слишком много тяжелых фото (память заполнена). Удалите пару штук.', 'error');
        }
      };

      // ИСПРАВЛЕНО: Мультимодальная интеграция настоящих API (Текст и Перевод)
      const handleGenerateAI = async (e) => {
        e.preventDefault();
        if (!aiPrompt.trim()) return;
        const fee = aiMode === 'video' ? 150 : aiMode === 'text' ? 20 : 50;
        
        if (balance < fee) {
          alert(`Недостаточно AWS. Стоимость: ${fee} AWS.`);
          setWalletModalOpen(true);
          return;
        }

        setBalance(prev => prev - fee);
        setAiLoading(true);
        setAiResultImg(null);
        setAiResultText('');
        setAiResultVideo(null);

        try {
          if (aiMode === 'image') {
            // Перевод русского промпта на английский для корректной генерации
            const translateUrl = `https://text.pollinations.ai/Translate this exact prompt into English for an AI image generator (respond with translation ONLY, no quotes, no conversational text): ${encodeURIComponent(aiPrompt)}`;
            
            let englishPrompt = aiPrompt;
            try {
              const transRes = await fetch(translateUrl);
              englishPrompt = await transRes.text();
            } catch (err) {
              console.warn("Translation fallback used");
            }

            const cleanSeed = Math.floor(Math.random() * 99999999);
            // Добавляем кинематографичные теги к переведенному промпту
            const fullPrompt = `${englishPrompt}, 8k, photorealistic, hyper-detailed cinematic lighting, octane render, masterpiece`;
            const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?width=1280&height=720&seed=${cleanSeed}&nologo=true`;

            const img = new Image();
            img.src = imageUrl;
            img.onload = () => { setAiResultImg(imageUrl); setAiLoading(false); };
            img.onerror = () => { setAiLoading(false); showToast('Ошибка рендеринга', 'error'); };

          } else if (aiMode === 'text') {
            // Запрос к реальному текстовому AI (Claude 3.5 Sonnet / Mistral via Pollinations text)
            const promptUrl = `https://text.pollinations.ai/${encodeURIComponent(aiPrompt)}`;
            const response = await fetch(promptUrl);
            const textData = await response.text();
            setAiResultText(textData);
            setAiLoading(false);
          } else {
            // Видео пока эмулируется превью-клипом
            setTimeout(() => {
              setAiResultVideo('https://assets.mixkit.co/videos/preview/mixkit-futuristic-city-with-flying-traffic-at-night-41549-large.mp4');
              setAiLoading(false);
            }, 2500);
          }
        } catch (err) {
          setAiLoading(false);
          showToast('Сбой подключения к нейросети', 'error');
        }
      };

      const handleSaveEditedTask = (e) => {
        e.preventDefault();
        const b = Number(editingTask.budget) || 1000;
        setTasks(tasks.map(t => t.id === editingTask.id ? { ...editingTask, budget: b, response_fee: calculateResponseFee(b) } : t));
        setEditingTask(null);
        showToast('Изменения сохранены');
      };

      const handleToggleHideTask = (taskId) => {
        setTasks(tasks.map(t => t.id === taskId ? { ...t, hidden: !t.hidden } : t));
      };

      const handleDeleteTask = (taskId) => {
        if (confirm('Удалить этот таск безвозвратно?')) {
          setTasks(tasks.filter(t => t.id !== taskId));
          showToast('Таск удален');
        }
      };

      const handleChangeTaskFrame = (taskId, frameClass) => {
        setTasks(tasks.map(t => t.id === taskId ? { ...t, card_frame: frameClass } : t));
      };

      const isChatUnlocked = (taskId, authorId) => {
        if (!user) return true; // Демо

        setDealMessages(prev => ({ ...prev, [selectedTaskForChat.id]: [...(prev[selectedTaskForChat.id] || []), sysMsg] }));

                  <button type="submit" className="w-full py-3 bg-cyan-500 text-black font-bold text-sm rounded-xl hover:bg-cyan-400">Сохранить</button>
                </form>
              </div>
            </div>
          )}

          {/* TASK VIEW MODAL WITH GALLERY */}
          {viewingTask && (
            <div className="fixed inset-0 z-[50] bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0D121F] border border-cyan-500/40 rounded-2xl p-5 sm:p-7 max-w-2xl w-full max-h-[90vh] flex flex-col relative overflow-y-auto">
                <button onClick={() => setViewingTask(null)} className="absolute top-4 right-4 text-slate-400 hover:text-white z-20 bg-black/50 w-8 h-8 rounded-full"><i className="fa-solid fa-xmark"></i></button>

                <div className="relative w-full h-64 sm:h-80 rounded-xl overflow-hidden bg-slate-950 mb-4 border border-slate-800">
                  <img src={viewingTask.photos[currentPhotoSlide] || viewingTask.photos[0]} className="w-full h-full object-contain" />
                  {viewingTask.photos.length > 1 && (
                    <>
                      <button onClick={() => setCurrentPhotoSlide(prev => prev > 0 ? prev - 1 : viewingTask.photos.length - 1)} className="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/70 text-white hover:bg-black"><i className="fa-solid fa-chevron-left"></i></button>
                      <button onClick={() => setCurrentPhotoSlide(prev => prev < viewingTask.photos.length - 1 ? prev + 1 : 0)} className="absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/70 text-white hover:bg-black"><i className="fa-solid fa-chevron-right"></i></button>
                      <div className="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-1.5 bg-black/60 px-3 py-1 rounded-full backdrop-blur-md">
                        {viewingTask.photos.map((_, i) => <div key={i} className={`w-2 h-2 rounded-full ${currentPhotoSlide === i ? 'bg-cyan-400' : 'bg-slate-600'}`} />)}
                      </div>
                    </>
                  )}
                </div>

                <div className="space-y-3">
                  <div className="flex justify-between items-center">
                    <span className="text-xs bg-cyan-950 text-cyan-400 border border-cyan-800/40 px-2.5 py-1 rounded font-mono font-bold">{viewingTask.tool}</span>
                    <div className="font-mono text-xl font-extrabold text-cyan-400">{viewingTask.budget.toLocaleString()} AWS</div>
                  </div>
                  <h2 className="text-lg font-bold text-slate-100">{viewingTask.title}</h2>
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 text-xs font-mono text-slate-300 whitespace-pre-wrap"><span className="text-cyan-400">ТЗ:</span> {viewingTask.prompt}</div>

                  {isChatUnlocked(viewingTask.id, viewingTask.author_id) ? (
                    <button onClick={() => openTaskChat(viewingTask)} className="w-full py-3.5 rounded-xl bg-cyan-500 text-black font-bold text-sm hover:bg-cyan-400">Перейти в чат сделки</button>
                  ) : (
                    <button onClick={() => handleUnlockAndEnterChat(viewingTask)} className="w-full py-3.5 rounded-xl bg-amber-500 text-black font-bold text-sm hover:bg-amber-400">Оплатить отклик ({viewingTask.response_fee} AWS)</button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* WALLET / CASHIER */}
          {walletModalOpen && (
            <div className="fixed inset-0 z-[60] bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0D121F] border border-cyan-500/40 rounded-2xl p-5 sm:p-7 max-w-sm w-full relative">
                <button onClick={() => setWalletModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white"><i className="fa-solid fa-xmark text-lg"></i></button>
                <h3 className="text-lg font-bold text-slate-100 mb-1">Касса (100 AWS = 100 USDT)</h3>
                
                <div className="grid grid-cols-3 gap-2 mt-4 mb-3">
                  {Object.entries(CRYPTO_RATES).map(([key, item]) => (
                    <button key={key} onClick={() => setSelectedCurrency(key)} className={`p-2 rounded-xl border text-center ${selectedCurrency === key ? 'bg-cyan-500/20 border-cyan-400 text-cyan-300' : 'bg-slate-950 border-slate-800 text-slate-400'}`}>
                      <div className="text-xs font-bold">{item.symbol}</div>
                    </button>
                  ))}
                </div>

                <input type="number" value={depositAmountAWS} onChange={(e) => setDepositAmountAWS(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm font-mono text-cyan-300 outline-none mb-3" placeholder="Сумма в AWS" />
                <div className="p-3 bg-cyan-950/40 border border-cyan-500/30 rounded-xl text-xs flex justify-between mb-4">
                  <span>К оплате:</span>
                  <span className="font-mono font-bold text-cyan-400">{(Number(depositAmountAWS) * CRYPTO_RATES[selectedCurrency].rate).toFixed(2)} {CRYPTO_RATES[selectedCurrency].symbol}</span>
                </div>

                <button onClick={() => { 
                  const added = Number(depositAmountAWS); 
                  setBalance(prev => prev + added); 
                  setPlatformStats(prev => ({...prev, purchasedAWS: prev.purchasedAWS + added}));
                  showToast(`Баланс пополнен на ${added} AWS!`); 
                  setWalletModalOpen(false); 
                }} className="w-full py-3 rounded-xl bg-cyan-500 text-black font-bold text-sm">Подтвердить оплату</button>
              </div>
            </div>
          )}

          {/* AUTH */}
          {authModalOpen && (
            <div className="fixed inset-0 z-[60] bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0D121F] border border-cyan-500/40 rounded-2xl p-5 sm:p-7 max-w-sm w-full relative">
                <button onClick={() => setAuthModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white"><i className="fa-solid fa-xmark text-lg"></i></button>

                {authMode === 'login' ? (
                  <>
                    <h3 className="text-lg font-bold text-slate-100 mb-4">Вход в аккаунт</h3>
                    <form onSubmit={handleLogin} className="space-y-3">
                      <input type="email" required placeholder="Email" value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm outline-none" />
                      <input type="password" required placeholder="Пароль" value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm outline-none" />
                      <button type="submit" className="w-full py-3 rounded-xl bg-cyan-500 text-black font-bold text-sm">Войти</button>
                    </form>
                    <button onClick={() => setAuthMode('register')} className="mt-4 text-xs text-cyan-400 underline w-full text-center">Регистрация (+1000 AWS)</button>
                  </>
                ) : authMode === 'register' ? (
                  <>
                    <h3 className="text-lg font-bold text-slate-100 mb-4">Регистрация <span className="text-[10px] bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded-full ml-2">+1000 AWS</span></h3>
                    <form onSubmit={handleStartRegister} className="space-y-3">
                      <input type="email" required placeholder="Email" value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm outline-none" />
                      <input type="password" required placeholder="Пароль (от 6 символов)" value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm outline-none" />
                      <button type="submit" className="w-full py-3 rounded-xl bg-cyan-500 text-black font-bold text-sm">Получить код</button>
                    </form>
                  </>
                ) : (
                  <>
                    <h3 className="text-lg font-bold text-slate-100 mb-4">Ввод OTP-кода</h3>
                    <div className="text-center font-mono text-cyan-400 bg-cyan-950/30 p-2 rounded mb-3 border border-cyan-500/20">Ваш код: {generatedOtp}</div>
                    <form onSubmit={handleVerifyEmail} className="space-y-3">
                      <input type="text" required maxLength="6" placeholder="Код" value={verificationCode} onChange={(e) => setVerificationCode(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-center tracking-widest text-lg font-mono outline-none focus:border-cyan-500" />
                      <button type="submit" className="w-full py-3 rounded-xl bg-emerald-500 text-black font-bold text-sm">Подтвердить</button>
                    </form>
                  </>
                )}
              </div>
            </div>
          )}

          {/* Футер */}
          <footer className="mt-auto border-t border-cyan-500/20 bg-[#06080C] px-4 py-8 text-xs text-slate-400">
            <div className="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
              <div className="text-center md:text-left">
                <div className="font-bold text-slate-200 text-sm">AI WORKERS SPACE</div>
                <div className="font-mono text-[10px]">Самозанятая: Храппа М.Н. • ИНН: 390400469138</div>
              </div>
              <div className="text-center md:text-right font-mono text-[10px] text-slate-500">© 2026 AI WORKERS SPACE. Все права защищены.</div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>AI WORKERS SPACE — Биржа AI Креаторов</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html { scroll-behavior: smooth; background-color: #05070A; }
    body { background-color: #05070A; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; min-height: 100vh; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Рамки аватаров */
    .frame-none { border: 2px solid transparent; }
    .frame-cyan { border: 2px solid #06b6d4; box-shadow: 0 0 10px rgba(6, 182, 212, 0.7); }
    .frame-emerald { border: 2px solid #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.8); }
    @keyframes rainbow-pulsate { 0% { border-color: #ec4899; box-shadow: 0 0 15px rgba(236, 72, 153, 0.8); } 50% { border-color: #f59e0b; box-shadow: 0 0 25px rgba(245, 158, 11, 1); } 100% { border-color: #ec4899; box-shadow: 0 0 15px rgba(236, 72, 153, 0.8); } }
    .frame-rainbow-mythic { border: 2.5px solid #ec4899; animation: rainbow-pulsate 2.5s infinite ease-in-out; }
    
    /* Рамки карточек */
    .card-frame-default { border: 1px solid rgba(30, 41, 59, 0.8); }
    .card-frame-neon { border: 1.5px solid #06b6d4; box-shadow: 0 0 20px rgba(6, 182, 212, 0.15); }
    .card-frame-cyber { border: 1.5px solid #d946ef; box-shadow: 0 0 20px rgba(217, 70, 239, 0.15); }
    @keyframes fire-pulsate { 0% { border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.3); } 50% { border-color: #f97316; box-shadow: 0 0 30px rgba(249, 115, 22, 0.5); } 100% { border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.3); } }
    .card-frame-fire-ultra { border: 2px solid #ef4444; animation: fire-pulsate 2s infinite ease-in-out; }
    
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .toast-enter { animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    
    .glass-panel { background: rgba(13, 18, 31, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- FIREBASE CLOUD MODULES -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, collection, doc, setDoc, onSnapshot, deleteDoc, getDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    window.Firebase = { initializeApp, getAuth, signInAnonymously, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, getFirestore, collection, doc, setDoc, onSnapshot, deleteDoc, getDoc };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const TELEGRAM_LINK = "https://t.me/aiworkersspace";
    const ADMIN_EMAIL = "kenigwood39@gmail.com";

    // ИСПРАВЛЕННЫЙ КЛЮЧ FIREBASE ПРИЛОЖЕНИЯ
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyBI6K0YuwV6jAHvUg2x8Y2dX-FuTLfDgd0",
      authDomain: "ai-workers-space.firebaseapp.com",
      projectId: "ai-workers-space",
      storageBucket: "ai-workers-space.firebasestorage.app",
      messagingSenderId: "6761091660",
      appId: "1:6761091660:web:8628d352b4a8804c2edae9",
      measurementId: "G-VFM3W6YCBQ"
    };

    // Сжатие фото перед загрузкой
    const compressImage = (file) => {
      return new Promise((resolve) => {
        const reader = new FileReader(); reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image(); img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 600;
            const scaleSize = MAX_WIDTH / img.width;
            canvas.width = MAX_WIDTH; canvas.height = img.height * scaleSize;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          };
        };
      });
    };

    // Экономика
    const calculateResponseFee = (b) => { b = Number(b) || 0; if (b <= 2000) return 100; if (b <= 5000) return Math.max(100, Math.round(b * 0.05)); return Math.round(250 + ((b - 5000) / 95000) * 950); };
    const CRYPTO_RATES = { usdt: { rate: 1.0, symbol: 'USDT' }, ton: { rate: 0.18, symbol: 'TON' }, trx: { rate: 6.8, symbol: 'TRX' }, rub: { rate: 92.5, symbol: 'RUB' } };
    
    // Магазин
    const MINIMAL_AVATARS = [
      { id: 'm1', url: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&q=80', name: 'Dark Sphere', price: 0 },
      { id: 'm2', url: 'https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?w=300&q=80', name: 'Minimal Glow', price: 0 },
      { id: 'm3', url: 'https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?w=300&q=80', name: 'Glass Wave', price: 500 },
      { id: 'm4', url: 'https://images.unsplash.com/photo-1634926878768-2a5b3c42f139?w=300&q=80', name: 'VIP Gold', price: 5000 }
    ];
    const AVATAR_FRAMES = [ 
      { id: 'f0', name: 'Без рамки', class: 'frame-none', price: 0 }, 
      { id: 'f1', name: 'Cyan Glow', class: 'frame-cyan', price: 500 }, 
      { id: 'f5', name: 'Rainbow Mythic ✨', class: 'frame-rainbow-mythic', price: 5000 } 
    ];
    const TASK_CARD_FRAMES = [ 
      { id: 'c0', name: 'Стандарт', class: 'card-frame-default', price: 0 }, 
      { id: 'c1', name: 'Неон Cyan', class: 'card-frame-neon', price: 1000 }, 
      { id: 'c2', name: 'Кибер Маджента', class: 'card-frame-cyber', price: 2500 },
      { id: 'c4', name: 'Fire Ultra 🔥', class: 'card-frame-fire-ultra', price: 10000 } 
    ];

    function App() {
      const [db, setDb] = useState(null);
      const [auth, setAuth] = useState(null);
      const [appId] = useState('aws-platform-v1');
      const [isGlobalMode, setIsGlobalMode] = useState(false);
      const [isDbReady, setIsDbReady] = useState(false);

      const [tab, setTab] = useState('feed'); 
      const [cabinetSubTab, setCabinetSubTab] = useState('my-orders');
      
      const [user, setUser] = useState(null);
      const [balance, setBalance] = useState(0);
      const [tasks, setTasks] = useState([]);
      const [inventory, setInventory] = useState({ avatars: [], frames: [], cardFrames: [] });
      const [paidUnlocks, setPaidUnlocks] = useState([]);

      const isAdmin = user && user.email?.toLowerCase() === ADMIN_EMAIL.toLowerCase();

      // UI States
      const [toasts, setToasts] = useState([]);
      const [selectedCat, setSelectedCat] = useState('All');
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authError, setAuthError] = useState('');
      const [authLoading, setAuthLoading] = useState(false);
      
      const [walletModalOpen, setWalletModalOpen] = useState(false);
      const [selectedCurrency, setSelectedCurrency] = useState('usdt');
      const [depositAmountAWS, setDepositAmountAWS] = useState('1000');
      
      // Create Task States
      const [newTitle, setNewTitle] = useState('');
      const [newCategory, setNewCategory] = useState('video');
      const [newPrompt, setNewPrompt] = useState('');
      const [newBudget, setNewBudget] = useState('15000');
      const [newTool, setNewTool] = useState('ComfyUI');
      const [taskPhotos, setTaskPhotos] = useState([]);

      // Viewing & Chat States
      const [viewingTask, setViewingTask] = useState(null);
      const [currentPhotoSlide, setCurrentPhotoSlide] = useState(0);
      const [selectedTaskForChat, setSelectedTaskForChat] = useState(null);
      const [chatInput, setChatInput] = useState('');
      const chatScrollRef = useRef(null);

      // AI Studio States
      const [aiMode, setAiMode] = useState('image'); 
      const [aiPrompt, setAiPrompt] = useState('');
      const [aiResultImg, setAiResultImg] = useState(null);
      const [aiResultText, setAiResultText] = useState('');
      const [aiLoading, setAiLoading] = useState(false);

      const showToast = (message, type = 'success') => { 
        const id = Date.now(); 
        setToasts(p => [...p, { id, message, type }]); 
        setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3000); 
      };

      useEffect(() => {
        const initCloud = () => {
          if (!window.Firebase) return activateLocalFallback();
          
          try {
            const app = window.Firebase.initializeApp(FIREBASE_CONFIG);
            const firestoreDb = window.Firebase.getFirestore(app);
            const firebaseAuth = window.Firebase.getAuth(app);
            
            setDb(firestoreDb); 
            setAuth(firebaseAuth); 
            setIsGlobalMode(true);

            // Чтение базы
            window.Firebase.onSnapshot(window.Firebase.collection(firestoreDb, 'artifacts', appId, 'tasks'), (snap) => {
              const loaded = snap.docs.map(d => d.data());
              setTasks(loaded.sort((a, b) => b.id - a.id));
            }, (error) => {
              console.error("Firestore Tasks Error:", error);
              activateLocalFallback();
            });

            window.Firebase.onAuthStateChanged(firebaseAuth, async (u) => {
              if (u) {
                const profRef = window.Firebase.doc(firestoreDb, 'artifacts', appId, 'users', u.uid);
                const profSnap = await window.Firebase.getDoc(profRef);
                
                if (profSnap.exists()) {
                  const data = profSnap.data();
                  setUser(data.profile); 
                  setBalance(data.balance || 0); 
                  setInventory(data.inventory || {avatars:[],frames:[],cardFrames:[]}); 
                  setPaidUnlocks(data.paidUnlocks || []);
                } else {
                  // Создание профиля для нового юзера
                  const newProfile = { id: u.uid, email: u.email, name: u.email.split('@')[0], avatar: MINIMAL_AVATARS[0].url, avatarFrame: 'frame-none', cardFrame: 'card-frame-default' };
                  const isM = u.email === ADMIN_EMAIL.toLowerCase();
                  await window.Firebase.setDoc(profRef, { profile: newProfile, balance: isM ? 25000 : 1000, inventory: { avatars: [], frames: [], cardFrames: [] }, paidUnlocks: [] });
                  setUser(newProfile); setBalance(isM ? 25000 : 1000);
                }
              } else {
                setUser(null);
              }
              setIsDbReady(true);
            });
          } catch(e) { 
            console.error("Firebase Init Error", e); 
            activateLocalFallback(); 
          }
        };

        const activateLocalFallback = () => {
          setIsGlobalMode(false); setIsDbReady(true);
          const lT = localStorage.getItem('aws_local_tasks'); if(lT) setTasks(JSON.parse(lT));
          const lU = localStorage.getItem('aws_local_user'); if(lU) setUser(JSON.parse(lU));
          const lB = localStorage.getItem('aws_local_balance'); if(lB) setBalance(Number(lB));
          const lI = localStorage.getItem('aws_local_inv'); if(lI) setInventory(JSON.parse(lI));
          const lP = localStorage.getItem('aws_local_paid'); if(lP) setPaidUnlocks(JSON.parse(lP));
        };

        setTimeout(initCloud, 300);
      }, []);

      // Синхронизация данных пользователя
      useEffect(() => {
        if (isGlobalMode && db && user && auth?.currentUser) {
          window.Firebase.setDoc(window.Firebase.doc(db, 'artifacts', appId, 'users', auth.currentUser.uid), {
            profile: user, balance, inventory, paidUnlocks
          }, { merge: true });
        } else if (!isGlobalMode && user) {
          localStorage.setItem('aws_local_tasks', JSON.stringify(tasks)); 
          localStorage.setItem('aws_local_user', JSON.stringify(user));
          localStorage.setItem('aws_local_balance', balance.toString()); 
          localStorage.setItem('aws_local_inv', JSON.stringify(inventory));
          localStorage.setItem('aws_local_paid', JSON.stringify(paidUnlocks));
        }
      }, [user, balance, inventory, paidUnlocks, tasks, isGlobalMode, db, auth, appId]);

      // Авто-скролл чата
      useEffect(() => {
        if (chatScrollRef.current) {
          chatScrollRef.current.scrollTop = chatScrollRef.current.scrollHeight;
        }
      }, [selectedTaskForChat?.messages]);


      // ОБНОВЛЕННАЯ ФУНКЦИЯ АВТОРИЗАЦИИ
      const handleAuthSubmit = async (e) => {
        e.preventDefault(); 
        setAuthError(''); 
        setAuthLoading(true);
        const em = authEmail.trim().toLowerCase();
        
        if (!isGlobalMode) {
           if (authPassword.length < 6) {
               setAuthError('Пароль должен быть от 6 символов');
               setAuthLoading(false);
               return;
           }
           const u = { id: 'u_'+Date.now(), email: em, name: em.split('@')[0], avatar: MINIMAL_AVATARS[0].url, avatarFrame: 'frame-none', cardFrame: 'card-frame-default' };
           setUser(u); setBalance(em === ADMIN_EMAIL.toLowerCase() ? 25000 : 1000); setAuthModalOpen(false); showToast('Локальный вход выполнен'); 
           setAuthLoading(false);
           return;
        }

        try {
          if (authMode === 'register') {
            if(authPassword.length < 6) throw { code: 'auth/weak-password' };
            const cred = await window.Firebase.createUserWithEmailAndPassword(auth, em, authPassword);
            setAuthModalOpen(false); 
            showToast('Успешная регистрация! +1000 AWS');
          } else {
            await window.Firebase.signInWithEmailAndPassword(auth, em, authPassword);
            setAuthModalOpen(false); 
            showToast('Вы успешно вошли в систему!');
          }
        } catch(err) {
          console.error("Auth Error Code:", err.code, err.message);
          
          if (err.code === 'auth/api-key-not-valid') {
             setAuthError('🚨 КРИТИЧЕСКАЯ ОШИБКА: API ключ Firebase недействителен. Разработчик, обновите apiKey в коде!');
          } else if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') {
             setAuthError('Неверный email или пароль. Если у вас нет аккаунта, нажмите "Создать" ниже.');
          } else if (err.code === 'auth/email-already-in-use') {
             setAuthError('Этот email уже зарегистрирован. Пожалуйста, выполните вход.');
          } else if (err.code === 'auth/weak-password') {
             setAuthError('Пароль слишком простой (минимум 6 символов).');
          } else if (err.code === 'auth/invalid-email') {
             setAuthError('Некорректный формат email адреса.');
          } else if (err.code === 'auth/operation-not-allowed') {
             setAuthError('Авторизация по Email выключена! Включите её в консоли Firebase (Sign-in method).');
          } else {
             setAuthError(err.message || 'Произошла неизвестная ошибка авторизации.');
          }
        } finally {
          setAuthLoading(false);
        }
      };

      const handleLogout = async () => {
        if(isGlobalMode && auth) await window.Firebase.signOut(auth);
        setUser(null); 
        localStorage.removeItem('aws_local_user'); 
        showToast('Вы вышли из аккаунта');
      };

      const handleUploadTaskPhotos = async (e) => {
        const files = Array.from(e.target.files);
        for (let file of files) {
          if (taskPhotos.length >= 5) break;
          try { 
            const b64 = await compressImage(file); 
            setTaskPhotos(p => p.length >= 5 ? p : [...p, b64]); 
          } catch(err) { showToast('Ошибка сжатия фото', 'error'); }
        }
      };

      const handleCreateTask = async (e) => {
        e.preventDefault(); if (!newTitle.trim() || !user) return;
        const bVal = Number(newBudget) || 15000;
        const finalPhotos = taskPhotos.length > 0 ? taskPhotos : ['https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?w=800&q=80'];
        
        const taskObj = { 
          id: Date.now(), 
          category: newCategory, 
          title: newTitle, 
          prompt: newPrompt || 'Подробности в чате сделки', 
          tool: newTool, 
          budget: bVal, 
          response_fee: calculateResponseFee(bVal), 
          currency: 'AWS', 
          author: user.name, 
          author_id: user.id, 
          card_frame: user.cardFrame || 'card-frame-default', 
          status: 'open', 
          views: 0, 
          messages: [], 
          photos: finalPhotos, 
          hidden: false 
        };
        
        if(isGlobalMode && db) {
          await window.Firebase.setDoc(window.Firebase.doc(db, 'artifacts', appId, 'tasks', taskObj.id.toString()), taskObj);
        } else {
          setTasks([taskObj, ...tasks]);
        }
        
        showToast('Заказ опубликован в ленту!'); 
        setNewTitle(''); setNewPrompt(''); setTaskPhotos([]); setTab('feed');
      };

      const openTaskModalWithViewCount = async (task) => {
        const nViews = (task.views || 0) + 1;
        const upd = { ...task, views: nViews };
        if(isGlobalMode && db && task.author_id !== user?.id) { 
          await window.Firebase.setDoc(window.Firebase.doc(db, 'artifacts', appId, 'tasks', task.id.toString()), {views: nViews}, { merge: true }); 
        } else if(!isGlobalMode) {
          setTasks(tasks.map(t => t.id === task.id ? upd : t));
        }
        setViewingTask(upd); setCurrentPhotoSlide(0);
      };

      const handleSendDealMessage = async (e) => {
        e.preventDefault(); if (!chatInput.trim() || !selectedTaskForChat) return;
        const newMsg = { id: Date.now(), sender: user ? user.name : 'Guest', text: chatInput, isMe: user?.id === selectedTaskForChat.author_id };
        const updatedTask = { ...selectedTaskForChat, messages: [...(selectedTaskForChat.messages || []), newMsg] };
        
        if(isGlobalMode && db) {
          await window.Firebase.setDoc(window.Firebase.doc(db, 'artifacts', appId, 'tasks', updatedTask.id.toString()), updatedTask, {merge: true});
        } else {
          setTasks(tasks.map(t => t.id === updatedTask.id ? updatedTask : t));
        }
        
        setSelectedTaskForChat(updatedTask); setChatInput('');
      };

      // AI
      const handleGenerateAI = async (e) => {
        e.preventDefault(); if (!aiPrompt.trim()) return;
        const fee = aiMode === 'text' ? 15 : 50;
        if (balance < fee) { setWalletModalOpen(true); return; }

        setBalance(p => p - fee); setAiLoading(true); setAiResultImg(null); setAiResultText('');

        try {
          const isRu = /[а-яА-ЯЁё]/.test(aiPrompt); 
          let engP = aiPrompt;
          if(isRu) { 
            try { 
              const r = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=ru&tl=en&dt=t&q=${encodeURIComponent(aiPrompt)}`); 
              const d = await r.json(); 
              engP = d[0][0][0]; 
            } catch(e){} 
          }

          if (aiMode === 'image') {
            const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(engP+', highly detailed, 8k, cyberpunk, neon')}?width=1024&height=1024&seed=${Date.now()}&nologo=true`;
            const img = new Image(); 
            img.src = url; 
            img.onload = () => { setAiResultImg(url); setAiLoading(false); showToast('-50 AWS за генерацию'); }; 
            img.onerror = () => { setAiLoading(false); showToast('Ошибка рендеринга', 'error'); };
          } else if (aiMode === 'text') {
            const url = `https://text.pollinations.ai/prompt/${encodeURIComponent(aiPrompt)}`;
            const response = await fetch(url);
            const textData = await response.text();
            setAiResultText(textData);
            setAiLoading(false);
            showToast('-15 AWS за промпт');
          }
        } catch (err) { 
          setAiLoading(false); showToast('Сбой API ИИ', 'error'); 
        }
      };

      const handleBuy = (item, type) => {
        if (!user) { setAuthModalOpen(true); return; }
        const isOwned = item.price === 0 || inventory[type+'s']?.includes(item.id);

        if (isOwned) {
          let upd = { ...user };
          if(type === 'avatar') upd.avatar = item.url; 
          if(type === 'frame') upd.avatarFrame = item.class; 
          if(type === 'cardFrame') upd.cardFrame = item.class;
          
          setUser(upd); 
          if(type === 'cardFrame') {
             const updatedTasks = tasks.map(t => t.author_id === user.id ? { ...t, card_frame: item.class } : t);
             setTasks(updatedTasks);
             if(isGlobalMode && db) {
               updatedTasks.filter(t=>t.author_id===user.id).forEach(t => 
                 window.Firebase.setDoc(window.Firebase.doc(db, 'artifacts', appId, 'tasks', t.id.toString()), {card_frame: item.class}, {merge:true})
               );
             }
          }
          showToast('Экипировано!');
        } else {
          if (balance < item.price) { setWalletModalOpen(true); return; }
          setBalance(p => p - item.price);
          
          let nInv = { ...inventory }; 
          nInv[type+'s'] = [...(nInv[type+'s']||[]), item.id]; 
          setInventory(nInv);
          
          let upd = { ...user };
          if(type === 'avatar') upd.avatar = item.url; 
          if(type === 'frame') upd.avatarFrame = item.class; 
          if(type === 'cardFrame') upd.cardFrame = item.class;
          
          setUser(upd); 
          if(type === 'cardFrame') {
             const updatedTasks = tasks.map(t => t.author_id === user.id ? { ...t, card_frame: item.class } : t);
             setTasks(updatedTasks);
             if(isGlobalMode && db) {
               updatedTasks.filter(t=>t.author_id===user.id).forEach(t => 
                 window.Firebase.setDoc(window.Firebase.doc(db, 'artifacts', appId, 'tasks', t.id.toString()), {card_frame: item.class}, {merge:true})
               );
             }
          }
          showToast('Покупка успешна! ✨');
        }
      };

      const feedTasks = tasks.filter(t => !t.hidden && (selectedCat === 'All' || t.category === selectedCat));
      const myCreatedTasks = tasks.filter(t => user && t.author_id === user.id);
      const myRespondedTasks = tasks.filter(t => user && paidUnlocks.includes(t.id));

      if (!isDbReady) return (
        <div className="min-h-screen bg-[#05070A] flex flex-col items-center justify-center text-cyan-400 font-mono gap-4">
          <i className="fa-solid fa-circle-notch fa-spin text-4xl"></i>
          <span className="animate-pulse">Подключение к матрице AWS...</span>
        </div>

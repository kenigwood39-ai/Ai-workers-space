      const toggleLang = () => {
        setLang(prev => prev === 'ru' ? 'en' : 'ru');
      };

      const handleStartRegister = (e) => {
        e.preventDefault();
        setAuthError('');
        if (authPassword.length < 6) {
          setAuthError(lang === 'ru' ? 'Пароль должен содержать минимум 6 символов' : 'Password must be at least 6 chars');
          return;
        }
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        setGeneratedOtp(code);
        setAuthMode('verify_email');
      };

      const handleVerifyEmail = (e) => {
        e.preventDefault();
        if (verificationCode.trim() !== generatedOtp) {
          setAuthError(lang === 'ru' ? 'Неверный код подтверждения!' : 'Invalid verification code!');
          return;
        }
        const cleanEmail = authEmail.trim().toLowerCase();
        const newUser = {
          id: 'user_' + btoa(cleanEmail).substring(0, 10),
          email: cleanEmail,
          name: cleanEmail.split('@')[0],
          verified: true
        };
        setUser(newUser);
        localStorage.setItem('aws_active_user', JSON.stringify(newUser));
        setAuthModalOpen(false);
        setAuthEmail('');
        setAuthPassword('');
        setVerificationCode('');
      };

      const handleLogin = (e) => {
        e.preventDefault();
        setAuthError('');
        const cleanEmail = authEmail.trim().toLowerCase();
        const loggedUser = {
          id: 'user_' + btoa(cleanEmail).substring(0, 10),
          email: cleanEmail,
          name: cleanEmail.split('@')[0],
          verified: true
        };
        setUser(loggedUser);
        localStorage.setItem('aws_active_user', JSON.stringify(loggedUser));

        setAuthEmail('');
        setAuthPassword('');
      };

        setUser(null);

        if (favorites.includes(taskId)) {
          setFavorites(favorites.filter(id => id !== taskId));
        } else {
          setFavorites([...favorites, taskId]);

        e.preventDefault();
        if (!user) {
          setAuthModalOpen(true);
          return;

        if (!newTitle || !newBudget) return;

        const taskBudget = Number(newBudget);
        if (balance < taskBudget) {
          setWalletModalOpen(true);
          return;
        }

          id: Date.now(),
          category: newCategory,
          title: newTitle,
          title_en: newTitle,
          prompt: newPrompt || 'Detailed specification provided directly in deal chat.',
          tool: newTool,
          budget: taskBudget,

          author: user.name,
          author_id: user.id,
          executor_id: null,
          status: 'open',
          views: 1,

        setTasks([taskObj, ...tasks]);
        setNewTitle('');
        setNewPrompt('');
        setNewBudget('');
        setTab('cabinet');
        setCabinetSubTab('my-orders');

        if (!user) {
          setAuthModalOpen(true);

            return { ...t, status: 'in_progress', executor_id: user.id };

        const target = updated.find(t => t.id === taskId);
        openTaskChat(target);

        if (!chatInput.trim() || !selectedTaskForChat) return;

        const newMsg = {
          id: Date.now(),
          sender: user ? user.name : (lang === 'ru' ? 'Вы' : 'You'),
          text: chatInput,
          isMe: true
        };

        setDealMessages(prev => ({
          ...prev,
          [selectedTaskForChat.id]: [...(prev[selectedTaskForChat.id] || []), newMsg]
        }));
        setChatInput('');
      };

      const handleSubmitWork = () => {
        if (!selectedTaskForChat) return;
        const updated = tasks.map(t => t.id === selectedTaskForChat.id ? { ...t, status: 'review' } : t);
        setTasks(updated);
        setSelectedTaskForChat({ ...selectedTaskForChat, status: 'review' });

        const sysMsg = {
          id: Date.now(),
          sender: 'System',
          text: lang === 'ru' ? '📤 Исполнитель отправил работу на проверку. Заказчик, проверьте результат и нажмите «Принять работу».' : '📤 Creator submitted work for review. Client, verify deliverable and click Approve.',
          isMe: false
        };
        setDealMessages(prev => ({
          ...prev,
          [selectedTaskForChat.id]: [...(prev[selectedTaskForChat.id] || []), sysMsg]
        }));
      };

      const handleApproveWork = () => {
        if (!selectedTaskForChat) return;
        const updated = tasks.map(t => t.id === selectedTaskForChat.id ? { ...t, status: 'completed' } : t);
        setTasks(updated);
        setSelectedTaskForChat({ ...selectedTaskForChat, status: 'completed' });

        const netPayout = Math.round(selectedTaskForChat.budget * 0.9);
        const commission = selectedTaskForChat.budget - netPayout;

        if (user && selectedTaskForChat.executor_id === user.id) {
          setBalance(prev => prev + netPayout);
        }

        const sysMsg = {
          id: Date.now(),
          sender: 'Escrow Protocol',
          text: lang === 'ru' ? `🎉 Сделка завершена! ${netPayout} AWS переведены исполнителю (комиссия биржи 10%: ${commission} AWS).` : `🎉 Deal completed! ${netPayout} AWS released to creator (10% platform fee: ${commission} AWS).`,
          isMe: false
        };
        setDealMessages(prev => ({
          ...prev,
          [selectedTaskForChat.id]: [...(prev[selectedTaskForChat.id] || []), sysMsg]
        }));
      };

      const handleConfirmDeposit = () => {
        const added = Number(depositAmount);
        if (added > 0) {
          setBalance(prev => prev + added);
          setDepositSuccess(true);
          setTimeout(() => {
            setDepositSuccess(false);
            setWalletModalOpen(false);
          }, 1500);
        }
      };

      const handleWithdraw = (e) => {
        e.preventDefault();
        const amt = Number(withdrawAmount);
        if (amt > 0 && amt <= balance) {
          setBalance(prev => prev - amt);
          alert(lang === 'ru' ? `Заявка на вывод ${amt} AWS на кошелек ${withdrawAddress} отправлена!` : `Withdrawal request for ${amt} AWS sent to ${withdrawAddress}!`);
          setWithdrawAmount('');
          setWithdrawAddress('');

        }

                  <>
                    <h3 className="text-lg font-bold text-slate-100 mb-1">
                      {lang === 'ru' ? 'Подтверждение Email' : 'Verify Email'}
                    </h3>
                    <p className="text-xs text-slate-400 mb-2">
                      {lang === 'ru' ? `Код отправлен на ${authEmail}` : `Code sent to ${authEmail}`}
                    </p>
                    <div className="p-2.5 mb-3 rounded-xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 text-xs font-mono text-center">
                      OTP: <b>{generatedOtp}</b>
                    </div>
                    {authError && <div className="p-2.5 mb-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs">{authError}</div>}
                    <form onSubmit={handleVerifyEmail} className="space-y-3">
                      <input
                        type="text"
                        required
                        maxLength="6"
                        placeholder="6-digit code"
                        value={verificationCode}
                        onChange={(e) => setVerificationCode(e.target.value)}
                        className="w-full bg-slate-950 border border-cyan-500 text-center text-lg font-mono tracking-widest rounded-xl px-3.5 py-2.5 text-cyan-300 outline-none"
                      />
                      <button type="submit" className="w-full py-3 rounded-xl bg-emerald-500 text-black font-bold text-sm hover:bg-emerald-400">
                        {lang === 'ru' ? 'Подтвердить и войти' : 'Confirm & Proceed'}
                      </button>
                    </form>
                  </>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

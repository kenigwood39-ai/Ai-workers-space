<!DOCTYPE html>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #07090E; color: #f1f5f9; font-family: system-ui, sans-serif; -webkit-overflow-scrolling: touch; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .frame-cyan { border: 2px solid #06b6d4; box-shadow: 0 0 10px rgba(6, 182, 212, 0.7); }
    .frame-fuchsia { border: 2px solid #d946ef; box-shadow: 0 0 12px rgba(217, 70, 239, 0.8); }
    @keyframes pulse-rainbow { 0% { border-color: #ec4899; box-shadow: 0 0 10px #ec4899; } 50% { border-color: #f59e0b; box-shadow: 0 0 20px #f59e0b; } 100% { border-color: #ec4899; box-shadow: 0 0 10px #ec4899; } }
    .frame-rainbow { border: 2px solid #ec4899; animation: pulse-rainbow 2s infinite; }

<body>
  <div id="root"></div>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, collection, doc, setDoc, onSnapshot, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    window.firebaseApp = initializeApp; window.firebaseAuth = { getAuth, signInAnonymously, signInWithCustomToken }; window.firebaseDb = { getFirestore, collection, doc, setDoc, onSnapshot, deleteDoc };
  </script>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const ADMIN_EMAIL = "kenigwood39@gmail.com";
    const TG_LINK = "https://t.me/aiworkersspace";

    const compressImg = (file) => new Promise((res) => {
      const r = new FileReader(); r.readAsDataURL(file);
      r.onload = (e) => {
        const img = new Image(); img.src = e.target.result;
        img.onload = () => {
          const cvs = document.createElement('canvas'); const scale = 600 / img.width;
          cvs.width = 600; cvs.height = img.height * scale;
          cvs.getContext('2d').drawImage(img, 0, 0, cvs.width, cvs.height);
          res(cvs.toDataURL('image/jpeg', 0.6));
        };
      };
    });

    const getFee = (b) => { const v = Number(b)||0; if(v<=5000) return Math.max(100, Math.round(v*0.05)); return Math.round(250 + ((v-5000)/95000)*950); };

    function App() {
      const [tab, setTab] = useState('feed');
      const [user, setUser] = useState(null);
      const [balance, setBalance] = useState(1000);
      const [tasks, setTasks] = useState([]);
      const [dbReady, setDbReady] = useState(false);
      const [dbInstance, setDbInstance] = useState(null);
      const [appId, setAppId] = useState('aws-demo-1');
      
      const [authModal, setAuthModal] = useState(false);
      const [authStep, setAuthStep] = useState(1);
      const [email, setEmail] = useState('');
      const [pass, setPass] = useState('');
      const [code, setCode] = useState('');
      
      const [nTitle, setNTitle] = useState('');
      const [nCat, setNCat] = useState('video');
      const [nBudget, setNBudget] = useState('150000');
      const [nPrompt, setNPrompt] = useState('');
      const [nPhotos, setNPhotos] = useState([]);

      const [aiMode, setAiMode] = useState('image');
      const [aiPrompt, setAiPrompt] = useState('');
      const [aiRes, setAiRes] = useState(null);
      const [aiLoad, setAiLoading] = useState(false);

      const [toasts, setToasts] = useState([]);
      const showT = (msg) => { const id=Date.now(); setToasts(p=>[...p,{id,msg}]); setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)), 3000); };

      useEffect(() => {
        const initDB = async () => {
          try {
            if(typeof __firebase_config !== 'undefined') {
              const cfg = JSON.parse(__firebase_config);
              const app = window.firebaseApp(cfg); const auth = window.firebaseAuth.getAuth(app); const db = window.firebaseDb.getFirestore(app);
              setDbInstance(db); setAppId(typeof __app_id !== 'undefined' ? __app_id : 'default');
              if(typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await window.firebaseAuth.signInWithCustomToken(auth, __initial_auth_token);
              else await window.firebaseAuth.signInAnonymously(auth);
              
              window.firebaseDb.onSnapshot(window.firebaseDb.collection(db, 'artifacts', appId, 'public', 'data', 'aws_tasks'), (snap) => {
                setTasks(snap.docs.map(d => d.data()).sort((a,b)=>b.id-a.id));
              }, console.error);
            } else {
               // Fallback In-Memory Ð´Ð»Ñ Vercel
               const sT = sessionStorage.getItem('aws_t'); if(sT) setTasks(JSON.parse(sT));
               const sU = sessionStorage.getItem('aws_u'); if(sU) setUser(JSON.parse(sU));
            }
            setDbReady(true);
          } catch(e) { setDbReady(true); }
        };
        setTimeout(initDB, 500); // ÐÐ´ÐµÐ¼ Ð·Ð°Ð³ÑÑÐ·ÐºÐ¸ Ð¼Ð¾Ð´ÑÐ»ÐµÐ¹
      }, []);

      const saveTask = async (t) => {
        if(dbInstance) await window.firebaseDb.setDoc(window.firebaseDb.doc(dbInstance, 'artifacts', appId, 'public', 'data', 'aws_tasks', t.id.toString()), t);
        else { const n = [t, ...tasks.filter(x=>x.id!==t.id)]; setTasks(n); sessionStorage.setItem('aws_t', JSON.stringify(n)); }
      };

      const handleAuth = (e) => {
        e.preventDefault();
        if(authStep===1) { if(pass.length<6) return showT('ÐÐ°ÑÐ¾Ð»Ñ Ð¾Ñ 6 ÑÐ¸Ð¼Ð².'); setAuthStep(2); }
        else {
          if(code !== '777777') return showT('ÐÐµÐ²ÐµÑÐ½ÑÐ¹ ÐºÐ¾Ð´!');
          const isM = email.toLowerCase() === ADMIN_EMAIL;
          const u = { id: Date.now().toString(), name: email.split('@')[0], email, avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200&q=80', frame: 'frame-none', card: 'card-def' };
          setUser(u); setBalance(isM ? 25000 : 1000); setAuthModal(false); sessionStorage.setItem('aws_u', JSON.stringify(u)); showToast('ÐÑ Ð²Ð¾ÑÐ»Ð¸! +1000 AWS');
        }
      };

      const handleCreate = async (e) => {
        e.preventDefault(); if(!nTitle) return;
        const b = Number(nBudget)||1000;
        const t = { id: Date.now(), title: nTitle, cat: nCat, budget: b, prompt: nPrompt||'Ð¢Ð Ð² ÑÐ°ÑÐµ', fee: getFee(b), photos: nPhotos.length?nPhotos:['https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&q=80'], author: user?user.name:'ÐÐ¾ÑÑÑ', author_id: user?user.id:'1', frame: user?.card||'card-def', views: 0 };
        await saveTask(t); showT('Ð¢Ð°ÑÐº Ð¾Ð¿ÑÐ±Ð»Ð¸ÐºÐ¾Ð²Ð°Ð½!'); setNTitle(''); setNPrompt(''); setNPhotos([]); setTab('feed');
      };

      const handleAI = async (e) => {
        e.preventDefault(); if(!aiPrompt) return;
        if(balance<50) return showT('ÐÐ°Ð»Ð¾ AWS'); setBalance(p=>p-50); setAiLoading(true); setAiRes(null);

          let p = aiPrompt;

          }

            const img = new Image(); img.src=url; img.onload=()=>{setAiRes({type:'img',url}); setAiLoading(false);};
          } else {
            setTimeout(()=>{ setAiRes({type:'txt', text:`[Claude 3.5]: ÐÐ½Ð°Ð»Ð¸Ð· "${aiPrompt}" Ð·Ð°Ð²ÐµÑÑÐµÐ½. ÐÐ¾Ð´ Ð³Ð¾ÑÐ¾Ð² Ðº Ð´ÐµÐ¿Ð»Ð¾Ñ.`}); setAiLoading(false); }, 1500);
          }
        } catch(e) { setAiLoading(false); showT('ÐÑÐ¸Ð±ÐºÐ° AI'); }
      };

      return (
        <div className="min-h-screen flex flex-col font-sans">
          <div className="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none">
            {toasts.map(t=><div key={t.id} className="px-4 py-2 bg-emerald-500/90 text-white text-xs font-bold rounded-lg shadow-lg">{t.msg}</div>)}

          <header className="sticky top-0 z-40 bg-[#07090E]/95 backdrop-blur border-b border-cyan-500/20 px-3 py-2.5 flex justify-between items-center">
            <div className="flex items-center gap-2 cursor-pointer" onClick={()=>setTab('feed')}>

              <span className="font-bold text-sm text-cyan-400 hidden sm:block">AI WORKERS</span>

            <div className="flex items-center gap-2">

              <div className="px-2.5 py-1.5 bg-amber-500/10 text-amber-400 rounded-lg text-xs font-mono font-bold"><i className="fa-solid fa-coins"></i> {balance} AWS</div>
              {user ? <button onClick={()=>setUser(null)} className="px-2.5 py-1.5 bg-red-500/10 text-red-400 rounded-lg text-xs"><i className="fa-solid fa-power-off"></i></button> : <button onClick={()=>setAuthModal(true)} className="px-3 py-1.5 bg-cyan-500 text-black font-bold text-xs rounded-lg">ÐÑÐ¾Ð´</button>}
            </div>
          </header>

          <main className="flex-1 w-full max-w-5xl mx-auto px-3 py-4 grid grid-cols-1 md:grid-cols-4 gap-4">
            <aside className="flex md:flex-col gap-2 overflow-x-auto no-scrollbar pb-2 md:pb-0">
              {[{id:'feed',icon:'fa-list',n:'ÐÐµÐ½ÑÐ°'},{id:'create',icon:'fa-plus',n:'Ð¡Ð¾Ð·Ð´Ð°ÑÑ'},{id:'ai',icon:'fa-brain',n:'AI Ð¡ÑÑÐ´Ð¸Ñ'},{id:'cab',icon:'fa-user',n:'ÐÐ°Ð±Ð¸Ð½ÐµÑ'}].map(b => (
                <button key={b.id} onClick={()=>setTab(b.id)} className={`flex-shrink-0 px-3 py-2.5 rounded-xl border text-xs font-bold flex items-center gap-2 ${tab===b.id?'bg-cyan-500/20 border-cyan-500 text-cyan-300':'bg-slate-900 border-slate-800 text-slate-400'}`}><i className={`fa-solid ${b.icon}`}></i> {b.n}</button>
              ))}
            </aside>

            <section className="md:col-span-3 space-y-4">
              {tab === 'feed' && (
                <div className="space-y-4">
                  <div className="p-5 bg-gradient-to-r from-slate-900 to-[#0A101D] border border-cyan-500/30 rounded-2xl">
                    <h1 className="text-xl font-bold text-white mb-1">Ð¤ÑÐ¸Ð»Ð°Ð½Ñ Ð±Ð¸ÑÐ¶Ð° AI <span className="text-cyan-400">ÐÑÐµÐ°ÑÐ¾ÑÐ¾Ð²</span></h1>
                    <p className="text-xs text-slate-400">ÐÐµÐ·Ð¾Ð¿Ð°ÑÐ½ÑÐµ ÑÐ´ÐµÐ»ÐºÐ¸ Ñ Escrow.</p>
                  </div>
                  {tasks.length===0 && <div className="text-center py-10 text-slate-500 text-sm">ÐÐµÐ½ÑÐ° Ð¿ÑÑÑÐ°. Ð¡Ð¾Ð·Ð´Ð°Ð¹ÑÐµ Ð¿ÐµÑÐ²ÑÐ¹ ÑÐ°ÑÐº!</div>}
                  {tasks.map(t => (
                    <div key={t.id} className={`p-4 bg-[#0D121F] rounded-xl flex flex-col sm:flex-row gap-4 ${t.frame}`}>
                      <img src={t.photos[0]} className="w-full sm:w-32 h-32 object-cover rounded-lg" />
                      <div className="flex-1">
                        <div className="text-[10px] text-cyan-400 font-mono mb-1">{t.cat.toUpperCase()} â¢ ÐÑÐ¾ÑÐ¼Ð¾ÑÑÐ¾Ð²: {t.views}</div>
                        <h3 className="font-bold text-sm text-slate-200 mb-1">{t.title}</h3>
                        <p className="text-xs text-slate-400 line-clamp-2">{t.prompt}</p>
                      </div>
                      <div className="text-right flex flex-col justify-between">
                        <div><div className="text-lg font-bold text-cyan-400">{t.budget} AWS</div><div className="text-[10px] text-amber-400">ÐÑÐºÐ»Ð¸Ðº: {t.fee} AWS</div></div>
                        <button className="mt-2 px-4 py-1.5 bg-cyan-500 text-black text-xs font-bold rounded-lg hover:bg-cyan-400">ÐÑÐºÑÑÑÑ</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {tab === 'create' && (
                <form onSubmit={handleCreate} className="p-5 bg-[#0D121F] border border-cyan-500/30 rounded-2xl space-y-4">
                  <h2 className="font-bold text-cyan-400">ÐÐ¾Ð²ÑÐ¹ Ð·Ð°ÐºÐ°Ð·</h2>
                  <input type="text" required placeholder="ÐÐ°Ð·Ð²Ð°Ð½Ð¸Ðµ" value={nTitle} onChange={e=>setNTitle(e.target.value)} className="w-full bg-slate-900 border border-slate-800 p-3 rounded-xl text-sm outline-none" />
                  <div className="grid grid-cols-2 gap-3">
                    <input type="number" required placeholder="ÐÑÐ´Ð¶ÐµÑ AWS" value={nBudget} onChange={e=>setNBudget(e.target.value)} className="w-full bg-slate-900 border border-slate-800 p-3 rounded-xl text-sm outline-none" />
                    <select value={nCat} onChange={e=>setNCat(e.target.value)} className="w-full bg-slate-900 border border-slate-800 p-3 rounded-xl text-sm outline-none"><option value="video">ÐÐ¸Ð´ÐµÐ¾</option><option value="art">ÐÑÑ</option><option value="code">ÐÐ¾Ð´</option></select>
                  </div>
                  <div className="bg-slate-900 p-3 rounded-xl border border-slate-800">
                    <label className="text-xs font-bold text-cyan-400 block mb-2 cursor-pointer w-fit"><i className="fa-solid fa-upload"></i> ÐÐ°Ð³ÑÑÐ·Ð¸ÑÑ ÑÐ¾ÑÐ¾ Ñ ÑÑÑÑÐ¾Ð¹ÑÑÐ²Ð° <input type="file" accept="image/*" multiple className="hidden" onChange={async(e)=>{for(let f of Array.from(e.target.files)){if(nPhotos.length>=3)break; const b=await compressImg(f); setNPhotos(p=>[...p,b]);}}} /></label>
                    <div className="flex gap-2">{nPhotos.map((p,i)=><div key={i} className="relative w-16 h-16"><img src={p} className="w-full h-full object-cover rounded-lg"/><button type="button" onClick={()=>setNPhotos(nPhotos.filter((_,x)=>x!==i))} className="absolute top-0 right-0 bg-red-500 text-white rounded-full w-5 h-5 text-[10px] z-50">X</button></div>)}</div>
                  </div>
                  <textarea rows="3" placeholder="Ð¢Ð..." value={nPrompt} onChange={e=>setNPrompt(e.target.value)} className="w-full bg-slate-900 border border-slate-800 p-3 rounded-xl text-sm outline-none"></textarea>
                  <button type="submit" className="w-full py-3 bg-cyan-500 text-black font-bold rounded-xl">ÐÐ¿ÑÐ±Ð»Ð¸ÐºÐ¾Ð²Ð°ÑÑ</button>
                </form>
              )}

              {tab === 'ai' && (
                <form onSubmit={handleAI} className="p-5 bg-[#0D121F] border border-fuchsia-500/30 rounded-2xl space-y-4">
                  <h2 className="font-bold text-fuchsia-400">AI ÐÐµÑÐ¾ÑÐ½Ð¸ÑÐ° (50 AWS)</h2>
                  <select value={aiMode} onChange={e=>setAiMode(e.target.value)} className="w-full bg-slate-900 p-3 rounded-xl text-sm outline-none"><option value="image">ÐÐµÐ½ÐµÑÐ°ÑÐ¸Ñ ÐÑÑÐ¾Ð²</option><option value="text">Ð¢ÐµÐºÑÑ (Claude)</option></select>
                  <textarea rows="3" required placeholder="ÐÐ°Ð¿ÑÐ¾Ñ Ð½Ð° Ð»ÑÐ±Ð¾Ð¼ ÑÐ·ÑÐºÐµ..." value={aiPrompt} onChange={e=>setAiPrompt(e.target.value)} className="w-full bg-slate-900 border border-slate-800 p-3 rounded-xl text-sm outline-none"></textarea>
                  <button type="submit" disabled={aiLoad} className="w-full py-3 bg-fuchsia-500 text-white font-bold rounded-xl">{aiLoad?'ÐÐµÐ½ÐµÑÐ°ÑÐ¸Ñ...':'Ð¡Ð³ÐµÐ½ÐµÑÐ¸ÑÐ¾Ð²Ð°ÑÑ'}</button>
                  {aiRes?.type === 'img' && <img src={aiRes.url} className="w-full rounded-xl mt-4" />}
                  {aiRes?.type === 'txt' && <div className="p-3 bg-slate-900 rounded-xl text-xs text-cyan-300 font-mono mt-4">{aiRes.text}</div>}
                </form>
              )}

              {tab === 'cab' && user && (
                <div className="p-5 bg-[#0D121F] border border-emerald-500/30 rounded-2xl flex items-center gap-4">
                  <img src={user.avatar} className="w-16 h-16 rounded-xl object-cover" />
                  <div><h2 className="font-bold text-emerald-400">{user.name}</h2><p className="text-xs text-slate-400">{user.email}</p></div>
                </div>
              )}
            </section>
          </main>

          {authModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-slate-900 p-6 rounded-2xl w-full max-w-sm">
                <h3 className="font-bold mb-4">{authStep===1?'ÐÑÐ¾Ð´ / Ð ÐµÐ³Ð¸ÑÑÑÐ°ÑÐ¸Ñ':'ÐÐ¾Ð´ Ð±ÐµÐ·Ð¾Ð¿Ð°ÑÐ½Ð¾ÑÑÐ¸'}</h3>
                <form onSubmit={handleAuth} className="space-y-3">
                  {authStep===1 ? <>
                    <input type="email" required placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)} className="w-full bg-slate-800 p-3 rounded-xl outline-none text-sm" />
                    <input type="password" required placeholder="ÐÐ°ÑÐ¾Ð»Ñ" value={pass} onChange={e=>setPass(e.target.value)} className="w-full bg-slate-800 p-3 rounded-xl outline-none text-sm" />
                  </> : <>
                    <p className="text-xs text-slate-400">ÐÐ²ÐµÐ´Ð¸ÑÐµ Ð´ÐµÐ¼Ð¾-ÐºÐ¾Ð´: 777777</p>
                    <input type="text" required placeholder="777777" value={code} onChange={e=>setCode(e.target.value)} className="w-full bg-slate-800 p-3 rounded-xl outline-none text-center tracking-widest font-mono" />
                  </>}
                  <button type="submit" className="w-full py-3 bg-cyan-500 text-black font-bold rounded-xl">{authStep===1?'ÐÐ°Ð»ÐµÐµ':'ÐÐ¾Ð¹ÑÐ¸ (+1000 AWS)'}</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html { scroll-behavior: smooth; background-color: #07090E; }
    body { background-color: #07090E; color: #f1f5f9; font-family: system-ui, sans-serif; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 100vh; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .frame-none { border: 2px solid transparent; }
    .frame-cyan { border: 2px solid #06b6d4; box-shadow: 0 0 10px rgba(6, 182, 212, 0.7); }
    .frame-fuchsia { border: 2px solid #d946ef; box-shadow: 0 0 12px rgba(217, 70, 239, 0.8); }
    .frame-emerald { border: 2px solid #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.8); }
    .frame-amber { border: 2px solid #f59e0b; box-shadow: 0 0 18px rgba(245, 158, 11, 0.9); }
    @keyframes rainbow-pulsate { 0% { border-color: #ec4899; box-shadow: 0 0 10px rgba(236, 72, 153, 0.8); } 50% { border-color: #f59e0b; box-shadow: 0 0 25px rgba(245, 158, 11, 1); } 100% { border-color: #ec4899; box-shadow: 0 0 10px rgba(236, 72, 153, 0.8); } }
    .frame-rainbow-mythic { border: 2.5px solid #ec4899; animation: rainbow-pulsate 2.5s infinite ease-in-out; }
    .card-frame-default { border: 1px solid rgba(51, 65, 85, 0.8); }
    .card-frame-neon { border: 1.5px solid #06b6d4; box-shadow: 0 0 15px rgba(6, 182, 212, 0.25); }
    .card-frame-cyber { border: 1.5px solid #d946ef; box-shadow: 0 0 18px rgba(217, 70, 239, 0.3); }
    .card-frame-gold { border: 1.5px solid #f59e0b; box-shadow: 0 0 20px rgba(245, 158, 11, 0.35); }
    @keyframes fire-pulsate { 0% { border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); } 50% { border-color: #f97316; box-shadow: 0 0 35px rgba(249, 115, 22, 0.95); } 100% { border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); } }
    .card-frame-fire-ultra { border: 2px solid #ef4444; animation: fire-pulsate 1.5s infinite ease-in-out; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .toast-enter { animation: slideIn 0.3s ease-out forwards; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- FIREBASE CLOUD MODULES -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, collection, doc, setDoc, onSnapshot, deleteDoc, getDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    window.Firebase = { initializeApp, getAuth, signInAnonymously, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, getFirestore, collection, doc, setDoc, onSnapshot, deleteDoc, getDoc };
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TELEGRAM_LINK = "https://t.me/aiworkersspace";
    const ADMIN_EMAIL = "kenigwood39@gmail.com";

    // КЛЮЧИ FIREBASE ПРИЛОЖЕНИЯ
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyBi6K0YuwV6jAHvUg2x8Y2dX-FuTLfDgd0",
      authDomain: "ai-workers-space.firebaseapp.com",
      projectId: "ai-workers-space",
      storageBucket: "ai-workers-space.firebasestorage.app",
      messagingSenderId: "6761091660",
      appId: "1:6761091660:web:8628d352b4a8804c2edae9"
    };

    // Алгоритм экстремального сжатия фото
    const compressImage = (file) => {
      return new Promise((resolve) => {
        const reader = new FileReader(); reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image(); img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 500;
            const scaleSize = MAX_WIDTH / img.width;
            canvas.width = MAX_WIDTH; canvas.height = img.height * scaleSize;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.6));
          };
        };
      });
    };

    const calculateResponseFee = (b) => { b = Number(b) || 0; if (b <= 2000) return 100; if (b <= 5000) return Math.max(100, Math.round(b * 0.05)); return Math.round(250 + ((b - 5000) / 95000) * 950); };
    const CRYPTO_RATES = { usdt: { rate: 1.0, symbol: 'USDT', net: 'TRC-20' }, ton: { rate: 0.18, symbol: 'TON', net: 'TON' }, trx: { rate: 6.8, symbol: 'TRX', net: 'TRON' }, rub: { rate: 92.5, symbol: 'RUB', net: 'Карта' } };
    
    // Магазин: Аватары и Рамки
    const MINIMAL_AVATARS = [
      { id: 'm1', url: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&q=80', name: 'Dark Sphere', price: 0 },
      { id: 'm2', url: 'https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?w=300&q=80', name: 'Minimal Glow', price: 0 },
      { id: 'm3', url: 'https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?w=300&q=80', name: 'Glass Wave', price: 500 },
      { id: 'm4', url: 'https://images.unsplash.com/photo-1634926878768-2a5b3c42f139?w=300&q=80', name: 'VIP Gold', price: 5000 }
    ];
    const AVATAR_FRAMES = [ { id: 'f0', name: 'Без рамки', class: 'frame-none', price: 0 }, { id: 'f1', name: 'Cyan Glow', class: 'frame-cyan', price: 500 }, { id: 'f5', name: 'Rainbow Mythic ✨', class: 'frame-rainbow-mythic', price: 5000 } ];
    const TASK_CARD_FRAMES = [ { id: 'c0', name: 'Стандарт', class: 'card-frame-default', price: 0 }, { id: 'c1', name: 'Неон Cyan', class: 'card-frame-neon', price: 1000 }, { id: 'c4', name: 'Fire Ultra 🔥', class: 'card-frame-fire-ultra', price: 10000 } ];

    function App() {
      const [db, setDb] = useState(null);
      const [auth, setAuth] = useState(null);
      const [appId] = useState('aws-platform-v1');
      const [isGlobalMode, setIsGlobalMode] = useState(false);
      const [isDbReady, setIsDbReady] = useState(false);

      const [tab, setTab] = useState('feed'); 
      const [cabinetSubTab, setCabinetSubTab] = useState('my-orders');
      
      const [user, setUser] = useState(null);
      const [balance, setBalance] = useState(1000);
      const [tasks, setTasks] = useState([]);
      const [inventory, setInventory] = useState({ avatars: [], frames: [], cardFrames: [] });
      const [paidUnlocks, setPaidUnlocks] = useState([]);
      const [supportTickets, setSupportTickets] = useState([]);

      const isAdmin = user && user.email?.toLowerCase() === ADMIN_EMAIL.toLowerCase();

      const [toasts, setToasts] = useState([]);
      const [selectedCat, setSelectedCat] = useState('All');
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authError, setAuthError] = useState('');
      
      const [walletModalOpen, setWalletModalOpen] = useState(false);
      const [selectedCurrency, setSelectedCurrency] = useState('usdt');
      const [depositAmountAWS, setDepositAmountAWS] = useState('1000');
      
      const [newTitle, setNewTitle] = useState('');
      const [newCategory, setNewCategory] = useState('video');
      const [newPrompt, setNewPrompt] = useState('');
      const [newBudget, setNewBudget] = useState('150000');
      const [newTool, setNewTool] = useState('ComfyUI');
      const [taskPhotos, setTaskPhotos] = useState([]);
      const [mainPhotoIndex, setMainPhotoIndex] = useState(0);

      const [viewingTask, setViewingTask] = useState(null);
      const [currentPhotoSlide, setCurrentPhotoSlide] = useState(0);
      const [selectedTaskForChat, setSelectedTaskForChat] = useState(null);
      const [chatInput, setChatInput] = useState('');

      const [aiMode, setAiMode] = useState('image'); 
      const [aiPrompt, setAiPrompt] = useState('');
      const [aiResultImg, setAiResultImg] = useState(null);
      const [aiResultText, setAiResultText] = useState('');
      const [aiResultVideo, setAiResultVideo] = useState(null);
      const [aiLoading, setAiLoading] = useState(false);

      const showToast = (message, type = 'success') => { const id = Date.now(); setToasts(p => [...p, { id, message, type }]); setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3000); };

      useEffect(() => {
        const initCloud = () => {
          if (!window.Firebase) return;
          if (FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.length > 5) {
            try {
              const app = window.Firebase.initializeApp(FIREBASE_CONFIG);
              const firestoreDb = window.Firebase.getFirestore(app);
              const firebaseAuth = window.Firebase.getAuth(app);
              
              setDb(firestoreDb); setAuth(firebaseAuth); setIsGlobalMode(true);

              window.Firebase.onSnapshot(window.Firebase.collection(firestoreDb, 'artifacts', appId, 'public', 'tasks'), (snap) => {
                const loaded = snap.docs.map(d => d.data());
                setTasks(loaded.sort((a, b) => b.id - a.id));
              });

              window.Firebase.onSnapshot(window.Firebase.collection(firestoreDb, 'artifacts', appId, 'public', 'tickets'), (snap) => {
                setSupportTickets(snap.docs.map(d => d.data()).sort((a,b) => b.id - a.id));
              });

              window.Firebase.onAuthStateChanged(firebaseAuth, async (u) => {
                if (u) {
                  const profSnap = await window.Firebase.getDoc(window.Firebase.doc(firestoreDb, 'artifacts', appId, 'users', u.uid));
                  if (profSnap.exists()) {
                    const data = profSnap.data();
                    setUser(data.profile); setBalance(data.balance || 0); setInventory(data.inventory || {avatars:[],frames:[],cardFrames:[]}); setPaidUnlocks(data.paidUnlocks || []);
                  }
                } else {
                  setUser(null);
                }
                setIsDbReady(true);
              });
            } catch(e) { console.error("Firebase Error", e); activateLocalFallback(); }
          } else {
            activateLocalFallback();
          }
        };

        const activateLocalFallback = () => {
          setIsGlobalMode(false); setIsDbReady(true);
          const lT = localStorage.getItem('aws_local_tasks'); if(lT) setTasks(JSON.parse(lT));
          const lU = localStorage.getItem('aws_local_user'); if(lU) setUser(JSON.parse(lU));
          const lB = localStorage.getItem('aws_local_balance'); if(lB) setBalance(Number(lB));
          const lI = localStorage.getItem('aws_local_inv'); if(lI) setInventory(JSON.parse(lI));
        };

        setTimeout(initCloud, 500);
      }, []);

      useEffect(() => {
        if (isGlobalMode && db && user && auth?.currentUser) {
          window.Firebase.setDoc(window.Firebase.doc(db, 'artifacts', appId, 'users', auth.currentUser.uid), {
            profile: user, balance, inventory, paidUnlocks
          }, { merge: true });
        } else if (!isGlobalMode) {
          localStorage.setItem('aws_local_tasks', JSON.stringify(tasks)); localStorage.setItem('aws_local_user', JSON.stringify(user));
          localStorage.setItem('aws_local_balance', balance.toString()); localStorage.setItem('aws_local_inv', JSON.stringify(inventory));
        }
      }, [user, balance, inventory, paidUnlocks, tasks, isGlobalMode]);

      const handleUploadAvatarFromFile = async (e) => {
        const file = e.target.files[0];
        if (file) {
          try {
            const b64 = await compressImage(file);
            setUser(prev => ({ ...prev, avatar: b64 }));
            showToast('Аватар обновлен!');
          } catch(err) {
            showToast('Ошибка загрузки аватара', 'error');
          }
        }
      };

      const handleRemoveTaskPhoto = (e, idx) => {
        e.preventDefault();
        e.stopPropagation();
        setTaskPhotos(prev => prev.filter((_, i) => i !== idx));
      };

      const handleAuthSubmit = async (e, forcedMode = null) => {
        e.preventDefault(); setAuthError('');
        const mode = forcedMode || authMode;
        const em = authEmail.trim().toLowerCase();
        
        if (!isGlobalMode) {
           if (authPassword.length < 6) return setAuthError('Пароль от 6 символов');
           const u = { id: 'u_'+Date.now(), email: em, name: em.split('@')[0], avatar: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&q=80', avatarFrame: 'frame-none', cardFrame: 'card-frame-default' };
           setUser(u); setBalance(em === ADMIN_EMAIL.toLowerCase() ? 25000 : 1000); setAuthModalOpen(false); showToast('Локальный вход выполнен'); return;
        }

        try {
          if (mode === 'register') {
            if(authPassword.length < 6) return setAuthError('Пароль от 6 символов');
            const cred = await window.Firebase.createUserWithEmailAndPassword(auth, em, authPassword);
            const isM = em === ADMIN_EMAIL.toLowerCase();
            const u = { id: cred.user.uid, email: em, name: em.split('@')[0], avatar: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&q=80', avatarFrame: 'frame-none', cardFrame: 'card-frame-default' };
            
            await window.Firebase.setDoc(window.Firebase.doc(db, 'artifacts', appId, 'users', cred.user.uid), {
              profile: u, balance: isM ? 25000 : 1000, inventory: { avatars: [], frames: [], cardFrames: [] }, paidUnlocks: []
            });
            setUser(u); setBalance(isM ? 25000 : 1000); setAuthModalOpen(false); showToast('Успешная регистрация! +1000 AWS');
          } else {
            await window.Firebase.signInWithEmailAndPassword(auth, em, authPassword);
            setAuthModalOpen(false); showToast('Вы успешно вошли в систему!');
          }
        } catch(err) {
          setAuthError(mode === 'login' ? 'Неверный email или пароль' : 'Ошибка регистрации (возможно email занят)');
        }
      };

      const handleLogout = async () => {
        if(isGlobalMode && auth) await window.Firebase.signOut(auth);
        setUser(null); localStorage.removeItem('aws_local_user'); showToast('Вы вышли из аккаунта');
      };

      const handleUploadTaskPhotos = async (e) => {
        const files = Array.from(e.target.files);
        for (let file of files) {
          if (taskPhotos.length >= 5) break;
          try { const b64 = await compressImage(file); setTaskPhotos(p => p.length >= 5 ? p : [...p, b64]); } catch(err) { showToast('Ошибка фото', 'error'); }
        }
      };

      const handleCreateTask = async (e) => {
        e.preventDefault(); if (!newTitle.trim() || !user) return;
        const bVal = Number(newBudget) || 15000;
        const finalPhotos = taskPhotos.length > 0 ? taskPhotos : ['https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&q=80'];
        const taskObj = { id: Date.now(), category: newCategory, title: newTitle, prompt: newPrompt || 'Подробности в чате сделки', tool: newTool, budget: bVal, response_fee: calculateResponseFee(bVal), currency: 'AWS', author: user.name, author_id: user.id, card_frame: user.cardFrame || 'card-frame-default', status: 'open', views: 0, messages: [], mainPhotoIndex: mainPhotoIndex < finalPhotos.length ? mainPhotoIndex : 0, photos: finalPhotos, hidden: false };
        
        if(isGlobalMode && db) await window.Firebase.setDoc(window.Firebase.doc(db, 'artifacts', appId, 'public', 'tasks', taskObj.id.toString()), taskObj);
        else setTasks([taskObj, ...tasks]);
        
        showToast('Заказ опубликован в ленту!'); setNewTitle(''); setNewPrompt(''); setTaskPhotos([]); setMainPhotoIndex(0); setTab('feed');
      };

      const openTaskModalWithViewCount = async (task) => {
        const nViews = (task.views || 0) + 1;
        const upd = { ...task, views: nViews };
        if(isGlobalMode && db && task.author_id === user?.id) { await window.Firebase.setDoc(window.Firebase.doc(db, 'artifacts', appId, 'public', 'tasks', task.id.toString()), upd, { merge: true }); }
        else if(!isGlobalMode) setTasks(tasks.map(t => t.id === task.id ? upd : t));
        setViewingTask(upd); setCurrentPhotoSlide(upd.mainPhotoIndex || 0);
      };

      const handleSendDealMessage = async (e) => {
        e.preventDefault(); if (!chatInput.trim() || !selectedTaskForChat) return;
        const newMsg = { id: Date.now(), sender: user ? user.name : 'Guest', text: chatInput, isMe: true };
        const updatedTask = { ...selectedTaskForChat, messages: [...(selectedTaskForChat.messages || []), newMsg] };
        
        if(isGlobalMode && db) await window.Firebase.setDoc(window.Firebase.doc(db, 'artifacts', appId, 'public', 'tasks', updatedTask.id.toString()), updatedTask, {merge: true});
        else setTasks(tasks.map(t => t.id === updatedTask.id ? updatedTask : t));
        
        setSelectedTaskForChat(updatedTask); setChatInput('');
      };

      const handleGenerateAI = async (e) => {
        e.preventDefault(); if (!aiPrompt.trim()) return;
        const fee = aiMode === 'video' ? 150 : aiMode === 'text' ? 20 : 50;
        if (balance < fee) { setWalletModalOpen(true); return; }

        setBalance(p => p - fee); setAiLoading(true); setAiResultImg(null); setAiResultText(''); setAiResultVideo(null);

        try {
          if (aiMode === 'image') {
            const isRu = /[а-яА-ЯЁё]/.test(aiPrompt); let engP = aiPrompt;
            if(isRu) { try { const r = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=ru&tl=en&dt=t&q=${encodeURIComponent(aiPrompt)}`); const d = await r.json(); engP = d[0][0][0]; } catch(e){} }
            const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(engP+', 8k, cinematic masterpiece')}?width=1024&height=1024&seed=${Date.now()}&nologo=true`;
            const img = new Image(); img.src = url; img.onload = () => { setAiResultImg(url); setAiLoading(false); }; img.onerror = () => { setAiLoading(false); showToast('Ошибка рендеринга', 'error'); };
          } else if (aiMode === 'text') {
            setTimeout(() => { setAiResultText(`[Claude 3.5 Sonnet]:\nАнализ запроса: "${aiPrompt}"\n\nЯ обработал ваш запрос. В полной версии платформы здесь будет сгенерирован готовый код, смарт-контракт или сценарий.\n\nСтатус системы: Готово к работе.`); setAiLoading(false); }, 1500);
          } else {
            setTimeout(() => { setAiResultVideo('https://assets.mixkit.co/videos/preview/mixkit-futuristic-city-with-flying-traffic-at-night-41549-large.mp4'); setAiLoading(false); }, 2500);
          }
        } catch (err) { setAiLoading(false); showToast('Сбой API', 'error'); }
      };

      const handleBuy = (item, type) => {
        if (!user) { setAuthModalOpen(true); return; }
        const isOwned = item.price === 0 || inventory[type+'s']?.includes(item.id);

        if (isOwned) {
          let upd = { ...user };
          if(type === 'avatar') upd.avatar = item.url; if(type === 'frame') upd.avatarFrame = item.class; if(type === 'cardFrame') upd.cardFrame = item.class;
          setUser(upd); 
          if(type === 'cardFrame') {
             const updatedTasks = tasks.map(t => t.author_id === user.id ? { ...t, card_frame: item.class } : t);
             setTasks(updatedTasks);
             if(isGlobalMode && db) updatedTasks.filter(t=>t.author_id===user.id).forEach(t => window.Firebase.setDoc(window.Firebase.doc(db, 'artifacts', appId, 'public', 'tasks', t.id.toString()), t, {merge:true}));
          }
          showToast('Применено успешно!');
        } else {
          if (balance < item.price) { setWalletModalOpen(true); return; }
          setBalance(p => p - item.price);
          let nInv = { ...inventory }; nInv[type+'s'] = [...(nInv[type+'s']||[]), item.id]; setInventory(nInv);
          let upd = { ...user };
          if(type === 'avatar') upd.avatar = item.url; if(type === 'frame') upd.avatarFrame = item.class; if(type === 'cardFrame') upd.cardFrame = item.class;
          setUser(upd); 
          if(type === 'cardFrame') {
             const updatedTasks = tasks.map(t => t.author_id === user.id ? { ...t, card_frame: item.class } : t);
             setTasks(updatedTasks);
             if(isGlobalMode && db) updatedTasks.filter(t=>t.author_id===user.id).forEach(t => window.Firebase.setDoc(window.Firebase.doc(db, 'artifacts', appId, 'public', 'tasks', t.id.toString()), t, {merge:true}));
          }
          showToast('Покупка успешна! ✨');
        }
      };

      const feedTasks = tasks.filter(t => !t.hidden && (selectedCat === 'All' || t.category === selectedCat));
      const myTasks = tasks.filter(t => user && t.author_id === user.id);

      if (!isDbReady) return <div className="min-h-screen bg-[#07090E] flex items-center justify-center text-cyan-400 font-mono animate-pulse">Запуск платформы...</div>;

      return (
        <div className="min-h-screen flex flex-col w-full max-w-full overflow-x-hidden relative">
          
          <div className="fixed top-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-none">
            {toasts.map(t => (
              <div key={t.id} className={`toast-enter px-4 py-3 rounded-xl backdrop-blur-md border shadow-lg flex items-center gap-2 ${t.type === 'error' ? 'bg-red-500/20 border-red-500/50 text-red-100' : 'bg-emerald-500/20 border-emerald-500/50 text-emerald-100'}`}>
                <i className={`fa-solid ${t.type === 'error' ? 'fa-circle-xmark text-red-400' : 'fa-circle-check text-emerald-400'}`}></i><span className="text-sm font-semibold">{t.message}</span>
              </div>
            ))}
          </div>

          <header className="sticky top-0 z-40 bg-[#07090E]/90 backdrop-blur-lg border-b border-cyan-500/20 px-2 sm:px-6 py-2.5">
            <div className="max-w-6xl mx-auto flex items-center justify-between gap-2">
              <div className="flex items-center gap-2 cursor-pointer min-w-0 shrink-0" onClick={() => setTab('feed')}>
                <div className="h-8 w-8 sm:h-9 sm:w-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-fuchsia-500 p-[1px] shrink-0"><div className="w-full h-full bg-[#0B0F19] rounded-[11px] flex items-center justify-center text-cyan-400"><i className="fa-solid fa-robot text-sm sm:text-base"></i></div></div>
                <span className="font-extrabold text-[15px] sm:text-lg tracking-wide bg-gradient-to-r from-cyan-400 via-teal-300 to-fuchsia-400 bg-clip-text text-transparent truncate hidden sm:inline">AI WORKERS SPACE</span>

                  ) : (
                    <div className="p-3 bg-slate-950 border-t border-amber-500/40 flex justify-between shrink-0">
                      <button onClick={() => { if(balance < selectedTaskForChat.response_fee) { setWalletModalOpen(true); } else { setBalance(p => p - selectedTaskForChat.response_fee); setPaidUnlocks([...paidUnlocks, selectedTaskForChat.id]); showToast('Чат открыт!'); } }} className="px-4 py-2 rounded-xl bg-amber-500 text-black font-bold text-xs">Оплатить отклик ({selectedTaskForChat.response_fee} AWS)</button>
                    </div>
                  )}
                </div>
              )}
            </section>
          </main>

          {/* VIEW TASK MODAL */}
          {viewingTask && (
            <div className="fixed inset-0 z-[60] bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0D121F] border border-cyan-500/40 rounded-2xl p-5 sm:p-7 max-w-2xl w-full max-h-[90vh] flex flex-col relative overflow-y-auto">
                <button onClick={() => setViewingTask(null)} className="absolute top-4 right-4 text-slate-400 hover:text-white z-20 bg-black/50 w-8 h-8 rounded-full"><i className="fa-solid fa-xmark"></i></button>
                <div className="relative w-full h-64 sm:h-80 rounded-xl overflow-hidden bg-slate-950 mb-4 border border-slate-800">
                  <img src={viewingTask.photos[currentPhotoSlide] || viewingTask.photos[0]} className="w-full h-full object-contain" />
                  {viewingTask.photos.length > 1 && (
                    <>
                      <button onClick={() => setCurrentPhotoSlide(p => p > 0 ? p - 1 : viewingTask.photos.length - 1)} className="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/70 text-white hover:bg-black"><i className="fa-solid fa-chevron-left"></i></button>
                      <button onClick={() => setCurrentPhotoSlide(p => p < viewingTask.photos.length - 1 ? p + 1 : 0)} className="absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/70 text-white hover:bg-black"><i className="fa-solid fa-chevron-right"></i></button>
                    </>
                  )}
                </div>
                <div className="space-y-3">
                  <div className="flex justify-between items-center"><span className="text-xs bg-cyan-950 text-cyan-400 border border-cyan-800/40 px-2.5 py-1 rounded font-mono font-bold">{viewingTask.tool}</span><div className="font-mono text-xl font-extrabold text-cyan-400">{viewingTask.budget.toLocaleString()} AWS</div></div>
                  <h2 className="text-lg font-bold text-slate-100">{viewingTask.title}</h2>
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 text-xs font-mono text-slate-300 whitespace-pre-wrap"><span className="text-cyan-400">ТЗ:</span> {viewingTask.prompt}</div>
                  {(!user || user.id === viewingTask.author_id || paidUnlocks.includes(viewingTask.id)) ? (
                    <button onClick={() => { setViewingTask(null); setSelectedTaskForChat(viewingTask); setTab('deal_chat'); }} className="w-full py-3.5 rounded-xl bg-cyan-500 text-black font-bold text-sm hover:bg-cyan-400">Перейти в чат сделки</button>
                  ) : (
                    <button onClick={() => { if(balance < viewingTask.response_fee) { setWalletModalOpen(true); } else { setBalance(p => p - viewingTask.response_fee); setPaidUnlocks([...paidUnlocks, viewingTask.id]); setViewingTask(null); setSelectedTaskForChat(viewingTask); setTab('deal_chat'); showToast('Чат открыт!'); } }} className="w-full py-3.5 rounded-xl bg-amber-500 text-black font-bold text-sm hover:bg-amber-400">Оплатить отклик ({viewingTask.response_fee} AWS)</button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* WALLET */}
          {walletModalOpen && (
            <div className="fixed inset-0 z-[80] bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0D121F] border border-cyan-500/40 rounded-2xl p-5 sm:p-7 max-w-sm w-full relative">
                <button onClick={() => setWalletModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white"><i className="fa-solid fa-xmark text-lg"></i></button>
                <h3 className="text-lg font-bold text-slate-100 mb-1">Касса (100 AWS = 100 USDT)</h3>
                <div className="grid grid-cols-3 gap-2 mt-4 mb-3">
                  {Object.entries(CRYPTO_RATES).map(([k, v]) => <button key={k} onClick={() => setSelectedCurrency(k)} className={`p-2 rounded-xl border text-center ${selectedCurrency === k ? 'bg-cyan-500/20 border-cyan-400 text-cyan-300' : 'bg-slate-950 border-slate-800 text-slate-400'}`}><div className="text-xs font-bold">{v.symbol}</div></button>)}
                </div>
                <input type="number" value={depositAmountAWS} onChange={(e) => setDepositAmountAWS(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm font-mono text-cyan-300 outline-none mb-3" placeholder="Сумма AWS" />
                <div className="p-3 bg-cyan-950/40 border border-cyan-500/30 rounded-xl text-xs flex justify-between mb-4"><span>К оплате:</span><span className="font-mono font-bold text-cyan-400">{(Number(depositAmountAWS) * CRYPTO_RATES[selectedCurrency].rate).toFixed(2)} {CRYPTO_RATES[selectedCurrency].symbol}</span></div>
                <button onClick={() => { const a = Number(depositAmountAWS); setBalance(p => p + a); showToast(`+${a} AWS!`); setWalletModalOpen(false); }} className="w-full py-3 rounded-xl bg-cyan-500 text-black font-bold text-sm">Подтвердить оплату</button>
              </div>
            </div>
          )}

          {/* AUTH */}
          {authModalOpen && (
            <div className="fixed inset-0 z-[90] bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0D121F] border border-cyan-500/40 rounded-2xl p-5 sm:p-7 max-w-sm w-full relative">
                <button onClick={() => setAuthModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white"><i className="fa-solid fa-xmark text-lg"></i></button>
                {authMode === 'login' ? (
                  <>
                    <h3 className="text-lg font-bold text-slate-100 mb-4">Вход в аккаунт</h3>
                    <form onSubmit={(e) => handleAuthSubmit(e, 'login')} className="space-y-3">
                      <input type="email" required placeholder="Email" value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-cyan-500" />
                      <input type="password" required placeholder="Пароль" value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-cyan-500" />
                      {authError && <div className="text-xs text-red-400 text-center">{authError}</div>}
                      <button type="submit" className="w-full py-3 rounded-xl bg-cyan-500 text-black font-bold text-sm hover:bg-cyan-400">Войти</button>
                    </form>
                    <button onClick={() => setAuthMode('register')} className="mt-4 text-xs text-cyan-400 underline w-full text-center hover:text-cyan-300">Регистрация (+1000 AWS)</button>
                  </>
                ) : (
                  <>
                    <h3 className="text-lg font-bold text-slate-100 mb-4">Регистрация</h3>
                    <form onSubmit={(e) => handleAuthSubmit(e, 'register')} className="space-y-3">
                      <input type="email" required placeholder="Email" value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-cyan-500" />
                      <input type="password" required placeholder="Пароль (от 6 символов)" value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-cyan-500" />
                      {authError && <div className="text-xs text-red-400 text-center">{authError}</div>}
                      <button type="submit" className="w-full py-3 rounded-xl bg-cyan-500 text-black font-bold text-sm hover:bg-cyan-400">Зарегистрироваться</button>
                    </form>
                  </>
                )}
              </div>
            </div>
          )}

          <footer className="mt-auto border-t border-cyan-500/20 bg-[#06080C] px-4 py-8 text-xs text-slate-400">
            <div className="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
              <div className="text-center md:text-left"><div className="font-bold text-slate-200 text-sm">AI WORKERS SPACE</div><div className="font-mono text-[10px]">Храппа М.Н. • ИНН: 390400469138</div></div>
              <div className="text-center md:text-right font-mono text-[10px] text-slate-500">© 2026 AI WORKERS SPACE. Все права защищены.</div>
            </div>
          </footer>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

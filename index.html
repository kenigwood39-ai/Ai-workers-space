<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI WORKERS SPACE — Биржа ИИ-специалистов</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #07090E; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#07090E] min-h-screen text-slate-100 selection:bg-cyan-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const INITIAL_TASKS = [
      {
        id: 101,
        title: 'Генерация реалистичного фуд-арта для ресторанного меню',
        prompt: 'Hyper-realistic gourmet burger photoshoot, cinematic warm lighting, 8k resolution --ar 16:9 --v 6.0',
        tool: 'Midjourney v6',
        budget: 450,
        currency: 'AWS',
        author: 'RestoGroup',
        author_id: 'client_sample_1',
        executor_id: null,
        status: 'open',
        views: 142,
        preview: 'https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 102,
        title: 'Анимация персонажа для трейлера инди-игры',
        prompt: 'Cyberpunk nomad warrior standing in neon rain, cinematic camera rotation --motion 5',
        tool: 'Runway Gen-3',
        budget: 800,
        currency: 'AWS',
        author: 'CyberIndie Studio',
        author_id: 'client_sample_2',
        executor_id: null,
        status: 'open',
        views: 89,
        preview: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 103,
        title: 'Разработка серии персонажей для мобильной игры',
        prompt: 'Stylized 3D cartoon characters, isometric view, vibrant colors, Octane render --v 6.0',
        tool: 'FLUX.1',
        budget: 620,
        currency: 'AWS',
        author: 'PlayApex Games',
        author_id: 'client_sample_3',
        executor_id: null,
        status: 'open',
        views: 215,
        preview: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80'
      }
    ];

    const CREATORS = [
      {
        id: 1,
        name: 'Алексей "PromptMaster"',
        rating: '4.98',
        deals: 64,
        skills: ['Midjourney', 'FLUX.1', 'ComfyUI'],
        avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80'
      },
      {
        id: 2,
        name: 'Elena Synthetica',
        rating: '5.00',
        deals: 92,
        skills: ['Runway Gen-3', 'Luma Dream', 'ElevenLabs'],
        avatar: 'https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=200&q=80'
      }
    ];

    function App() {
      const [tab, setTab] = useState('feed');
      const [role, setRole] = useState('freelancer');
      const [cabinetSubTab, setCabinetSubTab] = useState('my-orders'); // 'my-orders' | 'favorites' | 'stats'
      
      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem('aws_tasks');
        return saved ? JSON.parse(saved) : INITIAL_TASKS;
      });
      const [favorites, setFavorites] = useState(() => {
        const favs = localStorage.getItem('aws_favorites');
        return favs ? JSON.parse(favs) : [];
      });
      const [filter, setFilter] = useState('All');

      // Авторизация и подтверждение
      const [user, setUser] = useState(() => {
        const savedUser = localStorage.getItem('aws_active_user');
        return savedUser ? JSON.parse(savedUser) : null;
      });
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'register' | 'verify_email'
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [verificationCode, setVerificationCode] = useState('');
      const [generatedOtp, setGeneratedOtp] = useState('');
      const [authError, setAuthError] = useState('');

      // Форма задачи
      const [newTitle, setNewTitle] = useState('');
      const [newPrompt, setNewPrompt] = useState('');
      const [newBudget, setNewBudget] = useState('');
      const [newTool, setNewTool] = useState('Midjourney v6');

      // Чат сделки
      const [selectedTaskForChat, setSelectedTaskForChat] = useState(null);
      const [dealMessages, setDealMessages] = useState({});
      const [chatInput, setChatInput] = useState('');

      useEffect(() => {
        localStorage.setItem('aws_tasks', JSON.stringify(tasks));
      }, [tasks]);

      useEffect(() => {
        localStorage.setItem('aws_favorites', JSON.stringify(favorites));
      }, [favorites]);

      // Логика аутентификации
      const handleStartRegister = (e) => {
        e.preventDefault();
        setAuthError('');
        if (authPassword.length < 6) {
          setAuthError('Пароль должен содержать минимум 6 символов');
          return;
        }

        // Генерируем 6-значный код подтверждения
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        setGeneratedOtp(code);
        setAuthMode('verify_email');
      };

      const handleVerifyEmail = (e) => {
        e.preventDefault();
        if (verificationCode.trim() !== generatedOtp) {
          setAuthError('Неверный код подтверждения!');
          return;
        }

        const cleanEmail = authEmail.trim().toLowerCase();
        const newUser = {
          id: 'user_' + btoa(cleanEmail).substring(0, 10),
          email: cleanEmail,
          name: cleanEmail.split('@')[0],
          verified: true
        };

        setUser(newUser);
        localStorage.setItem('aws_active_user', JSON.stringify(newUser));
        setAuthModalOpen(false);
        setAuthEmail('');
        setAuthPassword('');
        setVerificationCode('');
      };

      const handleLogin = (e) => {
        e.preventDefault();
        setAuthError('');
        const cleanEmail = authEmail.trim().toLowerCase();
        const loggedUser = {
          id: 'user_' + btoa(cleanEmail).substring(0, 10),
          email: cleanEmail,
          name: cleanEmail.split('@')[0],
          verified: true
        };

        setUser(loggedUser);
        localStorage.setItem('aws_active_user', JSON.stringify(loggedUser));
        setAuthModalOpen(false);
        setAuthEmail('');
        setAuthPassword('');
      };

      const handleLogout = () => {
        setUser(null);
        localStorage.removeItem('aws_active_user');
      };

      // Избранное
      const toggleFavorite = (taskId) => {
        if (favorites.includes(taskId)) {
          setFavorites(favorites.filter(id => id !== taskId));
        } else {
          setFavorites([...favorites, taskId]);
        }
      };

      // Создание задачи
      const handleCreateTask = (e) => {
        e.preventDefault();
        if (!user) {
          setAuthModalOpen(true);
          return;
        }
        if (!newTitle || !newBudget) return;

        const taskObj = {
          id: Date.now(),
          title: newTitle,
          prompt: newPrompt || 'ТЗ будет уточнено в чате заказа',
          tool: newTool,
          budget: Number(newBudget),
          currency: 'AWS',
          author: user.name,
          author_id: user.id,
          executor_id: null,
          status: 'open',
          views: 1,
          preview: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80'
        };

        setTasks([taskObj, ...tasks]);
        setNewTitle('');
        setNewPrompt('');
        setNewBudget('');
        setTab('cabinet');
        setCabinetSubTab('my-orders');
      };

      // Взять задачу
      const handleTakeTask = (taskId) => {
        if (!user) {
          setAuthModalOpen(true);
          return;
        }

        const updated = tasks.map(t => {
          if (t.id === taskId) {
            return { ...t, status: 'in_progress', executor_id: user.id };
          }
          return t;
        });
        setTasks(updated);

        const target = updated.find(t => t.id === taskId);
        openTaskChat(target);
      };

      // Открытие чата конкретного заказа
      const openTaskChat = (task) => {
        setSelectedTaskForChat(task);
        if (!dealMessages[task.id]) {
          setDealMessages(prev => ({
            ...prev,
            [task.id]: [
              { id: 1, sender: task.author, text: `Привет! Заказ #${task.id} «${task.title}» запущен в работу. Присылай превью сюда!`, isMe: false }
            ]
          }));
        }
        setTab('deal_chat');
      };

      const handleSendDealMessage = (e) => {
        e.preventDefault();
        if (!chatInput.trim() || !selectedTaskForChat) return;

        const newMsg = {
          id: Date.now(),
          sender: user ? user.name : 'Вы',
          text: chatInput,
          isMe: true
        };

        setDealMessages(prev => ({
          ...prev,
          [selectedTaskForChat.id]: [...(prev[selectedTaskForChat.id] || []), newMsg]
        }));
        setChatInput('');
      };

      const displayedTasks = filter === 'All' 
        ? tasks 
        : tasks.filter(t => (t.tool || '').toLowerCase().includes(filter.toLowerCase()));

      const myClientTasks = tasks.filter(t => user && t.author_id === user.id);
      const myFreelancerTasks = tasks.filter(t => user && t.executor_id === user.id);
      const favoriteTasks = tasks.filter(t => favorites.includes(t.id));

      return (
        <div className="min-h-screen flex flex-col w-full max-w-full overflow-x-hidden">
          {/* Хедер */}
          <header className="sticky top-0 z-40 bg-[#07090E]/95 backdrop-blur-md border-b border-cyan-500/20 px-3 sm:px-8 py-3">
            <div className="max-w-6xl mx-auto flex items-center justify-between gap-2">
              <div className="flex items-center gap-2 sm:gap-3 cursor-pointer min-w-0" onClick={() => setTab('feed')}>
                <div className="h-9 w-9 sm:h-10 sm:w-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-fuchsia-500 p-[1px] flex-shrink-0">
                  <div className="w-full h-full bg-[#0B0F19] rounded-[11px] flex items-center justify-center text-cyan-400">
                    <i className="fa-solid fa-robot text-base sm:text-lg"></i>
                  </div>
                </div>
                <span className="font-extrabold text-sm sm:text-xl tracking-wide bg-gradient-to-r from-cyan-400 via-teal-300 to-fuchsia-400 bg-clip-text text-transparent truncate block">
                  AI WORKERS SPACE
                </span>
              </div>

              <div className="flex items-center gap-2 sm:gap-3 flex-shrink-0">
                <button
                  onClick={() => setRole(role === 'freelancer' ? 'client' : 'freelancer')}
                  className="px-2.5 sm:px-3 py-1.5 rounded-xl border border-cyan-500/40 text-cyan-300 text-[11px] sm:text-xs font-semibold bg-cyan-500/10 flex items-center gap-1.5"
                >
                  <i className={role === 'client' ? "fa-solid fa-briefcase" : "fa-solid fa-user-check"}></i>
                  <span>{role === 'client' ? 'Заказчик' : 'Исполнитель'}</span>
                </button>

                {user ? (
                  <div className="flex items-center gap-1.5">
                    <button 
                      onClick={() => setTab('cabinet')}
                      className={`px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 border transition-all ${
                        tab === 'cabinet' ? 'bg-cyan-500 text-black border-cyan-400' : 'bg-slate-900 border-slate-800 text-cyan-300'
                      }`}
                    >
                      <i className="fa-solid fa-id-badge"></i>
                      <span className="hidden sm:inline">{user.name}</span>
                    </button>
                    <button 
                      onClick={handleLogout}
                      title="Выйти"
                      className="px-2.5 sm:px-3 py-1.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-semibold hover:bg-red-500/20"
                    >
                      <i className="fa-solid fa-right-from-bracket"></i>
                    </button>
                  </div>
                ) : (
                  <button 
                    onClick={() => { setAuthMode('login'); setAuthModalOpen(true); }}
                    className="px-3 sm:px-4 py-1.5 rounded-xl bg-cyan-500 text-black text-xs font-bold hover:bg-cyan-400 flex items-center gap-1.5"
                  >
                    <i className="fa-solid fa-user-lock"></i>
                    <span>Вход</span>
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* Контент */}
          <main className="flex-1 max-w-6xl w-full mx-auto px-3 sm:px-8 py-4 sm:py-6 grid grid-cols-1 lg:grid-cols-12 gap-5">
            {/* Меню навигации */}
            <aside className="lg:col-span-3 flex lg:flex-col gap-2 overflow-x-auto no-scrollbar pb-1 lg:pb-0">
              <button
                onClick={() => setTab('feed')}
                className={`flex-shrink-0 lg:flex-none flex items-center gap-2.5 px-3.5 py-2.5 sm:py-3 rounded-xl border font-medium text-xs sm:text-sm transition-all ${
                  tab === 'feed' ? 'bg-cyan-500/20 border-cyan-500 text-cyan-300' : 'bg-slate-900/60 border-slate-800 text-slate-400'
                }`}
              >
                <i className="fa-solid fa-wand-magic-sparkles text-cyan-400"></i>
                <span className="whitespace-nowrap">Лента заказов</span>
              </button>

              <button
                onClick={() => {
                  if (!user) setAuthModalOpen(true);
                  else setTab('cabinet');
                }}
                className={`flex-shrink-0 lg:flex-none flex items-center gap-2.5 px-3.5 py-2.5 sm:py-3 rounded-xl border font-medium text-xs sm:text-sm transition-all ${
                  tab === 'cabinet' ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300' : 'bg-slate-900/60 border-slate-800 text-slate-400'
                }`}
              >
                <i className="fa-solid fa-user-gear text-emerald-400"></i>
                <span className="whitespace-nowrap">Личный кабинет</span>
              </button>

              <button
                onClick={() => {
                  if (!user) setAuthModalOpen(true);
                  else setTab('create');
                }}
                className={`flex-shrink-0 lg:flex-none flex items-center gap-2.5 px-3.5 py-2.5 sm:py-3 rounded-xl border font-medium text-xs sm:text-sm transition-all ${
                  tab === 'create' ? 'bg-fuchsia-500/20 border-fuchsia-500 text-fuchsia-300' : 'bg-slate-900/60 border-slate-800 text-slate-400'
                }`}
              >
                <i className="fa-solid fa-circle-plus text-fuchsia-400"></i>
                <span className="whitespace-nowrap">Разместить таск</span>
              </button>

              <button
                onClick={() => setTab('creators')}
                className={`flex-shrink-0 lg:flex-none flex items-center gap-2.5 px-3.5 py-2.5 sm:py-3 rounded-xl border font-medium text-xs sm:text-sm transition-all ${
                  tab === 'creators' ? 'bg-teal-500/20 border-teal-500 text-teal-300' : 'bg-slate-900/60 border-slate-800 text-slate-400'
                }`}
              >
                <i className="fa-solid fa-users text-teal-400"></i>
                <span className="whitespace-nowrap">Топ Креаторов</span>
              </button>
            </aside>

            {/* Основная панель */}
            <section className="lg:col-span-9 space-y-4 min-w-0">
              {/* ЛЕНТА */}
              {tab === 'feed' && (
                <>
                  <div className="flex items-center gap-2 overflow-x-auto no-scrollbar bg-slate-900/60 p-2.5 rounded-2xl border border-slate-800">
                    {['All', 'Midjourney', 'FLUX', 'Runway'].map((item) => (
                      <button
                        key={item}
                        onClick={() => setFilter(item)}
                        className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap ${
                          filter === item ? 'bg-cyan-500 text-black' : 'bg-slate-800 text-slate-400'
                        }`}
                      >
                        {item}
                      </button>
                    ))}
                  </div>

                  <div className="grid grid-cols-1 gap-4">
                    {displayedTasks.map((t) => (
                      <div key={t.id} className="bg-[#0D121F] p-4 sm:p-5 rounded-2xl border border-slate-800 hover:border-cyan-500/50 flex flex-col sm:flex-row gap-4 sm:items-center transition-all min-w-0">
                        <div className="w-full sm:w-32 h-40 sm:h-32 rounded-xl overflow-hidden border border-cyan-500/20 bg-slate-950 flex-shrink-0 relative">
                          <img src={t.preview} className="w-full h-full object-cover" />
                          <button 
                            onClick={() => toggleFavorite(t.id)}
                            className={`absolute top-2 right-2 w-8 h-8 rounded-full backdrop-blur-md flex items-center justify-center text-xs transition-colors ${
                              favorites.includes(t.id) ? 'bg-amber-500/80 text-white' : 'bg-black/60 text-slate-400 hover:text-white'
                            }`}
                          >
                            <i className="fa-solid fa-star"></i>
                          </button>
                        </div>
                        <div className="flex-1 min-w-0 space-y-2">
                          <div className="flex flex-wrap items-center gap-2">
                            <span className="text-[10px] bg-cyan-950 text-cyan-400 border border-cyan-800/40 px-2 py-0.5 rounded font-mono font-bold">{t.tool}</span>
                            <span className="text-[11px] text-slate-400 font-mono flex items-center gap-1">
                              <i className="fa-solid fa-eye text-slate-500"></i> {t.views || 0}
                            </span>
                            <span className={t.status === 'in_progress' ? 'text-[11px] text-amber-400 font-semibold' : 'text-[11px] text-emerald-400 font-semibold'}>
                              {t.status === 'in_progress' ? '● В работе' : '● Открыт'}
                            </span>
                          </div>
                          <h3 className="font-bold text-sm sm:text-base text-slate-100 break-words leading-snug">{t.title}</h3>
                          <p className="text-xs text-slate-400 font-mono bg-slate-950/70 p-2.5 rounded-lg border border-slate-800/60 break-words">
                            <span className="text-cyan-400">Prompt: </span>{t.prompt}
                          </p>
                          <div className="flex items-center gap-2 text-[11px] text-slate-400 truncate">
                            <span>{t.author}</span>
                            <span>•</span>
                            <span className="text-emerald-400 font-mono">ID #{t.id}</span>
                          </div>
                        </div>
                        <div className="w-full sm:w-auto flex sm:flex-col items-center sm:items-end justify-between gap-3 pt-2 sm:pt-0 border-t sm:border-0 border-slate-800/60">
                          <div className="font-mono text-base sm:text-lg font-extrabold text-cyan-400">{t.budget} {t.currency}</div>
                          <button 
                            onClick={() => handleTakeTask(t.id)} 
                            className="px-4 py-2 rounded-xl bg-cyan-500 text-black font-bold text-xs hover:bg-cyan-400 flex-shrink-0"
                          >
                            Взять заказ
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </>
              )}

              {/* ЛИЧНЫЙ КАБИНЕТ */}
              {tab === 'cabinet' && (
                <div className="space-y-4">
                  {/* Шапка кабинета */}
                  <div className="bg-[#0D121F] p-5 rounded-2xl border border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div className="flex items-center gap-3">
                      <div className="w-12 h-12 rounded-2xl bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center text-cyan-300 text-xl font-bold font-mono">
                        {user?.name?.substring(0, 2).toUpperCase()}
                      </div>
                      <div>
                        <div className="flex items-center gap-2">
                          <h2 className="text-base sm:text-lg font-bold text-slate-100">{user?.name}</h2>
                          <span className="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 px-2 py-0.5 rounded-full font-mono">
                            ✓ Email Verified
                          </span>
                        </div>
                        <p className="text-xs text-slate-400 font-mono">{user?.email}</p>
                      </div>
                    </div>
                    <div className="flex items-center gap-2">
                      <div className="px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 text-xs font-mono">
                        <span className="text-slate-400">Роль: </span>
                        <span className="text-cyan-300 font-bold">{role === 'client' ? 'Заказчик' : 'Исполнитель'}</span>
                      </div>
                    </div>
                  </div>

                  {/* Вкладки внутри кабинета */}
                  <div className="flex items-center gap-2 border-b border-slate-800 pb-2 overflow-x-auto no-scrollbar">
                    <button
                      onClick={() => setCabinetSubTab('my-orders')}
                      className={`px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${
                        cabinetSubTab === 'my-orders' ? 'bg-cyan-500 text-black font-bold' : 'bg-slate-900 text-slate-400'
                      }`}
                    >
                      {role === 'client' ? `Мои таски (${myClientTasks.length})` : `В работе (${myFreelancerTasks.length})`}
                    </button>
                    <button
                      onClick={() => setCabinetSubTab('favorites')}
                      className={`px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all flex items-center gap-1.5 ${
                        cabinetSubTab === 'favorites' ? 'bg-amber-500 text-black font-bold' : 'bg-slate-900 text-slate-400'
                      }`}
                    >
                      <i className="fa-solid fa-star text-[10px]"></i>
                      <span>Избранное ({favoriteTasks.length})</span>
                    </button>
                  </div>

                  {/* Контент подвкладок кабинета */}
                  {cabinetSubTab === 'my-orders' && (
                    role === 'client' ? (
                      myClientTasks.length === 0 ? (
                        <div className="text-center py-12 bg-[#0D121F] rounded-2xl border border-slate-800">
                          <i className="fa-solid fa-briefcase text-2xl text-slate-600 mb-2"></i>
                          <p className="text-slate-300 font-medium text-xs sm:text-sm">У вас пока нет созданных тасков</p>
                          <button onClick={() => setTab('create')} className="mt-3 px-4 py-2 bg-cyan-500 text-black font-bold text-xs rounded-xl">
                            Создать первый заказ
                          </button>
                        </div>
                      ) : (
                        <div className="grid grid-cols-1 gap-3">
                          {myClientTasks.map(t => (
                            <div key={t.id} className="bg-[#0D121F] p-4 rounded-2xl border border-cyan-500/30 flex flex-col sm:flex-row gap-3 sm:items-center justify-between min-w-0">
                              <div className="min-w-0 space-y-1">
                                <div className="flex items-center gap-2">
                                  <span className="text-[10px] bg-cyan-950 text-cyan-400 px-2 py-0.5 rounded font-mono">{t.tool}</span>
                                  <h4 className="font-bold text-sm text-slate-100 break-words">{t.title}</h4>
                                </div>
                                <div className="flex items-center gap-3 text-xs text-slate-400 font-mono">
                                  <span><i className="fa-solid fa-eye text-slate-500"></i> {t.views} просм.</span>
                                  <span>•</span>
                                  <span>Бюджет: {t.budget} AWS</span>
                                  <span>•</span>
                                  <span className={t.status === 'in_progress' ? 'text-amber-400 font-bold' : 'text-emerald-400'}>
                                    {t.status === 'in_progress' ? 'В работе' : 'Поиск исполнителя'}
                                  </span>
                                </div>
                              </div>
                              <button 
                                onClick={() => openTaskChat(t)} 
                                className="px-3.5 py-2 bg-slate-900 border border-cyan-500/40 text-cyan-300 text-xs font-semibold rounded-xl self-start sm:self-auto hover:bg-slate-800"
                              >
                                Чат с исполнителем
                              </button>
                            </div>
                          ))}
                        </div>
                      )
                    ) : (
                      myFreelancerTasks.length === 0 ? (
                        <div className="text-center py-12 bg-[#0D121F] rounded-2xl border border-slate-800">
                          <i className="fa-solid fa-bolt text-2xl text-slate-600 mb-2"></i>
                          <p className="text-slate-300 font-medium text-xs sm:text-sm">Вы еще не взяли ни одного заказа</p>
                          <button onClick={() => setTab('feed')} className="mt-3 px-4 py-2 bg-cyan-500 text-black font-bold text-xs rounded-xl">
                            Выбрать задание в ленте
                          </button>
                        </div>
                      ) : (
                        <div className="grid grid-cols-1 gap-3">
                          {myFreelancerTasks.map(t => (
                            <div key={t.id} className="bg-[#0D121F] p-4 rounded-2xl border border-emerald-500/30 flex flex-col sm:flex-row gap-3 sm:items-center justify-between min-w-0">
                              <div className="min-w-0 space-y-1">
                                <div className="flex items-center gap-2">
                                  <span className="text-[10px] bg-emerald-950 text-emerald-400 px-2 py-0.5 rounded font-mono">{t.tool}</span>
                                  <h4 className="font-bold text-sm text-slate-100 break-words">{t.title}</h4>
                                </div>
                                <p className="text-xs text-slate-400 font-mono">Выплата: {t.budget} AWS (Escrow-холд) • Заказчик: {t.author}</p>
                              </div>
                              <button 
                                onClick={() => openTaskChat(t)} 
                                className="px-3.5 py-2 bg-emerald-500 text-black text-xs font-bold rounded-xl self-start sm:self-auto hover:bg-emerald-400"
                              >
                                Чат / Сдать генерацию
                              </button>
                            </div>
                          ))}
                        </div>
                      )
                    )
                  )}

                  {cabinetSubTab === 'favorites' && (
                    favoriteTasks.length === 0 ? (
                      <div className="text-center py-12 bg-[#0D121F] rounded-2xl border border-slate-800">
                        <i className="fa-solid fa-star text-2xl text-slate-600 mb-2"></i>
                        <p className="text-slate-300 font-medium text-xs sm:text-sm">В избранном пока пусто</p>
                        <p className="text-xs text-slate-500 mt-1">Нажимайте на звездочку на карточках ленты, чтобы сохранить таски</p>
                      </div>
                    ) : (
                      <div className="grid grid-cols-1 gap-3">
                        {favoriteTasks.map(t => (
                          <div key={t.id} className="bg-[#0D121F] p-4 rounded-2xl border border-slate-800 flex items-center justify-between gap-3">
                            <div>
                              <h4 className="font-bold text-sm text-slate-100">{t.title}</h4>
                              <p className="text-xs text-cyan-400 font-mono">{t.budget} AWS • {t.tool}</p>
                            </div>
                            <button onClick={() => toggleFavorite(t.id)} className="text-amber-400 hover:text-slate-400 text-sm">
                              <i className="fa-solid fa-star"></i>
                            </button>
                          </div>
                        ))}
                      </div>
                    )
                  )}
                </div>
              )}

              {/* ЧАТ ПО КОНКРЕТНОЙ СДЕЛКЕ */}
              {tab === 'deal_chat' && selectedTaskForChat && (
                <div className="bg-[#0D121F] rounded-2xl border border-cyan-500/30 overflow-hidden flex flex-col h-[520px]">
                  <div className="bg-slate-950 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
                    <div className="min-w-0">
                      <div className="flex items-center gap-2">
                        <button onClick={() => setTab('cabinet')} className="text-xs text-slate-400 hover:text-cyan-300 mr-1">
                          <i className="fa-solid fa-arrow-left"></i>
                        </button>
                        <span className="text-xs sm:text-sm font-bold text-slate-200 truncate">Заказ #{selectedTaskForChat.id}: {selectedTaskForChat.title}</span>
                      </div>
                    </div>
                    <span className="text-[11px] text-teal-400 font-mono flex-shrink-0 ml-2">Escrow: {selectedTaskForChat.budget} AWS</span>
                  </div>

                  <div className="flex-1 p-3 sm:p-4 overflow-y-auto space-y-3">
                    {(dealMessages[selectedTaskForChat.id] || []).map((m) => (
                      <div key={m.id} className={`flex flex-col ${m.isMe ? 'items-end' : 'items-start'}`}>
                        <span className="text-[10px] text-slate-500 mb-0.5">{m.sender}</span>
                        <div className={`max-w-[85%] rounded-xl px-3.5 py-2 text-xs sm:text-sm break-words ${m.isMe ? 'bg-cyan-600 text-white' : 'bg-slate-900 border border-slate-800 text-slate-200'}`}>
                          <p>{m.text}</p>
                        </div>
                      </div>
                    ))}
                  </div>

                  <form onSubmit={handleSendDealMessage} className="p-2.5 bg-slate-950 border-t border-slate-800 flex gap-2">
                    <input
                      type="text"
                      placeholder="Отправить сообщение или ссылку на готовый результат..."
                      value={chatInput}
                      onChange={(e) => setChatInput(e.target.value)}
                      className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2 text-xs sm:text-sm outline-none"
                    />
                    <button type="submit" className="p-2 px-3.5 bg-cyan-500 text-black rounded-xl font-bold">
                      <i className="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                  </form>
                </div>
              )}

              {/* РАЗМЕСТИТЬ ТАСК */}
              {tab === 'create' && (
                <div className="bg-[#0D121F] p-5 sm:p-7 rounded-2xl border border-cyan-500/30">
                  <h2 className="text-lg sm:text-xl font-bold text-cyan-400 mb-1">Создать задание</h2>
                  <p className="text-xs text-slate-400 mb-5">Заказ будет привязан к вашему профилю <b>{user?.name}</b>.</p>
                  <form onSubmit={handleCreateTask} className="space-y-4">
                    <input
                      type="text"
                      required
                      placeholder="Название проекта"
                      value={newTitle}
                      onChange={(e) => setNewTitle(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:border-cyan-500 outline-none"
                    />
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <select
                        value={newTool}
                        onChange={(e) => setNewTool(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm outline-none text-slate-200"
                      >
                        <option value="Midjourney v6">Midjourney v6</option>
                        <option value="FLUX.1">FLUX.1</option>
                        <option value="Runway Gen-3">Runway Gen-3</option>
                        <option value="ComfyUI">ComfyUI</option>
                      </select>
                      <input
                        type="number"
                        required
                        placeholder="Бюджет (AWS)"
                        value={newBudget}
                        onChange={(e) => setNewBudget(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm outline-none"
                      />
                    </div>
                    <textarea
                      rows="4"
                      placeholder="Вставьте рабочий промпт или требования..."
                      value={newPrompt}
                      onChange={(e) => setNewPrompt(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm outline-none"
                    ></textarea>
                    <button
                      type="submit"
                      className="w-full py-3.5 rounded-xl bg-gradient-to-r from-fuchsia-500 to-cyan-500 text-white font-bold text-sm"
                    >
                      Опубликовать заказ
                    </button>
                  </form>
                </div>
              )}

              {/* КРЕАТОРЫ */}
              {tab === 'creators' && (
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {CREATORS.map((c) => (
                    <div key={c.id} className="bg-[#0D121F] p-4 sm:p-5 rounded-2xl border border-slate-800 space-y-3">
                      <div className="flex items-center gap-3">
                        <img src={c.avatar} className="w-11 h-11 rounded-xl object-cover" />
                        <div>
                          <h3 className="font-bold text-sm text-slate-100">{c.name}</h3>
                          <span className="text-xs text-slate-400 font-mono">{c.deals} сделок • ★ {c.rating}</span>
                        </div>
                      </div>
                      <div className="flex flex-wrap gap-1.5">
                        {c.skills.map(s => <span key={s} className="text-[10px] bg-slate-900 px-2 py-0.5 rounded text-cyan-300 border border-slate-800 font-mono">{s}</span>)}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </section>
          </main>

          {/* МОДАЛЬНОЕ ОКНО АВТОРИЗАЦИИ / ВЕРИФИКАЦИИ */}
          {authModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0D121F] border border-cyan-500/40 rounded-2xl p-5 sm:p-7 max-w-sm w-full relative">
                <button 
                  onClick={() => setAuthModalOpen(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white"
                >
                  <i className="fa-solid fa-xmark text-lg"></i>
                </button>

                {authMode === 'login' && (
                  <>
                    <h3 className="text-lg font-bold text-slate-100 mb-1">Вход в аккаунт</h3>
                    <p className="text-xs text-slate-400 mb-4">Доступ к личным заказам и сделкам</p>
                    {authError && <div className="p-2.5 mb-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs">{authError}</div>}
                    <form onSubmit={handleLogin} className="space-y-3">
                      <input
                        type="email"
                        required
                        placeholder="Ваш Email"
                        value={authEmail}
                        onChange={(e) => setAuthEmail(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:border-cyan-500 outline-none"
                      />
                      <input
                        type="password"
                        required
                        placeholder="Пароль"
                        value={authPassword}
                        onChange={(e) => setAuthPassword(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:border-cyan-500 outline-none"
                      />
                      <button type="submit" className="w-full py-3 rounded-xl bg-cyan-500 text-black font-bold text-sm hover:bg-cyan-400">
                        Войти
                      </button>
                    </form>
                    <div className="mt-3 text-center text-xs text-slate-400">
                      Впервые на платформе?{' '}
                      <button onClick={() => { setAuthMode('register'); setAuthError(''); }} className="text-cyan-400 font-semibold hover:underline">
                        Зарегистрироваться
                      </button>
                    </div>
                  </>
                )}

                {authMode === 'register' && (
                  <>
                    <h3 className="text-lg font-bold text-slate-100 mb-1">Регистрация</h3>
                    <p className="text-xs text-slate-400 mb-4">На ваш Email будет отправлен код подтверждения</p>
                    {authError && <div className="p-2.5 mb-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs">{authError}</div>}
                    <form onSubmit={handleStartRegister} className="space-y-3">
                      <input
                        type="email"
                        required
                        placeholder="Ваш Email"
                        value={authEmail}
                        onChange={(e) => setAuthEmail(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:border-cyan-500 outline-none"
                      />
                      <input
                        type="password"
                        required
                        placeholder="Придумайте пароль (от 6 символов)"
                        value={authPassword}
                        onChange={(e) => setAuthPassword(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:border-cyan-500 outline-none"
                      />
                      <button type="submit" className="w-full py-3 rounded-xl bg-cyan-500 text-black font-bold text-sm hover:bg-cyan-400">
                        Получить код на Email
                      </button>
                    </form>
                    <div className="mt-3 text-center text-xs text-slate-400">
                      Уже есть аккаунт?{' '}
                      <button onClick={() => { setAuthMode('login'); setAuthError(''); }} className="text-cyan-400 font-semibold hover:underline">
                        Войти
                      </button>
                    </div>
                  </>
                )}

                {authMode === 'verify_email' && (
                  <>
                    <h3 className="text-lg font-bold text-slate-100 mb-1">Подтверждение Email</h3>
                    <p className="text-xs text-slate-400 mb-2">Введите код, отправленный на <b>{authEmail}</b></p>
                    <div className="p-2.5 mb-3 rounded-xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 text-xs font-mono">
                      Тестовый код верификации: <b>{generatedOtp}</b>
                    </div>
                    {authError && <div className="p-2.5 mb-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs">{authError}</div>}
                    <form onSubmit={handleVerifyEmail} className="space-y-3">
                      <input
                        type="text"
                        required
                        maxLength="6"
                        placeholder="6-значный код"
                        value={verificationCode}
                        onChange={(e) => setVerificationCode(e.target.value)}
                        className="w-full bg-slate-950 border border-cyan-500 text-center text-lg font-mono tracking-widest rounded-xl px-3.5 py-2.5 text-cyan-300 outline-none"
                      />
                      <button type="submit" className="w-full py-3 rounded-xl bg-emerald-500 text-black font-bold text-sm hover:bg-emerald-400">
                        Подтвердить и войти
                      </button>
                    </form>
                  </>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

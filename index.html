<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>AI WORKERS SPACE — Hire Top AI Creators</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html { scroll-behavior: smooth; background-color: #07090E; }
    body { 
      background-color: #07090E; 
      color: #f1f5f9; 
      font-family: system-ui, -apple-system, sans-serif; 
      overflow-x: hidden; 
      overflow-y: auto; 
      -webkit-overflow-scrolling: touch; 
      min-height: 100vh;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .frame-none { border: 2px solid transparent; }
    .frame-cyan { border: 2px solid #06b6d4; box-shadow: 0 0 10px rgba(6, 182, 212, 0.7); }
    .frame-fuchsia { border: 2px solid #d946ef; box-shadow: 0 0 12px rgba(217, 70, 239, 0.8); }
    .frame-emerald { border: 2px solid #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.8); }
    .frame-amber { border: 2px solid #f59e0b; box-shadow: 0 0 18px rgba(245, 158, 11, 0.9); }
    .frame-rainbow { border: 2px solid #ec4899; box-shadow: 0 0 22px rgba(236, 72, 153, 1); animation: pulse 2s infinite; }

    .card-frame-default { border: 1px solid rgba(51, 65, 85, 0.8); }
    .card-frame-neon { border: 1.5px solid #06b6d4; box-shadow: 0 0 15px rgba(6, 182, 212, 0.25); }
    .card-frame-cyber { border: 1.5px solid #d946ef; box-shadow: 0 0 18px rgba(217, 70, 239, 0.3); }
    .card-frame-gold { border: 1.5px solid #f59e0b; box-shadow: 0 0 20px rgba(245, 158, 11, 0.35); }
    .card-frame-fire { border: 1.5px solid #ef4444; box-shadow: 0 0 25px rgba(239, 68, 68, 0.4); }
  </style>
</head>
<body class="bg-[#07090E] min-h-screen text-slate-100 selection:bg-cyan-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TELEGRAM_LINK = "https://t.me/aiworkersspace";
    const ADMIN_EMAIL = "kenigwood39@gmail.com";

    const calculateResponseFee = (budget) => {
      const b = Number(budget) || 0;
      if (b <= 2000) return 100;
      if (b <= 5000) return Math.max(100, Math.round(b * 0.05));
      const fee = 250 + ((b - 5000) / (100000 - 5000)) * (1200 - 250);
      return Math.round(fee);
    };

    const CRYPTO_RATES = {
      usdt: { rate: 1.0, symbol: 'USDT', net: 'TRC-20' },
      ton: { rate: 0.18, symbol: 'TON', net: 'The Open Network' },
      trx: { rate: 6.8, symbol: 'TRX', net: 'TRON' },
      btc: { rate: 0.000016, symbol: 'BTC', net: 'Bitcoin' },
      rub: { rate: 92.5, symbol: 'RUB', net: 'Банковская карта' }
    };

    const DEFAULT_SYSTEM_TASKS = [
      {
        id: 101,
        category: 'video',
        title: 'Мультфильм для Корейского ТВ',
        prompt: 'Многосерийный мультфильм по сценарию для корейской киностудии в реалистичном стиле.',
        tool: 'ComfyUI',
        budget: 150000,
        response_fee: 1500,
        currency: 'AWS',
        author: 'RestoGroup',
        author_id: 'client_demo_1',
        card_frame: 'card-frame-gold',
        executor_id: null,
        status: 'open',
        hidden: false,
        views: 480,
        mainPhotoIndex: 0,
        photos: [
          'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80',
          'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=800&q=80'
        ]
      },
      {
        id: 102,
        category: 'art',
        title: 'Фотореалистичный фуд-арт сет для мишленовского ресторана',
        prompt: 'Gourmet wagyu truffle burger, dripping cheddar, macro lens, dramatic restaurant lighting --v 6.0',
        tool: 'Midjourney v6',
        budget: 35000,
        response_fee: 580,
        currency: 'AWS',
        author: 'RestoGroup Luxury',
        author_id: 'client_demo_2',
        card_frame: 'card-frame-neon',
        executor_id: null,
        status: 'open',
        hidden: false,
        views: 310,
        mainPhotoIndex: 0,
        photos: [
          'https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=800&q=80'
        ]
      },
      {
        id: 103,
        category: 'art',
        title: 'Киберпанк-обложка для виниловой пластинки Synthwave альбома',
        prompt: 'Futuristic Tokyo skyline at night, glowing neon kanji, retro synthwave 80s aesthetic --stylize 750',
        tool: 'FLUX.1 Pro',
        budget: 5000,
        response_fee: 250,
        currency: 'AWS',
        author: 'NeonRecords NY',
        author_id: 'client_demo_3',
        card_frame: 'card-frame-default',
        executor_id: null,
        status: 'open',
        hidden: false,
        views: 220,
        mainPhotoIndex: 0,
        photos: [
          'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=800&q=80'
        ]
      }
    ];

    function App() {
      const [tab, setTab] = useState('feed');
      const [role, setRole] = useState('client');
      
      const [user, setUser] = useState(() => {
        const savedUser = localStorage.getItem('aws_active_user');
        return savedUser ? JSON.parse(savedUser) : null;
      });

      const isAdmin = user && user.email?.toLowerCase() === ADMIN_EMAIL.toLowerCase();

      // Безопасное сохранение тасков
      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem('aws_persistent_tasks_v2');
        if (saved) {
          try { return JSON.parse(saved); } catch(e) {}
        }
        return DEFAULT_SYSTEM_TASKS;
      });

      const [balance, setBalance] = useState(() => {
        const b = localStorage.getItem('aws_balance_master_v2');
        if (b) return Number(b);
        return isAdmin ? 25000 : 1000;
      });

      // AI Studio режимы
      const [aiMode, setAiMode] = useState('image'); // 'image' | 'text' | 'video'
      const [aiPrompt, setAiPrompt] = useState('');
      const [aiResultImg, setAiResultImg] = useState(null);
      const [aiResultText, setAiResultText] = useState('');
      const [aiResultVideo, setAiResultVideo] = useState(null);
      const [aiLoading, setAiLoading] = useState(false);

      const [selectedCat, setSelectedCat] = useState('All');

      // Модалки
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [verificationCode, setVerificationCode] = useState('');
      const [generatedOtp, setGeneratedOtp] = useState('');

      const [walletModalOpen, setWalletModalOpen] = useState(false);
      const [selectedCurrency, setSelectedCurrency] = useState('usdt');
      const [depositAmountAWS, setDepositAmountAWS] = useState('1000');
      const [depositSuccess, setDepositSuccess] = useState(false);

      // Форма создания
      const [newTitle, setNewTitle] = useState('');
      const [newCategory, setNewCategory] = useState('video');
      const [newPrompt, setNewPrompt] = useState('');
      const [newBudget, setNewBudget] = useState('150000');
      const [newTool, setNewTool] = useState('ComfyUI');
      const [taskPhotos, setTaskPhotos] = useState([]);
      const [mainPhotoIndex, setMainPhotoIndex] = useState(0);

      const [viewingTask, setViewingTask] = useState(null);
      const [currentPhotoSlide, setCurrentPhotoSlide] = useState(0);
      const [selectedTaskForChat, setSelectedTaskForChat] = useState(null);
      const [dealMessages, setDealMessages] = useState({});
      const [chatInput, setChatInput] = useState('');

      useEffect(() => {
        try {
          localStorage.setItem('aws_persistent_tasks_v2', JSON.stringify(tasks));
        } catch(e) {
          console.warn('Storage limit reached, saved in session memory');
        }
      }, [tasks]);

      useEffect(() => {
        localStorage.setItem('aws_balance_master_v2', balance.toString());
      }, [balance]);

      // Просмотр со счетчиком
      const openTaskModalWithViewCount = (task) => {
        const updated = tasks.map(t => t.id === task.id ? { ...t, views: (t.views || 0) + 1 } : t);
        setTasks(updated);
        const target = updated.find(t => t.id === task.id);
        setViewingTask(target);
        setCurrentPhotoSlide(target.mainPhotoIndex || 0);
      };

      // Загрузка фото сжатым форматом
      const handleUploadTaskPhotos = (e) => {
        const files = Array.from(e.target.files);
        if (!files.length) return;
        files.forEach((file) => {
          if (taskPhotos.length >= 5) return;
          const reader = new FileReader();
          reader.onloadend = () => {
            setTaskPhotos(prev => (prev.length >= 5 ? prev : [...prev, reader.result]));
          };
          reader.readAsDataURL(file);
        });
      };

      // Публикация таска без падений
      const handleCreateTask = (e) => {
        e.preventDefault();
        if (!newTitle.trim()) return;

        const authorName = user ? user.name : 'RestoGroup';
        const authorId = user ? user.id : 'client_demo_1';
        const budgetVal = Number(newBudget) || 150000;

        const finalPhotos = taskPhotos.length > 0 ? taskPhotos : [
          'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80',
          'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=800&q=80'
        ];

        const taskObj = {
          id: Date.now(),
          category: newCategory,
          title: newTitle,
          prompt: newPrompt || 'ТЗ и материалы предоставлены в чате сделки',
          tool: newTool,
          budget: budgetVal,
          response_fee: calculateResponseFee(budgetVal),
          currency: 'AWS',
          author: authorName,
          author_id: authorId,
          card_frame: 'card-frame-gold',
          executor_id: null,
          status: 'open',
          hidden: false,
          views: 1,
          mainPhotoIndex: mainPhotoIndex < finalPhotos.length ? mainPhotoIndex : 0,
          photos: finalPhotos
        };

        setTasks([taskObj, ...tasks]);
        setNewTitle('');
        setNewPrompt('');
        setTaskPhotos([]);
        setMainPhotoIndex(0);
        setTab('feed');
      };

      // Умная AI Генерация (FLUX.1 Pro, Claude 3.5, Runway)
      const handleGenerateAI = async (e) => {
        e.preventDefault();
        if (!aiPrompt.trim()) return;

        const fee = aiMode === 'video' ? 150 : aiMode === 'text' ? 20 : 50;
        if (balance < fee) {
          alert(`Недостаточно AWS. Стоимость: ${fee} AWS.`);
          setWalletModalOpen(true);
          return;
        }

        setBalance(prev => prev - fee);
        setAiLoading(true);
        setAiResultImg(null);
        setAiResultText('');
        setAiResultVideo(null);

        if (aiMode === 'image') {
          const cleanSeed = Math.floor(Math.random() * 99999999);
          // FLUX.1 Pro с кинематографическим энхансером
          const enrichedPrompt = encodeURIComponent(`${aiPrompt.trim()}, masterpiece, 8k resolution, photorealistic, hyper-detailed cinematic lighting, octane render`);
          const imageUrl = `https://image.pollinations.ai/prompt/${enrichedPrompt}?width=1280&height=720&seed=${cleanSeed}&model=flux&nologo=true`;

          const img = new Image();
          img.src = imageUrl;
          img.onload = () => {
            setAiResultImg(imageUrl);
            setAiLoading(false);
          };
          img.onerror = () => {
            setAiLoading(false);
            alert('Сбой рендеринга изображения. Попробуйте еще раз.');
          };
        } 
        else if (aiMode === 'text') {
          // Имитация высокоточного ответа Claude 3.5 Sonnet
          setTimeout(() => {
            const sampleResponses = [
              `💡 [Claude 3.5 Sonnet Architecture Plan]:\n\nДля задачи «${aiPrompt.trim()}» рекомендуется следующий стек:\n1. Промпт-матрица: Master prompt с весами --stylize 850 --ar 16:9 --v 6.0.\n2. Архитектура пайплайна: ComfyUI + ControlNet IP-Adapter для сохранения консистентности.\n3. Смета проекта: 75,000 AWS (Escrow hold). Рекомендуемый срок сдачи: 48 часов.`,
              `⚡ [Claude 3.5 Sonnet Code & Script]:\n\nАнализ ТЗ «${aiPrompt.trim()}» завершен:\n- Подготовлена логика автоматизации и Telegram-бот на FastAPI + LangChain.\n- Интегрированы векторные эмбеддинги для поиска контекста в базе знаний.\n- Готовность к развертыванию: 100%.`
            ];
            setAiResultText(sampleResponses[Math.floor(Math.random() * sampleResponses.length)]);
            setAiLoading(false);
          }, 1400);
        }
        else if (aiMode === 'video') {
          // Генерация видео через Runway Gen-3
          setTimeout(() => {
            setAiResultVideo('https://assets.mixkit.co/videos/preview/mixkit-futuristic-city-with-flying-traffic-at-night-41549-large.mp4');
            setAiLoading(false);
          }, 2000);
        }
      };

      // Авторизация
      const handleStartRegister = (e) => {
        e.preventDefault();
        if (authPassword.length < 6) return;
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        setGeneratedOtp(code);
        setAuthMode('verify_email');
      };

      const handleVerifyEmail = (e) => {
        e.preventDefault();
        if (verificationCode.trim() !== generatedOtp) return;
        const cleanEmail = authEmail.trim().toLowerCase();
        const isMaster = cleanEmail === ADMIN_EMAIL.toLowerCase();

        const newUser = {
          id: 'user_' + btoa(cleanEmail).substring(0, 10),
          email: cleanEmail,
          name: cleanEmail.split('@')[0],
          avatar: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=300&q=80',
          avatarFrame: 'frame-none',
          cardFrame: 'card-frame-default',
          verified: true
        };

        setBalance(isMaster ? 25000 : 1000);
        setUser(newUser);
        localStorage.setItem('aws_active_user', JSON.stringify(newUser));
        setAuthModalOpen(false);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const cleanEmail = authEmail.trim().toLowerCase();
        const isMaster = cleanEmail === ADMIN_EMAIL.toLowerCase();

        const loggedUser = {
          id: 'user_' + btoa(cleanEmail).substring(0, 10),
          email: cleanEmail,
          name: cleanEmail.split('@')[0],
          avatar: user?.avatar || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=300&q=80',
          avatarFrame: user?.avatarFrame || 'frame-none',
          cardFrame: user?.cardFrame || 'card-frame-default',
          verified: true
        };

        if (isMaster && balance < 25000) setBalance(25000);
        setUser(loggedUser);
        localStorage.setItem('aws_active_user', JSON.stringify(loggedUser));
        setAuthModalOpen(false);
      };

      const handleLogout = () => {
        setUser(null);
        localStorage.removeItem('aws_active_user');
      };

      const openTaskChat = (task) => {
        setViewingTask(null);
        setSelectedTaskForChat(task);
        if (!dealMessages[task.id]) {
          setDealMessages(prev => ({
            ...prev,
            [task.id]: [{ id: 1, sender: task.author, text: `Здравствуйте! Таск #${task.id} открыт. Бюджет: ${task.budget.toLocaleString()} AWS. Жду предложения!`, isMe: false }]
          }));
        }
        setTab('deal_chat');
      };

      const handleSendDealMessage = (e) => {
        e.preventDefault();
        if (!chatInput.trim() || !selectedTaskForChat) return;
        const newMsg = { id: Date.now(), sender: user ? user.name : 'Вы', text: chatInput, isMe: true };
        setDealMessages(prev => ({ ...prev, [selectedTaskForChat.id]: [...(prev[selectedTaskForChat.id] || []), newMsg] }));
        setChatInput('');
      };

      const feedTasks = tasks.filter(t => !t.hidden && (selectedCat === 'All' || t.category === selectedCat));
      const myClientTasks = tasks.filter(t => user && t.author_id === user.id);

      return (
        <div className="min-h-screen flex flex-col w-full max-w-full overflow-x-hidden">
          {/* Хедер */}
          <header className="sticky top-0 z-40 bg-[#07090E]/95 backdrop-blur-md border-b border-cyan-500/20 px-2 sm:px-8 py-2.5">
            <div className="max-w-6xl mx-auto flex items-center justify-between gap-1.5 sm:gap-4">
              <div className="flex items-center gap-2 cursor-pointer min-w-0 flex-shrink-0" onClick={() => setTab('feed')}>
                <div className="h-8 w-8 sm:h-9 sm:w-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-fuchsia-500 p-[1px] flex-shrink-0">
                  <div className="w-full h-full bg-[#0B0F19] rounded-[11px] flex items-center justify-center text-cyan-400">
                    <i className="fa-solid fa-robot text-sm sm:text-base"></i>
                  </div>
                </div>
                <span className="font-extrabold text-xs sm:text-lg tracking-wide bg-gradient-to-r from-cyan-400 via-teal-300 to-fuchsia-400 bg-clip-text text-transparent truncate hidden xs:inline">
                  AI WORKERS SPACE
                </span>
              </div>

              <div className="flex items-center gap-1.5 sm:gap-2.5 flex-shrink-0">
                <a
                  href={TELEGRAM_LINK}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="w-7 h-7 sm:w-auto sm:px-2.5 sm:py-1 rounded-xl bg-sky-500/10 border border-sky-500/30 text-sky-400 text-xs font-semibold hover:bg-sky-500/20 transition-colors flex items-center justify-center gap-1 flex-shrink-0"
                >
                  <i className="fa-brands fa-telegram text-sm"></i>
                  <span className="hidden md:inline text-[11px]">TG</span>
                </a>

                <button
                  onClick={() => setWalletModalOpen(true)}
                  className="flex items-center gap-1 px-2 py-1 rounded-xl bg-slate-900 border border-amber-500/40 text-[11px] font-mono hover:bg-slate-800 transition-colors flex-shrink-0"
                >
                  <i className="fa-solid fa-coins text-amber-400 text-xs"></i>
                  <span className="text-cyan-300 font-bold">{balance.toLocaleString()}</span>
                  <span className="text-[10px] text-slate-400">AWS</span>
                </button>

                {user ? (
                  <div className="flex items-center gap-1.5">
                    <div 
                      onClick={() => setTab('cabinet')}
                      className="flex items-center gap-1.5 cursor-pointer bg-slate-900 p-0.5 pr-2 rounded-xl border border-slate-800 hover:border-cyan-500/50"
                    >
                      <div className={`w-6 h-6 rounded-lg overflow-hidden ${user.avatarFrame || 'frame-none'}`}>
                        <img src={user.avatar} className="w-full h-full object-cover" />
                      </div>
                      <span className="hidden sm:inline text-xs font-bold text-slate-200">{user.name}</span>
                    </div>

                    <button 
                      onClick={handleLogout}
                      title="Выйти"
                      className="px-2 py-1 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-semibold"
                    >
                      <i className="fa-solid fa-right-from-bracket"></i>
                    </button>
                  </div>
                ) : (
                  <button 
                    onClick={() => { setAuthMode('login'); setAuthModalOpen(true); }}
                    className="px-2.5 py-1 rounded-xl bg-cyan-500 text-black text-xs font-bold hover:bg-cyan-400 flex items-center gap-1"
                  >
                    <i className="fa-solid fa-user-lock"></i>
                    <span>Вход</span>
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* Лейаут */}
          <main className="flex-1 max-w-6xl w-full mx-auto px-3 sm:px-8 py-4 sm:py-6 grid grid-cols-1 lg:grid-cols-12 gap-5 pb-20">
            <aside className="lg:col-span-3 flex lg:flex-col gap-2 overflow-x-auto no-scrollbar pb-1 lg:pb-0">
              <button
                onClick={() => setTab('feed')}
                className={`flex-shrink-0 lg:flex-none flex items-center gap-2.5 px-3.5 py-2.5 sm:py-3 rounded-xl border font-medium text-xs sm:text-sm transition-all ${
                  tab === 'feed' ? 'bg-cyan-500/20 border-cyan-500 text-cyan-300' : 'bg-slate-900/60 border-slate-800 text-slate-400'
                }`}
              >
                <i className="fa-solid fa-wand-magic-sparkles text-cyan-400"></i>
                <span>Лента заказов</span>
              </button>

              <button
                onClick={() => setTab('ai_studio')}
                className={`flex-shrink-0 lg:flex-none flex items-center gap-2.5 px-3.5 py-2.5 sm:py-3 rounded-xl border font-medium text-xs sm:text-sm transition-all ${
                  tab === 'ai_studio' ? 'bg-fuchsia-500/20 border-fuchsia-500 text-fuchsia-300' : 'bg-slate-900/60 border-slate-800 text-slate-400'
                }`}
              >
                <i className="fa-solid fa-brain text-fuchsia-400"></i>
                <span>AI Студия (Pro) ✨</span>
              </button>

              <button
                onClick={() => { if (!user) setAuthModalOpen(true); else setTab('cabinet'); }}
                className={`flex-shrink-0 lg:flex-none flex items-center gap-2.5 px-3.5 py-2.5 sm:py-3 rounded-xl border font-medium text-xs sm:text-sm transition-all ${
                  tab === 'cabinet' ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300' : 'bg-slate-900/60 border-slate-800 text-slate-400'
                }`}
              >
                <i className="fa-solid fa-user-gear text-emerald-400"></i>
                <span>Личный кабинет</span>
              </button>

              <button
                onClick={() => setTab('create')}
                className={`flex-shrink-0 lg:flex-none flex items-center gap-2.5 px-3.5 py-2.5 sm:py-3 rounded-xl border font-medium text-xs sm:text-sm transition-all ${
                  tab === 'create' ? 'bg-cyan-500/20 border-cyan-500 text-cyan-300' : 'bg-slate-900/60 border-slate-800 text-slate-400'
                }`}
              >
                <i className="fa-solid fa-circle-plus text-cyan-400"></i>
                <span>Разместить таск</span>
              </button>
            </aside>

            {/* Центральная часть */}
            <section className="lg:col-span-9 space-y-4 min-w-0">
              
              {/* 1. ЛЕНТА ЗАКАЗОВ */}
              {tab === 'feed' && (

                  <h2 className="text-lg font-bold text-slate-100">{viewingTask.title}</h2>
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 text-xs font-mono text-slate-300">
                    <span className="text-cyan-400 block mb-1">Prompt / ТЗ:</span>
                    {viewingTask.prompt}
                  </div>

                  <button onClick={() => openTaskChat(viewingTask)} className="w-full py-3.5 rounded-xl bg-cyan-500 text-black font-bold text-sm hover:bg-cyan-400">
                    Перейти в чат сделки
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* КАССА */}
          {walletModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0D121F] border border-cyan-500/40 rounded-2xl p-5 sm:p-7 max-w-md w-full relative">
                <button onClick={() => setWalletModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white">
                  <i className="fa-solid fa-xmark text-lg"></i>
                </button>

                <h3 className="text-lg font-bold text-slate-100 mb-1">Касса платформы</h3>
                <p className="text-xs text-slate-400 mb-4">100 AWS = 100 USDT</p>

                <div className="space-y-4">
                  <div className="grid grid-cols-3 gap-2">
                    {Object.entries(CRYPTO_RATES).map(([key, item]) => (
                      <button
                        key={key}
                        onClick={() => setSelectedCurrency(key)}
                        className={`p-2 rounded-xl border text-center ${selectedCurrency === key ? 'bg-cyan-500/20 border-cyan-400 text-cyan-300' : 'bg-slate-950 border-slate-800 text-slate-400'}`}
                      >
                        <div className="text-xs font-bold">{item.symbol}</div>
                        <div className="text-[9px] opacity-70">{item.net}</div>
                      </button>
                    ))}
                  </div>

                  <input
                    type="number"
                    value={depositAmountAWS}
                    onChange={(e) => setDepositAmountAWS(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm font-mono text-cyan-300 outline-none"
                    placeholder="Сумма в AWS"
                  />

                  <div className="p-2.5 rounded-lg bg-cyan-950/40 border border-cyan-500/30 text-xs flex justify-between">
                    <span>К оплате:</span>
                    <span className="font-mono font-bold text-cyan-400">
                      {(Number(depositAmountAWS) * CRYPTO_RATES[selectedCurrency].rate).toFixed(2)} {CRYPTO_RATES[selectedCurrency].symbol}
                    </span>
                  </div>

                  <button
                    onClick={() => {
                      const added = Number(depositAmountAWS);
                      setBalance(prev => prev + added);
                      setDepositSuccess(true);
                      setTimeout(() => { setDepositSuccess(false); setWalletModalOpen(false); }, 1200);
                    }}
                    className="w-full py-3 rounded-xl bg-cyan-500 text-black font-bold text-sm"
                  >
                    {depositSuccess ? '✓ Успешно пополнено!' : 'Оплатить'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* АВТОРИЗАЦИЯ */}
          {authModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0D121F] border border-cyan-500/40 rounded-2xl p-5 sm:p-7 max-w-sm w-full relative">
                <button onClick={() => setAuthModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white">
                  <i className="fa-solid fa-xmark text-lg"></i>
                </button>

                {authMode === 'login' && (
                  <>
                    <h3 className="text-lg font-bold text-slate-100 mb-1">Вход в аккаунт</h3>
                    <form onSubmit={handleLogin} className="space-y-3 mt-3">
                      <input
                        type="email"
                        required
                        placeholder="Email"
                        value={authEmail}
                        onChange={(e) => setAuthEmail(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm outline-none"
                      />
                      <input
                        type="password"
                        required
                        placeholder="Пароль"
                        value={authPassword}
                        onChange={(e) => setAuthPassword(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm outline-none"
                      />
                      <button type="submit" className="w-full py-3 rounded-xl bg-cyan-500 text-black font-bold text-sm">
                        Войти
                      </button>
                    </form>
                    <div className="mt-3 text-center text-xs text-slate-400">
                      Нет аккаунта?{' '}
                      <button onClick={() => setAuthMode('register')} className="text-cyan-400 font-semibold underline">
                        Регистрация (+1000 AWS)
                      </button>
                    </div>
                  </>
                )}

                {authMode === 'register' && (
                  <>
                    <div className="flex items-center gap-2 mb-1">
                      <h3 className="text-lg font-bold text-slate-100">Регистрация</h3>
                      <span className="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full font-mono font-bold">+1000 AWS</span>
                    </div>
                    <form onSubmit={handleStartRegister} className="space-y-3 mt-3">
                      <input
                        type="email"
                        required
                        placeholder="Email"
                        value={authEmail}
                        onChange={(e) => setAuthEmail(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm outline-none"
                      />
                      <input
                        type="password"
                        required
                        placeholder="Пароль (от 6 символов)"
                        value={authPassword}
                        onChange={(e) => setAuthPassword(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm outline-none"
                      />
                      <button type="submit" className="w-full py-3 rounded-xl bg-cyan-500 text-black font-bold text-sm">
                        Получить код на Email
                      </button>
                    </form>
                  </>
                )}

                {authMode === 'verify_email' && (
                  <>
                    <h3 className="text-lg font-bold text-slate-100 mb-1">Код подтверждения</h3>
                    <div className="p-2.5 mb-3 rounded-xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 text-xs font-mono text-center">
                      OTP: <b>{generatedOtp}</b>
                    </div>
                    <form onSubmit={handleVerifyEmail} className="space-y-3">
                      <input
                        type="text"
                        required
                        maxLength="6"
                        placeholder="6-значный код"
                        value={verificationCode}
                        onChange={(e) => setVerificationCode(e.target.value)}
                        className="w-full bg-slate-950 border border-cyan-500 text-center text-lg font-mono rounded-xl px-3.5 py-2.5 text-cyan-300 outline-none"
                      />
                      <button type="submit" className="w-full py-3 rounded-xl bg-emerald-500 text-black font-bold text-sm">
                        Забрать +1000 AWS и войти
                      </button>
                    </form>
                  </>
                )}
              </div>
            </div>
          )}

          {/* Футер */}
          <footer className="mt-12 border-t border-cyan-500/20 bg-[#06080C] px-4 py-8 text-xs text-slate-400">
            <div className="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
              <div className="space-y-1 text-center md:text-left">
                <div className="font-bold text-slate-200 text-sm">AI WORKERS SPACE</div>
                <div className="font-mono text-[11px]">Самозанятая: Храппа Марина Николаевна • ИНН: 390400469138</div>
              </div>
              <div className="text-center md:text-right font-mono text-[11px] text-slate-500">
                © 2026 AI WORKERS SPACE. Все права защищены.
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>AI WORKERS SPACE — Hire Top AI Creators</title>
  
  <!-- Tailwind & React -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html { scroll-behavior: smooth; background-color: #07090E; }
    body { 
      background-color: #07090E; 
      color: #f1f5f9; 
      font-family: system-ui, -apple-system, sans-serif; 
      overflow-x: hidden; 
      overflow-y: auto; 
      -webkit-overflow-scrolling: touch; 
      min-height: 100vh;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Рамки аватаров */
    .frame-none { border: 2px solid transparent; }
    .frame-cyan { border: 2px solid #06b6d4; box-shadow: 0 0 10px rgba(6, 182, 212, 0.7); }
    .frame-fuchsia { border: 2px solid #d946ef; box-shadow: 0 0 12px rgba(217, 70, 239, 0.8); }
    .frame-emerald { border: 2px solid #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.8); }
    .frame-amber { border: 2px solid #f59e0b; box-shadow: 0 0 18px rgba(245, 158, 11, 0.9); }
    
    @keyframes rainbow-pulsate {
      0% { border-color: #ec4899; box-shadow: 0 0 10px rgba(236, 72, 153, 0.8); }
      50% { border-color: #f59e0b; box-shadow: 0 0 25px rgba(245, 158, 11, 1); }
      100% { border-color: #ec4899; box-shadow: 0 0 10px rgba(236, 72, 153, 0.8); }
    }
    .frame-rainbow-mythic { border: 2.5px solid #ec4899; animation: rainbow-pulsate 2.5s infinite ease-in-out; }

    /* Рамки тасков */
    .card-frame-default { border: 1px solid rgba(51, 65, 85, 0.8); }
    .card-frame-neon { border: 1.5px solid #06b6d4; box-shadow: 0 0 15px rgba(6, 182, 212, 0.25); }
    .card-frame-cyber { border: 1.5px solid #d946ef; box-shadow: 0 0 18px rgba(217, 70, 239, 0.3); }
    .card-frame-gold { border: 1.5px solid #f59e0b; box-shadow: 0 0 20px rgba(245, 158, 11, 0.35); }
    
    @keyframes fire-pulsate {
      0% { border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); }
      50% { border-color: #f97316; box-shadow: 0 0 35px rgba(249, 115, 22, 0.95); }
      100% { border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); }
    }
    .card-frame-fire-ultra { border: 2px solid #ef4444; animation: fire-pulsate 1.5s infinite ease-in-out; }

    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .toast-enter { animation: slideIn 0.3s ease-out forwards; }
  </style>
</head>
<body class="bg-[#07090E] min-h-screen text-slate-100 selection:bg-cyan-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- ИНИЦИАЛИЗАЦИЯ SUPABASE ---
    const SUPABASE_URL = 'https://kxesopofbqwrnzohnbqs.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_yOkm8byVqjmQZHvvVKlE6Q_Zx324mjy';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const TELEGRAM_LINK = "https://t.me/aiworkersspace";
    const ADMIN_EMAIL = "kenigwood39@gmail.com";

    const calculateResponseFee = (budget) => {
      const b = Number(budget) || 0;
      if (b <= 2000) return 100;
      if (b <= 5000) return Math.max(100, Math.round(b * 0.05));
      const fee = 250 + ((b - 5000) / (100000 - 5000)) * (1200 - 250);
      return Math.round(fee);
    };

    const CRYPTO_RATES = {
      usdt: { rate: 1.0, symbol: 'USDT', net: 'TRC-20' },
      ton: { rate: 0.18, symbol: 'TON', net: 'The Open Network' },
      trx: { rate: 6.8, symbol: 'TRX', net: 'TRON' },
      rub: { rate: 92.5, symbol: 'RUB', net: 'Банковская карта' }
    };

    const SYSTEM_TASKS = [
      {
        id: 'demo-101',
        category: 'video',
        title: 'Мультфильм для Корейского ТВ',
        prompt: 'Многосерийный мультфильм по сценарию для корейской киностудии в реалистичном стиле.',
        tool: 'ComfyUI',
        budget: 150000,
        response_fee: 1500,
        currency: 'AWS',
        author: 'RestoGroup',
        author_id: 'client_demo_1',
        card_frame: 'card-frame-fire-ultra',
        status: 'open',
        hidden: false,
        views: 480,
        main_photo_index: 0,
        photos: ['https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80']
      }
    ];

    function App() {
      const [tab, setTab] = useState('feed'); 
      const [cabinetSubTab, setCabinetSubTab] = useState('my-orders');
      
      // Стейты для базы данных и Auth
      const [user, setUser] = useState(null);
      const [profile, setProfile] = useState(null);
      const [tasks, setTasks] = useState([]);
      const [balance, setBalance] = useState(0);
      const [isLoading, setIsLoading] = useState(true);

      const isAdmin = user && user.email?.toLowerCase() === ADMIN_EMAIL.toLowerCase();

      // Оставляем инвентарь пока локально (до переезда БД)
      const [inventory, setInventory] = useState(() => {
        const saved = localStorage.getItem('aws_db_inventory_v5');
        return saved ? JSON.parse(saved) : {};
      });
      const [platformStats, setPlatformStats] = useState({ visits: 1421, purchasedAWS: 420000, clientsCount: 84, creatorsCount: 142 });

      const [toasts, setToasts] = useState([]);
      const [selectedCat, setSelectedCat] = useState('All');
      
      // Auth Modal States
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'register'
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authMessage, setAuthMessage] = useState('');
      const [authError, setAuthError] = useState('');
      
      const [walletModalOpen, setWalletModalOpen] = useState(false);
      const [selectedCurrency, setSelectedCurrency] = useState('usdt');
      const [depositAmountAWS, setDepositAmountAWS] = useState('1000');
      
      // Task Creation States
      const [newTitle, setNewTitle] = useState('');
      const [newCategory, setNewCategory] = useState('video');
      const [newPrompt, setNewPrompt] = useState('');
      const [newBudget, setNewBudget] = useState('150000');
      const [newTool, setNewTool] = useState('ComfyUI');
      const [taskPhotos, setTaskPhotos] = useState([]);
      const [mainPhotoIndex, setMainPhotoIndex] = useState(0);

      const [editingTask, setEditingTask] = useState(null);
      const [viewingTask, setViewingTask] = useState(null);
      const [currentPhotoSlide, setCurrentPhotoSlide] = useState(0);
      
      // AI Studio States
      const [aiMode, setAiMode] = useState('image'); 
      const [aiPrompt, setAiPrompt] = useState('');
      const [aiResultImg, setAiResultImg] = useState(null);
      const [aiLoading, setAiLoading] = useState(false);

      // --- SUPABASE EFFECTS ---
      useEffect(() => {
        // Проверка текущей сессии при загрузке
        supabase.auth.getSession().then(({ data: { session } }) => {
          setUser(session?.user || null);
          if (session?.user) fetchProfile(session.user.id);
          fetchTasks();
        });

        // Слушатель изменения статуса (Логин/Логаут)
        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setUser(session?.user || null);
          if (session?.user) {
            fetchProfile(session.user.id);
          } else {
            setProfile(null);
            setBalance(0);
          }
        });

        return () => subscription.unsubscribe();
      }, []);

      const fetchProfile = async (userId) => {
        const { data, error } = await supabase.from('profiles').select('*').eq('id', userId).single();
        if (data) {
          setProfile(data);
          setBalance(data.balance_aws);
        }
      };

      const fetchTasks = async () => {
        setIsLoading(true);
        const { data, error } = await supabase.from('tasks').select('*').order('created_at', { ascending: false });
        if (error) {
          console.error('Ошибка загрузки тасков:', error);
        } else {
          setTasks(data && data.length > 0 ? data : SYSTEM_TASKS);
        }
        setIsLoading(false);
      };

      const showToast = (message, type = 'success') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
      };

      // --- AUTH METHODS ---
      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        setAuthError('');
        setAuthMessage('');
        
        if (authMode === 'register') {
          const { data, error } = await supabase.auth.signUp({
            email: authEmail,
            password: authPassword,
          });
          if (error) {
            setAuthError(error.message);
          } else {
            setAuthMessage('Успешно! Проверьте вашу почту (и папку Спам) для подтверждения регистрации.');
          }
        } else {
          const { data, error } = await supabase.auth.signInWithPassword({
            email: authEmail,
            password: authPassword,
          });
          if (error) {
            setAuthError('Неверный Email или Пароль');
          } else {
            setAuthModalOpen(false);
            showToast('Успешный вход!');
          }
        }
      };

      const handleLogout = async () => {
        await supabase.auth.signOut();
        showToast('Вы вышли из системы');
      };

      // --- TASK METHODS ---
      const handleCreateTask = async (e) => {
        e.preventDefault();
        if (!user || !profile) { setAuthModalOpen(true); return; }
        if (!newTitle.trim()) return;

        const budgetVal = Number(newBudget) || 150000;
        const finalPhotos = taskPhotos.length > 0 ? taskPhotos : ['https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80'];

        const { data, error } = await supabase.from('tasks').insert([
          {
            title: newTitle,
            category: newCategory,
            prompt: newPrompt || 'ТЗ обсуждается в чате',
            tool: newTool,
            budget: budgetVal,
            response_fee: calculateResponseFee(budgetVal),
            author: profile.name || user.email.split('@')[0],
            author_id: user.id,
            card_frame: profile.card_frame,
            photos: finalPhotos,
            main_photo_index: mainPhotoIndex < finalPhotos.length ? mainPhotoIndex : 0
          }
        ]);

        if (error) {
          showToast('Ошибка при создании заказа', 'error');
          console.error(error);
        } else {
          showToast('Таск опубликован в ленту!');
          setNewTitle(''); setNewPrompt(''); setTaskPhotos([]);
          fetchTasks();
          setTab('feed');
        }
      };

      const handleDeleteTask = async (taskId) => {
        if (confirm('Удалить этот таск безвозвратно?')) {
          const { error } = await supabase.from('tasks').delete().eq('id', taskId);
          if (!error) {
            showToast('Таск удален');
            fetchTasks();
          }
        }
      };

      // Вспомогательные функции для UI
      const handleUploadTaskPhotos = (e) => {
        const files = Array.from(e.target.files);
        files.forEach((file) => {
          if (taskPhotos.length >= 5) return;
          const reader = new FileReader();
          reader.onloadend = () => {
            setTaskPhotos(prev => (prev.length >= 5 ? prev : [...prev, reader.result]));
          };
          reader.readAsDataURL(file);
        });
      };

      const handleRemoveTaskPhoto = (index) => {
        setTaskPhotos(prev => {
          const updated = prev.filter((_, i) => i !== index);
          if (mainPhotoIndex >= updated.length) setMainPhotoIndex(Math.max(0, updated.length - 1));
          return updated;
        });
      };

      const openTaskModalWithViewCount = (task) => {
        setViewingTask(task);
        setCurrentPhotoSlide(task.main_photo_index || 0);
      };

      const feedTasks = tasks.filter(t => !t.hidden && (selectedCat === 'All' || t.category === selectedCat));
      const myClientTasks = tasks.filter(t => user && t.author_id === user.id);

      return (
        <div className="min-h-screen flex flex-col w-full max-w-full overflow-x-hidden relative">
          
          {/* Уведомления */}
          <div className="fixed top-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-none">
            {toasts.map(t => (
              <div key={t.id} className={`toast-enter px-4 py-3 rounded-xl backdrop-blur-md border shadow-lg flex items-center gap-2 ${
                t.type === 'error' ? 'bg-red-500/20 border-red-500/50 text-red-100' : 'bg-emerald-500/20 border-emerald-500/50 text-emerald-100'
              }`}>
                <i className={`fa-solid ${t.type === 'error' ? 'fa-circle-xmark text-red-400' : 'fa-circle-check text-emerald-400'}`}></i>
                <span className="text-sm font-semibold">{t.message}</span>
              </div>
            ))}
          </div>

          {/* Header */}
          <header className="sticky top-0 z-40 bg-[#07090E]/90 backdrop-blur-lg border-b border-cyan-500/20 px-2 sm:px-6 py-2.5">
            <div className="max-w-6xl mx-auto flex items-center justify-between gap-2">
              <div className="flex items-center gap-2 cursor-pointer min-w-0 flex-shrink-0" onClick={() => setTab('feed')}>
                <div className="h-8 w-8 sm:h-9 sm:w-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-fuchsia-500 p-[1px] flex-shrink-0">
                  <div className="w-full h-full bg-[#0B0F19] rounded-[11px] flex items-center justify-center text-cyan-400">
                    <i className="fa-solid fa-robot text-sm sm:text-base"></i>
                  </div>
                </div>
                <span className="font-extrabold text-[15px] sm:text-lg tracking-wide bg-gradient-to-r from-cyan-400 via-teal-300 to-fuchsia-400 bg-clip-text text-transparent truncate hidden sm:inline">
                  AI WORKERS SPACE
                </span>
              </div>

              <div className="flex items-center gap-1 sm:gap-3 flex-shrink-0">
                <button onClick={() => setWalletModalOpen(true)} className="flex items-center gap-1 px-2 py-1.5 rounded-xl bg-slate-900 border border-amber-500/40 hover:bg-slate-800 shrink-0">
                  <i className="fa-solid fa-coins text-amber-400 text-[10px] sm:text-xs"></i>
                  <span className="text-cyan-300 font-bold text-[11px] sm:text-xs font-mono">{balance.toLocaleString()}</span>
                  <span className="hidden sm:inline text-[9px] text-slate-400 font-bold">AWS</span>
                </button>

                {user ? (
                  <div className="flex items-center gap-1 sm:gap-1.5 shrink-0">
                    <div onClick={() => setTab('cabinet')} className="flex items-center gap-1.5 cursor-pointer bg-slate-900 p-0.5 pr-1.5 sm:pr-2 rounded-xl border border-slate-800 hover:border-cyan-500/50">
                      <div className={`w-6 h-6 sm:w-7 sm:h-7 rounded-lg overflow-hidden ${profile?.avatar_frame || 'frame-none'}`}>
                        <img src={profile?.avatar || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=300&q=80'} className="w-full h-full object-cover" />
                      </div>
                      <span className="hidden md:inline text-xs font-bold text-slate-200 truncate max-w-[80px]">{profile?.name || user.email.split('@')[0]}</span>
                    </div>
                    <button onClick={handleLogout} className="w-7 h-7 sm:w-auto sm:px-2 sm:py-1.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 flex items-center justify-center hover:bg-red-500/20">
                      <i className="fa-solid fa-right-from-bracket text-xs"></i>
                    </button>
                  </div>
                ) : (
                  <button onClick={() => { setAuthMode('login'); setAuthModalOpen(true); }} className="px-2.5 py-1.5 rounded-xl bg-cyan-500 text-black text-[11px] sm:text-xs font-bold hover:bg-cyan-400 shrink-0">
                    <i className="fa-solid fa-user"></i>
                    <span className="ml-1 hidden sm:inline">Вход</span>
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="flex-1 max-w-6xl w-full mx-auto px-3 sm:px-6 py-4 sm:py-6 grid grid-cols-1 lg:grid-cols-12 gap-5 pb-20">
            {/* Сайдбар */}
            <aside className="lg:col-span-3 flex lg:flex-col gap-2 overflow-x-auto no-scrollbar pb-1 lg:pb-0 lg:sticky lg:top-20 h-fit">
              <button onClick={() => setTab('feed')} className={`flex-shrink-0 lg:flex-none flex items-center gap-2.5 px-3.5 py-2.5 sm:py-3 rounded-xl border font-medium text-xs sm:text-sm transition-all ${tab === 'feed' ? 'bg-cyan-500/20 border-cyan-500 text-cyan-300' : 'bg-slate-900/60 border-slate-800 text-slate-400 hover:text-white'}`}>
                <i className="fa-solid fa-wand-magic-sparkles text-cyan-400"></i><span>Лента заказов</span>
              </button>
              <button onClick={() => setTab('ai_studio')} className={`flex-shrink-0 lg:flex-none flex items-center gap-2.5 px-3.5 py-2.5 sm:py-3 rounded-xl border font-medium text-xs sm:text-sm transition-all ${tab === 'ai_studio' ? 'bg-fuchsia-500/20 border-fuchsia-500 text-fuchsia-300' : 'bg-slate-900/60 border-slate-800 text-slate-400 hover:text-white'}`}>
                <i className="fa-solid fa-brain text-fuchsia-400"></i><span>AI Песочница ✨</span>
              </button>
              <button onClick={() => { if (!user) setAuthModalOpen(true); else setTab('cabinet'); }} className={`flex-shrink-0 lg:flex-none flex items-center gap-2.5 px-3.5 py-2.5 sm:py-3 rounded-xl border font-medium text-xs sm:text-sm transition-all ${tab === 'cabinet' ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300' : 'bg-slate-900/60 border-slate-800 text-slate-400 hover:text-white'}`}>
                <i className="fa-solid fa-user-gear text-emerald-400"></i><span>Личный кабинет</span>
              </button>
              <button onClick={() => { if (!user) setAuthModalOpen(true); else setTab('create'); }} className={`flex-shrink-0 lg:flex-none flex items-center gap-2.5 px-3.5 py-2.5 sm:py-3 rounded-xl border font-medium text-xs sm:text-sm transition-all ${tab === 'create' ? 'bg-cyan-500/20 border-cyan-500 text-cyan-300' : 'bg-slate-900/60 border-slate-800 text-slate-400 hover:text-white'}`}>
                <i className="fa-solid fa-circle-plus text-cyan-400"></i><span>Разместить таск</span>
              </button>
            </aside>

            {/* Контент */}
            <section className="lg:col-span-9 space-y-4 min-w-0">
              
              {/* FEED */}
              {tab === 'feed' && (
                <>
                  <div className="relative overflow-hidden rounded-2xl bg-gradient-to-r from-[#0E1726] via-[#111C35] to-[#0A101D] border border-cyan-500/30 p-5 sm:p-7 shadow-xl">
                    <div className="relative z-10 max-w-xl space-y-2">
                      <span className="text-[10px] sm:text-[11px] font-mono uppercase px-2.5 py-1 rounded-full bg-cyan-500/10 text-cyan-300 border border-cyan-500/30 font-semibold tracking-wider">✨ НОВОЕ ПОКОЛЕНИЕ ФРИЛАНСА</span>
                      <h1 className="text-xl sm:text-3xl font-extrabold tracking-tight text-white leading-tight">Нанимайте лучших <span className="bg-gradient-to-r from-cyan-400 via-teal-300 to-fuchsia-400 bg-clip-text text-transparent">AI-креаторов</span></h1>
                      <p className="text-xs sm:text-sm text-slate-300">Платформа подключена к базе данных Supabase.</p>
                    </div>
                  </div>

                  <div className="flex items-center gap-2 overflow-x-auto no-scrollbar bg-slate-900/60 p-2 rounded-2xl border border-slate-800">
                    {[{ id: 'All', name: '🔥 Все' }, { id: 'video', name: '🎬 Видео' }, { id: 'art', name: '🎨 Арт' }, { id: 'web', name: '💻 Код' }].map((cat) => (
                      <button key={cat.id} onClick={() => setSelectedCat(cat.id)} className={`px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${selectedCat === cat.id ? 'bg-cyan-500 text-black font-bold' : 'bg-slate-950 text-slate-400 border border-slate-800/80 hover:text-slate-200'}`}>
                        {cat.name}
                      </button>
                    ))}
                  </div>

                  <div className="grid grid-cols-1 gap-4">
                    {isLoading ? (
                       <div className="text-center py-10 text-cyan-500"><i className="fa-solid fa-circle-notch fa-spin text-2xl"></i></div>
                    ) : feedTasks.length === 0 ? (
                       <div className="text-center py-10 text-slate-500 text-sm">Нет тасков. Создайте первый!</div>
                    ) : (
                      feedTasks.map((item) => (
                        <div key={item.id} className={`bg-[#0D121F] p-4 sm:p-5 rounded-2xl ${item.card_frame || 'card-frame-default'} flex flex-col sm:flex-row gap-4 sm:items-center transition-all min-w-0 relative`}>
                          <div onClick={() => openTaskModalWithViewCount(item)} className="w-full sm:w-40 h-48 sm:h-32 rounded-xl overflow-hidden border border-cyan-500/20 bg-slate-950 flex-shrink-0 relative cursor-pointer group">
                            <img src={item.photos[item.main_photo_index || 0] || item.photos[0]} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                          </div>

                          <div className="flex-1 min-w-0 space-y-2">
                            <div className="flex items-center gap-2 flex-wrap">
                              <span className="text-[10px] bg-cyan-950 text-cyan-400 border border-cyan-800/40 px-2 py-0.5 rounded font-mono font-bold">{item.tool}</span>
                              <span className="text-[11px] text-emerald-400 font-bold">● Открыт</span>
                            </div>
                            <h3 onClick={() => openTaskModalWithViewCount(item)} className="font-bold text-sm sm:text-base text-slate-100 break-words leading-snug cursor-pointer hover:text-cyan-300 transition-colors">{item.title}</h3>
                            <div className="flex items-center gap-2 text-[11px] text-slate-400 truncate">
                              <span>{item.author}</span> • <span className="text-emerald-400 font-mono">ID #{item.id.toString().substring(0,6).toUpperCase()}</span>
                            </div>
                          </div>

                          <div className="w-full sm:w-auto flex sm:flex-col items-center sm:items-end justify-between gap-2.5 pt-3 sm:pt-0 border-t sm:border-0 border-slate-800/60">
                            <div className="text-left sm:text-right">
                              <div className="text-[10px] text-slate-400 uppercase font-mono">Бюджет сделки</div>
                              <div className="font-mono text-lg font-extrabold text-cyan-400">{item.budget.toLocaleString()} AWS</div>
                            </div>
                            <button onClick={() => openTaskModalWithViewCount(item)} className="px-4 py-2 rounded-xl font-bold text-xs bg-cyan-500 text-black hover:bg-cyan-400 flex items-center gap-1.5 flex-shrink-0">
                              <i className="fa-solid fa-eye"></i> Осмотреть
                            </button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </>
              )}

              {/* CABINET */}
              {tab === 'cabinet' && user && (
                <div className="space-y-4">
                  <div className="bg-[#0D121F] p-5 rounded-2xl border border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div className="flex items-center gap-3.5">
                      <div className={`w-14 h-14 rounded-2xl overflow-hidden ${profile?.avatar_frame || 'frame-none'} flex-shrink-0`}>
                        <img src={profile?.avatar || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=300&q=80'} className="w-full h-full object-cover" />
                      </div>
                      <div className="min-w-0">
                        <div className="flex items-center gap-2">
                          <h2 className="text-base sm:text-lg font-bold text-slate-100 truncate">{profile?.name || user.email.split('@')[0]}</h2>
                          <span className="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full font-mono flex-shrink-0">✓ Supabase</span>
                        </div>
                        <p className="text-xs text-slate-400 font-mono truncate">{user.email}</p>
                      </div>
                    </div>
                  </div>

                  <div className="flex gap-2 border-b border-slate-800 pb-2 overflow-x-auto no-scrollbar">
                    <button onClick={() => setCabinetSubTab('my-orders')} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${cabinetSubTab === 'my-orders' ? 'bg-cyan-500 text-black' : 'bg-slate-900 text-slate-400 hover:text-white'}`}>Мои таски ({myClientTasks.length})</button>
                  </div>

                  {cabinetSubTab === 'my-orders' && (
                    myClientTasks.length === 0 ? (
                      <div className="text-center py-10 bg-[#0D121F] rounded-2xl border border-slate-800 text-slate-400 text-sm">У вас еще нет заданий в базе</div>
                    ) : (
                      <div className="grid grid-cols-1 gap-3">
                        {myClientTasks.map(item => (
                          <div key={item.id} className={`bg-[#0D121F] p-4 rounded-2xl ${item.card_frame || 'card-frame-default'} flex flex-col gap-3 min-w-0`}>
                            <div className="flex justify-between items-start gap-2">
                              <div>
                                <h4 className="font-bold text-sm text-slate-100">{item.title}</h4>
                                <div className="text-xs text-slate-400 font-mono mt-1">Бюджет: {item.budget.toLocaleString()} AWS</div>
                              </div>
                            </div>
                            <div className="pt-3 border-t border-slate-800/80 flex flex-wrap items-center gap-2 text-xs">
                              <button onClick={() => handleDeleteTask(item.id)} className="px-3 py-1 rounded-lg bg-red-500/10 text-red-400 hover:bg-red-500/20"><i className="fa-solid fa-trash-can mr-1"></i> Удалить из БД</button>
                            </div>
                          </div>
                        ))}
                      </div>
                    )
                  )}
                </div>
              )}

              {/* CREATE TASK */}
              {tab === 'create' && (
                <div className="bg-[#0D121F] p-5 sm:p-7 rounded-2xl border border-cyan-500/30">
                  <h2 className="text-lg font-bold text-cyan-400 mb-4">Создать задание (запись в Supabase)</h2>
                  <form onSubmit={handleCreateTask} className="space-y-4">
                    <input type="text" required placeholder="Название проекта" value={newTitle} onChange={(e) => setNewTitle(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:border-cyan-500 outline-none" />
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <select value={newCategory} onChange={(e) => setNewCategory(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 text-sm outline-none">
                        <option value="video">🎬 AI-Видео</option><option value="art">🎨 Арт</option><option value="web">💻 Код</option>
                      </select>
                      <select value={newTool} onChange={(e) => setNewTool(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 text-sm outline-none">
                        <option value="ComfyUI">ComfyUI</option><option value="Runway Gen-3">Runway Gen-3</option><option value="Claude 3.5">Claude 3.5</option>
                      </select>
                      <input type="number" required placeholder="Бюджет (AWS)" value={newBudget} onChange={(e) => setNewBudget(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm font-mono text-cyan-300 outline-none focus:border-cyan-500" />
                    </div>
                    
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-3">
                      <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-2">
                        <label className="text-xs font-semibold text-slate-200"><i className="fa-solid fa-images text-cyan-400 mr-1.5"></i> Прикрепленные фото ({taskPhotos.length}/5)</label>
                        {taskPhotos.length < 5 && (
                          <label className="px-3.5 py-1.5 bg-cyan-500 text-black font-bold text-xs rounded-xl cursor-pointer hover:bg-cyan-400 flex items-center gap-1.5 w-fit">
                            <i className="fa-solid fa-upload"></i> Выбрать с устройства
                            <input type="file" accept="image/*" multiple className="hidden" onChange={handleUploadTaskPhotos} />
                          </label>
                        )}
                      </div>
                      
                      {taskPhotos.length > 0 && (
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-2">
                          {taskPhotos.map((photo, idx) => (
                            <div key={idx} className="relative w-full h-24 rounded-xl border border-slate-700 bg-slate-900 group">
                              <img src={photo} className="w-full h-full object-cover rounded-xl" />
                              <button type="button" onClick={() => setMainPhotoIndex(idx)} className={`absolute top-1 left-1 px-2 py-0.5 rounded text-[9px] font-bold z-50 cursor-pointer ${mainPhotoIndex === idx ? 'bg-amber-500 text-black' : 'bg-black/60 text-white'}`}>Главное</button>
                              <button type="button" onClick={() => handleRemoveTaskPhoto(idx)} className="absolute top-1 right-1 w-7 h-7 rounded-full bg-red-500 text-white flex items-center justify-center text-xs hover:bg-red-400 z-50 cursor-pointer"><i className="fa-solid fa-xmark"></i></button>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                    <textarea rows="3" placeholder="Подробное ТЗ..." value={newPrompt} onChange={(e) => setNewPrompt(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm outline-none"></textarea>
                    <button type="submit" className="w-full py-4 rounded-xl bg-gradient-to-r from-cyan-500 to-fuchsia-500 text-black font-extrabold text-sm shadow-lg shadow-cyan-500/20">Опубликовать заказ</button>
                  </form>
                </div>
              )}
            </section>
          </main>

          {/* TASK VIEW MODAL */}
          {viewingTask && (
            <div className="fixed inset-0 z-[50] bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0D121F] border border-cyan-500/40 rounded-2xl p-5 sm:p-7 max-w-2xl w-full max-h-[90vh] flex flex-col relative overflow-y-auto">
                <button onClick={() => setViewingTask(null)} className="absolute top-4 right-4 text-slate-400 hover:text-white z-20 bg-black/50 w-8 h-8 rounded-full"><i className="fa-solid fa-xmark"></i></button>
                <div className="relative w-full h-64 sm:h-80 rounded-xl overflow-hidden bg-slate-950 mb-4 border border-slate-800">
                  <img src={viewingTask.photos[currentPhotoSlide] || viewingTask.photos[0]} className="w-full h-full object-contain" />
                </div>
                <div className="space-y-3">
                  <div className="flex justify-between items-center">
                    <span className="text-xs bg-cyan-950 text-cyan-400 border border-cyan-800/40 px-2.5 py-1 rounded font-mono font-bold">{viewingTask.tool}</span>
                    <div className="font-mono text-xl font-extrabold text-cyan-400">{viewingTask.budget.toLocaleString()} AWS</div>
                  </div>
                  <h2 className="text-lg font-bold text-slate-100">{viewingTask.title}</h2>
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 text-xs font-mono text-slate-300 whitespace-pre-wrap"><span className="text-cyan-400">ТЗ:</span> {viewingTask.prompt}</div>
                </div>
              </div>
            </div>
          )}

          {/* AUTH MODAL */}
          {authModalOpen && (
            <div className="fixed inset-0 z-[60] bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0D121F] border border-cyan-500/40 rounded-2xl p-5 sm:p-7 max-w-sm w-full relative">
                <button onClick={() => setAuthModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white"><i className="fa-solid fa-xmark text-lg"></i></button>

                <h3 className="text-lg font-bold text-slate-100 mb-4">
                  {authMode === 'login' ? 'Вход в систему' : 'Регистрация'}
                </h3>
                
                <form onSubmit={handleAuthSubmit} className="space-y-3">
                  <input type="email" required placeholder="Email" value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm outline-none" />
                  <input type="password" required placeholder="Пароль" value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm outline-none" />
                  
                  {authError && <div className="text-red-400 text-xs font-bold bg-red-950/30 p-2 rounded">{authError}</div>}
                  {authMessage && <div className="text-emerald-400 text-xs font-bold bg-emerald-950/30 p-2 rounded">{authMessage}</div>}

                  <button type="submit" className="w-full py-3 rounded-xl bg-cyan-500 text-black font-bold text-sm">
                    {authMode === 'login' ? 'Войти' : 'Зарегистрироваться'}
                  </button>
                </form>
                
                <button onClick={() => { setAuthMode(authMode === 'login' ? 'register' : 'login'); setAuthError(''); setAuthMessage(''); }} className="mt-4 text-xs text-cyan-400 underline w-full text-center">
                  {authMode === 'login' ? 'Нет аккаунта? Создать' : 'Уже есть аккаунт? Войти'}
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

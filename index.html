    const compressImage = (file) => {
      return new Promise((resolve) => {
        const reader = new FileReader(); reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image(); img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const scaleSize = 600 / img.width;
            canvas.width = 600; canvas.height = img.height * scaleSize;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          };
        };
      });
    };

    const calculateResponseFee = (b) => {

      let fee;
      if (b <= 2000) fee = 100; 
      else if (b <= 5000) fee = Math.max(100, Math.round(b * 0.05)); 
      else fee = Math.round(250 + ((b - 5000) / 95000) * 950); 
      return Math.max(50, Math.round(fee / 2));

           await window.Firebase.setDoc(docRef, {
               messages: [...existingMsgs, newMsg],
               userEmail: targetEmail,

          if (aiMode === 'image') {
             const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(aiPrompt+', highly detailed, 8k')}?width=1024&height=1024&seed=${Date.now()}&nologo=true`;
             const img = new Image(); img.src = url;

                              setPaidUnlocks([...paidUnlocks, selectedTaskForChat.id]); 
                              showToast('Чат разблокирован!'); 
                            } 
                          }} className="w-full sm:w-auto px-6 py-3 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 text-black font-extrabold text-xs whitespace-nowrap shadow-[0_0_15px_rgba(245,158,11,0.3)] hover:scale-[1.02] transition-transform">
                            {t('payFeeBtn')} ({selectedTaskForChat.response_fee} AWS)
                          </button>
                      )}
                    </div>
                  )}
                </div>
              )}
            </section>
          </main>

          {/* МОДАЛКА: ПРОСМОТР ЗАДАЧИ */}
          {viewingTask && (
            <div className="fixed inset-0 z-[60] bg-black/90 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 animate-fade-in">
              <div className="bg-[#0A0E17] border border-cyan-500/30 rounded-3xl p-5 sm:p-8 max-w-3xl w-full max-h-[95vh] flex flex-col relative overflow-y-auto shadow-2xl">
                <button onClick={() => setViewingTask(null)} className="absolute top-4 right-4 text-slate-400 hover:text-white z-20 bg-slate-900/80 w-8 h-8 rounded-full flex items-center justify-center border border-slate-700 transition-colors"><i className="fa-solid fa-xmark"></i></button>
                
                <div className="relative w-full h-56 sm:h-96 rounded-2xl overflow-hidden bg-slate-950 mb-5 border border-slate-800 shrink-0 group">
                  <img src={viewingTask.photos[currentPhotoSlide] || viewingTask.photos[0]} className="w-full h-full object-contain" alt="Task Ref" />
                  {viewingTask.photos.length > 1 && (
                    <>
                      <button onClick={() => setCurrentPhotoSlide(p => p > 0 ? p - 1 : viewingTask.photos.length - 1)} className="absolute left-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/70 text-white hover:bg-black opacity-0 group-hover:opacity-100 transition-opacity border border-slate-700"><i className="fa-solid fa-chevron-left"></i></button>
                      <button onClick={() => setCurrentPhotoSlide(p => p < viewingTask.photos.length - 1 ? p + 1 : 0)} className="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/70 text-white hover:bg-black opacity-0 group-hover:opacity-100 transition-opacity border border-slate-700"><i className="fa-solid fa-chevron-right"></i></button>
                      <div className="absolute bottom-3 left-1/2 -translate-x-1/2 bg-black/60 px-3 py-1 rounded-full text-[10px] text-white backdrop-blur-md">
                        {currentPhotoSlide + 1} / {viewingTask.photos.length}
                      </div>
                    </>
                  )}
                </div>

                <div className="space-y-4">
                  <div className="flex flex-wrap justify-between items-end gap-2 border-b border-slate-800 pb-4">
                    <div>
                      <div className="flex gap-2 mb-2">
                        <span className="text-[10px] bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 px-2 py-1 rounded font-mono font-bold">{viewingTask.tool}</span>
                        <span className="text-[10px] bg-slate-800 text-slate-300 border border-slate-700 px-2 py-1 rounded font-mono font-bold">{t('views')}: {viewingTask.views || 0}</span>
                      </div>
                      <h2 className="text-xl sm:text-2xl font-bold text-slate-100 leading-tight">{viewingTask.title}</h2>
                    </div>
                    <div className="text-right">
                       <div className="text-[10px] text-slate-500 uppercase font-bold">{t('budget')}</div>
                       <div className="font-mono text-2xl font-extrabold text-cyan-400 drop-shadow-[0_0_8px_rgba(6,182,212,0.5)]">{viewingTask.budget.toLocaleString()} AWS</div>
                    </div>
                  </div>

                  <div className="py-2">
                    <div className="text-[10px] text-slate-500 uppercase font-bold mb-2">{t('taskDescTitle')}</div>
                    <div className="p-4 bg-slate-900/50 rounded-xl border border-slate-800/80 text-sm font-sans text-slate-300 whitespace-pre-wrap leading-relaxed">{viewingTask.prompt}</div>
                  </div>
                  
                  <div className="pt-2">
                    {(!user || user.id === viewingTask.author_id || paidUnlocks.includes(viewingTask.id)) ? (
                      <button onClick={() => { setViewingTask(null); setSelectedTaskForChat(viewingTask); setTab('deal_chat'); }} className="w-full py-4 rounded-xl bg-gradient-to-r from-cyan-600 to-cyan-500 text-white font-bold text-sm hover:opacity-90 shadow-lg shadow-cyan-500/20">{t('openChat')}</button>
                    ) : (
                      <>
                        {!emailVerified && isGlobalMode ? (
                           <div className="text-center p-3 text-xs font-bold text-red-400 border border-red-500/30 rounded-xl bg-red-900/20">Подтвердите Email, чтобы взять этот заказ в работу.</div>
                        ) : (
                           <button onClick={() => { 
                             if(balance < viewingTask.response_fee) { 
                               setWalletModalOpen(true); 
                             } else { 
                               setBalance(p => p - viewingTask.response_fee); 
                               setPaidUnlocks([...paidUnlocks, viewingTask.id]); 
                               setViewingTask(null); 
                               setSelectedTaskForChat(viewingTask); 
                               setTab('deal_chat'); 
                               showToast('Чат открыт!'); 
                             } 
                           }} className="w-full py-4 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 text-black font-extrabold text-sm hover:opacity-90 shadow-lg shadow-amber-500/20 flex flex-col items-center">
                             <span>{t('respondTask')}</span>
                             <span className="text-[10px] font-medium opacity-80">{t('applyCost')} {viewingTask.response_fee} AWS</span>
                           </button>
                        )}
                      </>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* КОШЕЛЕК / КАССА С КРИПТОЙ */}
          {walletModalOpen && (
            <div className="fixed inset-0 z-[80] bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0A0E17] border border-amber-500/40 rounded-3xl p-6 sm:p-8 max-w-sm w-full relative shadow-[0_0_30px_rgba(245,158,11,0.1)]">
                <button onClick={() => { setWalletModalOpen(false); setCryptoStep(1); }} className="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-900 w-8 h-8 rounded-full flex items-center justify-center"><i className="fa-solid fa-xmark"></i></button>
                
                {cryptoStep === 1 ? (
                  <>
                    <div className="text-center mb-6">
                      <div className="w-12 h-12 bg-amber-500/20 text-amber-400 rounded-full flex items-center justify-center mx-auto mb-3 text-xl"><i className="fa-brands fa-bitcoin"></i></div>
                      <h3 className="text-xl font-bold text-slate-100">{t('walletTitle')}</h3>
                      <p className="text-[10px] text-slate-400 mt-1">Курс: 1 USDT = 1 AWS</p>
                    </div>
                    
                    <div className="relative mb-5">
                       <input type="number" value={depositAmountAWS} onChange={(e) => setDepositAmountAWS(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3.5 text-lg font-mono text-center text-amber-400 outline-none focus:border-amber-500" placeholder="Сумма" />
                       <div className="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-600">AWS</div>
                    </div>
                    
                    <div className="p-4 bg-slate-900/50 border border-slate-700/50 rounded-xl text-sm flex justify-between items-center mb-6">
                      <span className="text-slate-400">{t('toPay')}</span>
                      <span className="font-mono font-bold text-white text-lg">{depositAmountAWS} <span className="text-xs text-slate-500">USDT</span></span>
                    </div>
                    <button onClick={() => { if(Number(depositAmountAWS)>0) setCryptoStep(2); }} className="w-full py-3.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-black font-extrabold text-sm hover:shadow-[0_0_20px_rgba(245,158,11,0.4)] transition-all">Оплатить криптовалютой</button>
                  </>
                ) : (
                  <>
                    <div className="text-center mb-6">
                      <h3 className="text-lg font-bold text-white mb-2">Перевод USDT (TRC20/BEP20)</h3>
                      <p className="text-xs text-slate-400">Переведите ровно <strong className="text-amber-400">{depositAmountAWS} USDT</strong> на этот кошелек.</p>
                    </div>
                    
                    <div className="bg-slate-900 p-4 rounded-xl border border-slate-700 mb-6 text-center">
                       <div className="text-[10px] text-slate-500 mb-2">Адрес кошелька</div>
                       <div className="font-mono text-xs text-emerald-400 break-all select-all">{CRYPTO_WALLET}</div>
                    </div>

                    {cryptoChecking ? (
                       <div className="text-center py-3">
                          <i className="fa-solid fa-circle-notch fa-spin text-amber-400 text-2xl mb-2"></i>
                          <div className="text-xs text-slate-400">Ожидание подтверждения сети...</div>
                       </div>
                    ) : (
                       <button onClick={handleCryptoPaySubmit} className="w-full py-3.5 rounded-xl bg-emerald-600 text-white font-extrabold text-sm hover:bg-emerald-500 transition-all">Я отправил перевод</button>
                    )}
                    <button onClick={() => setCryptoStep(1)} className="w-full mt-3 text-xs text-slate-500 hover:text-white">Назад</button>
                  </>
                )}
              </div>
            </div>
          )}

          {/* АВТОРИЗАЦИЯ */}
          {authModalOpen && (
            <div className="fixed inset-0 z-[90] bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0A0E17] border border-cyan-500/40 rounded-3xl p-6 sm:p-8 max-w-sm w-full relative shadow-[0_0_30px_rgba(6,182,212,0.1)]">
                <button onClick={() => setAuthModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-900 w-8 h-8 rounded-full flex items-center justify-center"><i className="fa-solid fa-xmark"></i></button>
                <div className="text-center mb-6">
                  <div className="w-12 h-12 bg-cyan-500/20 text-cyan-400 rounded-2xl flex items-center justify-center mx-auto mb-3 text-xl rotate-12"><i className="fa-solid fa-robot -rotate-12"></i></div>
                  <h3 className="text-xl font-bold text-slate-100">{authMode === 'login' ? t('authTitleLogin') : t('authTitleReg')}</h3>
                </div>

                <form onSubmit={handleAuthSubmit} className="space-y-4">
                  <input type="email" required placeholder={t('email')} value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3.5 text-sm outline-none focus:border-cyan-500 text-slate-200" />
                  <input type="password" required placeholder={t('pass')} value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3.5 text-sm outline-none focus:border-cyan-500 text-slate-200" />
                  
                  {authError && <div className="text-[11px] font-medium text-red-200 text-center bg-red-900/40 py-3 px-4 rounded-xl border border-red-500/50 leading-relaxed shadow-[0_0_15px_rgba(239,68,68,0.2)]">{authError}</div>}
                  
                  <button type="submit" disabled={authLoading} className={`w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-500 text-white font-extrabold text-sm hover:shadow-[0_0_20px_rgba(6,182,212,0.4)] transition-all mt-2 flex justify-center items-center gap-2 ${authLoading ? 'opacity-70 cursor-not-allowed' : ''}`}>
                    {authLoading ? <><i className="fa-solid fa-spinner fa-spin"></i> Синтез...</> : (authMode === 'login' ? t('login') : t('authTitleReg'))}
                  </button>
                </form>
                
                <div className="mt-6 text-center border-t border-slate-800 pt-5">
                  {authMode === 'login' ? (
                     <button type="button" onClick={() => { setAuthMode('register'); setAuthError(''); }} className="text-xs text-cyan-400 hover:text-cyan-300 font-medium">{t('noAcc')}</button>
                  ) : (
                     <button type="button" onClick={() => { setAuthMode('login'); setAuthError(''); }} className="text-xs text-slate-400 hover:text-white font-medium">{t('yesAcc')}</button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ПОДДЕРЖКА WIDGET (USER) */}
          {user && !isAdmin && (
            <div className="fixed bottom-6 right-6 z-50 flex flex-col items-end">
               {supportOpen && (
                 <div className="w-80 h-96 bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl mb-4 flex flex-col overflow-hidden animate-fade-in">
                    <div className="bg-cyan-600 px-4 py-3 flex justify-between items-center text-white">
                       <span className="font-bold text-sm"><i className="fa-solid fa-headset mr-2"></i> {t('support')}</span>
                       <button onClick={()=>setSupportOpen(false)}><i className="fa-solid fa-xmark"></i></button>
                    </div>
                    <div ref={chatScrollRef} className="flex-1 p-4 overflow-y-auto space-y-3 bg-[#05070A]/50">
                       <div className="text-center text-[10px] text-slate-500 mb-2">Напишите нам, мы скоро ответим!</div>
                       {mySupportMsgs.map(m => (
                          <div key={m.id} className={`flex flex-col ${m.isAdmin ? 'items-start' : 'items-end'}`}>
                             <div className={`px-3 py-2 text-xs rounded-xl max-w-[85%] break-words ${m.isAdmin ? 'bg-slate-800 border border-slate-700 text-white' : 'bg-cyan-600 text-white'}`}>{m.text}</div>
                          </div>
                       ))}
                    </div>
                    <form onSubmit={(e)=>handleSendSupportMessage(e, false)} className="p-3 bg-slate-900 border-t border-slate-700 flex gap-2">
                       <input type="text" value={supportInput} onChange={e=>setSupportInput(e.target.value)} placeholder="Сообщение..." className="flex-1 bg-slate-950 px-3 py-2 rounded-lg text-sm text-white outline-none border border-slate-800" />
                       <button type="submit" className="px-3 py-2 bg-cyan-600 rounded-lg text-white"><i className="fa-solid fa-paper-plane"></i></button>
                    </form>
                 </div>
               )}
               <button onClick={()=>setSupportOpen(!supportOpen)} className="w-14 h-14 bg-cyan-600 hover:bg-cyan-500 text-white rounded-full shadow-[0_0_20px_rgba(6,182,212,0.4)] flex items-center justify-center text-2xl transition-transform hover:scale-110">
                 <i className={`fa-solid ${supportOpen ? 'fa-xmark' : 'fa-headset'}`}></i>
               </button>
            </div>
          )}

          <footer className="mt-auto border-t border-slate-800/50 bg-[#020305] px-4 py-8 text-xs text-slate-500">
            <div className="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
              <div className="text-center md:text-left">
                <div className="font-extrabold text-slate-400 text-sm tracking-widest mb-1">{t('appTitle')}</div>
                <div className="font-mono text-[9px] opacity-60">Храппа М.Н. • ИНН: 390400469138</div>
              </div>
              <div className="text-center md:text-right font-mono text-[10px]">
                <div className="mb-1">Secure Environment v2.0</div>
                <div>© 2026 AWS Platform. All rights reserved.</div>
              </div>
            </div>
          </footer>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI WORKERS SPACE — Нанимайте лучших AI-креаторов</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #07090E; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#07090E] min-h-screen text-slate-100 selection:bg-cyan-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const CATEGORIES = [
      { id: 'All', name: '🔥 Все заказы' },
      { id: 'art', name: '🎨 Арт и Графика' },
      { id: 'arch', name: '🏛️ Архитектура и Дизайн' },
      { id: 'video', name: '🎬 AI-Видео и Кино' },
      { id: 'music', name: '🎵 Музыка и Голос' },
      { id: 'web', name: '💻 Сайты и Кодинг' },
      { id: 'biz', name: '⚡ Автоматизация бизнеса' },
      { id: '3d', name: '👾 3D и GameDev' }
    ];

    const INITIAL_TASKS = [
      {
        id: 101,
        category: 'art',
        title: 'Генерация реалистичного фуд-арта для ресторанного меню',
        prompt: 'Hyper-realistic gourmet burger photoshoot, cinematic warm lighting, 8k resolution --ar 16:9 --v 6.0',
        tool: 'Midjourney v6',
        budget: 450,
        currency: 'AWS',
        author: 'RestoGroup',
        author_id: 'client_sample_1',
        executor_id: null,
        status: 'open', // 'open' | 'in_progress' | 'review' | 'completed'
        views: 142,
        preview: 'https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 102,
        category: 'video',
        title: 'Кинематографичный AI-трейлер для инди-игры',
        prompt: 'Cyberpunk nomad warrior standing in neon rain, cinematic camera rotation --motion 5',
        tool: 'Runway Gen-3',
        budget: 800,
        currency: 'AWS',
        author: 'CyberIndie Studio',
        author_id: 'client_sample_2',
        executor_id: null,
        status: 'open',
        views: 89,
        preview: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 103,
        category: 'arch',
        title: 'Концепт-арт современного видового отеля в горах',
        prompt: 'Modern brutalist luxury villa embedded in alpine rocks, floor to ceiling glass, dusk atmosphere, architectural rendering',
        tool: 'FLUX.1 / ControlNet',
        budget: 950,
        currency: 'AWS',
        author: 'NordicArch',
        author_id: 'client_sample_3',
        executor_id: null,
        status: 'open',
        views: 215,
        preview: 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 104,
        category: 'biz',
        title: 'Разработка Telegram-бота с интеграцией Claude 3.5 для поддержки',
        prompt: 'Automated CRM customer support bot with memory embeddings and Supabase vector store',
        tool: 'Claude 3.5 / Python',
        budget: 1200,
        currency: 'AWS',
        author: 'TechFin Group',
        author_id: 'client_sample_4',
        executor_id: null,
        status: 'open',
        views: 310,
        preview: 'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=600&q=80'
      }
    ];

    const CREATORS = [
      {
        id: 1,
        name: 'Алексей "PromptMaster"',
        rating: '4.98',
        deals: 64,
        category: 'Арт & Архитектура',
        skills: ['Midjourney', 'FLUX.1', 'ComfyUI'],
        avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80'
      },
      {
        id: 2,
        name: 'Elena Synthetica',
        rating: '5.00',
        deals: 92,
        category: 'AI-Видео & Саунд',
        skills: ['Runway Gen-3', 'Suno AI', 'ElevenLabs'],
        avatar: 'https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=200&q=80'
      },
      {
        id: 3,
        name: 'DevNeural',
        rating: '4.95',
        deals: 48,
        category: 'Автоматизация & Боты',
        skills: ['ChatGPT API', 'Claude 3.5', 'Make / n8n'],
        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80'
      }
    ];

    function App() {
      const [tab, setTab] = useState('feed');
      const [role, setRole] = useState('freelancer');
      const [cabinetSubTab, setCabinetSubTab] = useState('my-orders');
      
      const [balance, setBalance] = useState(() => {
        const b = localStorage.getItem('aws_balance');
        return b ? Number(b) : 1450;
      });

      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem('aws_tasks');
        return saved ? JSON.parse(saved) : INITIAL_TASKS;
      });
      const [favorites, setFavorites] = useState(() => {
        const favs = localStorage.getItem('aws_favorites');
        return favs ? JSON.parse(favs) : [];
      });
      const [selectedCat, setSelectedCat] = useState('All');

      // Авторизация
      const [user, setUser] = useState(() => {
        const savedUser = localStorage.getItem('aws_active_user');
        return savedUser ? JSON.parse(savedUser) : null;
      });
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [verificationCode, setVerificationCode] = useState('');
      const [generatedOtp, setGeneratedOtp] = useState('');
      const [authError, setAuthError] = useState('');

      // Кошелек
      const [walletModalOpen, setWalletModalOpen] = useState(false);
      const [walletTab, setWalletTab] = useState('deposit');
      const [selectedCrypto, setSelectedCrypto] = useState('usdt_trc20');
      const [depositAmount, setDepositAmount] = useState('100');
      const [withdrawAmount, setWithdrawAmount] = useState('');
      const [withdrawAddress, setWithdrawAddress] = useState('');
      const [depositSuccess, setDepositSuccess] = useState(false);

      // Форма задачи
      const [newTitle, setNewTitle] = useState('');
      const [newCategory, setNewCategory] = useState('art');
      const [newPrompt, setNewPrompt] = useState('');
      const [newBudget, setNewBudget] = useState('');
      const [newTool, setNewTool] = useState('Midjourney v6');

      // Чат и Escrow
      const [selectedTaskForChat, setSelectedTaskForChat] = useState(null);
      const [dealMessages, setDealMessages] = useState({});
      const [chatInput, setChatInput] = useState('');

      useEffect(() => {
        localStorage.setItem('aws_tasks', JSON.stringify(tasks));
      }, [tasks]);

      useEffect(() => {
        localStorage.setItem('aws_favorites', JSON.stringify(favorites));
      }, [favorites]);

      useEffect(() => {
        localStorage.setItem('aws_balance', balance.toString());
      }, [balance]);

      // Авторизация
      const handleStartRegister = (e) => {
        e.preventDefault();
        setAuthError('');
        if (authPassword.length < 6) {
          setAuthError('Пароль должен содержать минимум 6 символов');
          return;
        }
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        setGeneratedOtp(code);
        setAuthMode('verify_email');
      };

      const handleVerifyEmail = (e) => {
        e.preventDefault();
        if (verificationCode.trim() !== generatedOtp) {
          setAuthError('Неверный код подтверждения!');
          return;
        }
        const cleanEmail = authEmail.trim().toLowerCase();
        const newUser = {
          id: 'user_' + btoa(cleanEmail).substring(0, 10),
          email: cleanEmail,
          name: cleanEmail.split('@')[0],
          verified: true
        };
        setUser(newUser);
        localStorage.setItem('aws_active_user', JSON.stringify(newUser));
        setAuthModalOpen(false);
        setAuthEmail('');
        setAuthPassword('');
        setVerificationCode('');
      };

      const handleLogin = (e) => {
        e.preventDefault();
        setAuthError('');
        const cleanEmail = authEmail.trim().toLowerCase();
        const loggedUser = {
          id: 'user_' + btoa(cleanEmail).substring(0, 10),
          email: cleanEmail,
          name: cleanEmail.split('@')[0],
          verified: true
        };
        setUser(loggedUser);
        localStorage.setItem('aws_active_user', JSON.stringify(loggedUser));
        setAuthModalOpen(false);
        setAuthEmail('');
        setAuthPassword('');
      };

      const handleLogout = () => {
        setUser(null);
        localStorage.removeItem('aws_active_user');
      };

      const toggleFavorite = (taskId) => {
        if (favorites.includes(taskId)) {
          setFavorites(favorites.filter(id => id !== taskId));
        } else {
          setFavorites([...favorites, taskId]);
        }
      };

      const handleCreateTask = (e) => {
        e.preventDefault();
        if (!user) {
          setAuthModalOpen(true);
          return;
        }
        if (!newTitle || !newBudget) return;

        const taskBudget = Number(newBudget);
        if (balance < taskBudget) {
          setWalletModalOpen(true);
          return;
        }

        const taskObj = {
          id: Date.now(),
          category: newCategory,
          title: newTitle,
          prompt: newPrompt || 'ТЗ будет уточнено в чате заказа',
          tool: newTool,
          budget: taskBudget,
          currency: 'AWS',
          author: user.name,
          author_id: user.id,
          executor_id: null,
          status: 'open',
          views: 1,
          preview: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80'
        };

        setBalance(prev => prev - taskBudget);
        setTasks([taskObj, ...tasks]);
        setNewTitle('');
        setNewPrompt('');
        setNewBudget('');
        setTab('cabinet');
        setCabinetSubTab('my-orders');
      };

      const handleTakeTask = (taskId) => {
        if (!user) {
          setAuthModalOpen(true);
          return;
        }

        const updated = tasks.map(t => {
          if (t.id === taskId) {
            return { ...t, status: 'in_progress', executor_id: user.id };
          }
          return t;
        });
        setTasks(updated);

        const target = updated.find(t => t.id === taskId);
        openTaskChat(target);
      };

      const openTaskChat = (task) => {
        setSelectedTaskForChat(task);
        if (!dealMessages[task.id]) {
          setDealMessages(prev => ({
            ...prev,
            [task.id]: [
              { id: 1, sender: task.author, text: `Привет! Заказ #${task.id} запущен в работу. Средства заморожены в Escrow. Жду материалы!`, isMe: false }
            ]
          }));
        }
        setTab('deal_chat');
      };

      const handleSendDealMessage = (e) => {
        e.preventDefault();
        if (!chatInput.trim() || !selectedTaskForChat) return;

        const newMsg = {
          id: Date.now(),
          sender: user ? user.name : 'Вы',
          text: chatInput,
          isMe: true
        };

        setDealMessages(prev => ({
          ...prev,
          [selectedTaskForChat.id]: [...(prev[selectedTaskForChat.id] || []), newMsg]
        }));
        setChatInput('');
      };

      // Логика сдачи работы исполнителем
      const handleSubmitWork = () => {
        if (!selectedTaskForChat) return;
        const updated = tasks.map(t => t.id === selectedTaskForChat.id ? { ...t, status: 'review' } : t);
        setTasks(updated);
        setSelectedTaskForChat({ ...selectedTaskForChat, status: 'review' });

        const sysMsg = {
          id: Date.now(),
          sender: 'Система',
          text: '📤 Исполнитель отправил работу на проверку. Заказчик, проверьте результат и нажмите «Принять работу».',
          isMe: false
        };
        setDealMessages(prev => ({
          ...prev,
          [selectedTaskForChat.id]: [...(prev[selectedTaskForChat.id] || []), sysMsg]
        }));
      };

      // Логика закрытия сделки и релиза Escrow заказчиком (с комиссией платформы 10%)
      const handleApproveWork = () => {
        if (!selectedTaskForChat) return;
        const updated = tasks.map(t => t.id === selectedTaskForChat.id ? { ...t, status: 'completed' } : t);
        setTasks(updated);
        setSelectedTaskForChat({ ...selectedTaskForChat, status: 'completed' });

        const netPayout = Math.round(selectedTaskForChat.budget * 0.9);
        const commission = selectedTaskForChat.budget - netPayout;

        // Если текущий юзер был исполнителем, баланс увеличивается
        if (user && selectedTaskForChat.executor_id === user.id) {
          setBalance(prev => prev + netPayout);
        }

        const sysMsg = {
          id: Date.now(),
          sender: 'Система Escrow',
          text: `🎉 Сделка завершена! ${netPayout} AWS переведены исполнителю (комиссия биржи 10%: ${commission} AWS). Спасибо за работу!`,
          isMe: false
        };
        setDealMessages(prev => ({
          ...prev,
          [selectedTaskForChat.id]: [...(prev[selectedTaskForChat.id] || []), sysMsg]
        }));
      };

      const handleConfirmDeposit = () => {
        const added = Number(depositAmount);
        if (added > 0) {
          setBalance(prev => prev + added);
          setDepositSuccess(true);
          setTimeout(() => {
            setDepositSuccess(false);
            setWalletModalOpen(false);
          }, 1500);
        }
      };

      const handleWithdraw = (e) => {
        e.preventDefault();
        const amt = Number(withdrawAmount);
        if (amt > 0 && amt <= balance) {
          setBalance(prev => prev - amt);
          alert(`Заявка на вывод ${amt} AWS на кошелек ${withdrawAddress} отправлена в обработку!`);
          setWithdrawAmount('');
          setWithdrawAddress('');
          setWalletModalOpen(false);
        } else {
          alert('Недостаточно средств на балансе!');
        }
      };

      const displayedTasks = selectedCat === 'All' 
        ? tasks 
        : tasks.filter(t => t.category === selectedCat);

      const myClientTasks = tasks.filter(t => user && t.author_id === user.id);
      const myFreelancerTasks = tasks.filter(t => user && t.executor_id === user.id);
      const favoriteTasks = tasks.filter(t => favorites.includes(t.id));

      return (
        <div className="min-h-screen flex flex-col w-full max-w-full overflow-x-hidden">
          {/* Хедер */}
          <header className="sticky top-0 z-40 bg-[#07090E]/95 backdrop-blur-md border-b border-cyan-500/20 px-3 sm:px-8 py-3">
            <div className="max-w-6xl mx-auto flex items-center justify-between gap-2">
              <div className="flex items-center gap-2 sm:gap-3 cursor-pointer min-w-0" onClick={() => setTab('feed')}>
                <div className="h-9 w-9 sm:h-10 sm:w-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-fuchsia-500 p-[1px] flex-shrink-0">
                  <div className="w-full h-full bg-[#0B0F19] rounded-[11px] flex items-center justify-center text-cyan-400">
                    <i className="fa-solid fa-robot text-base sm:text-lg"></i>
                  </div>
                </div>
                <span className="font-extrabold text-sm sm:text-xl tracking-wide bg-gradient-to-r from-cyan-400 via-teal-300 to-fuchsia-400 bg-clip-text text-transparent truncate block">
                  AI WORKERS SPACE
                </span>
              </div>

              <div className="flex items-center gap-2 sm:gap-3 flex-shrink-0">
                <button
                  onClick={() => setWalletModalOpen(true)}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-900 border border-amber-500/40 text-xs font-mono hover:bg-slate-800 transition-colors"
                >
                  <i className="fa-solid fa-coins text-amber-400 animate-pulse"></i>
                  <span className="text-cyan-300 font-bold">{balance.toLocaleString()} AWS</span>
                  <i className="fa-solid fa-plus text-[10px] text-emerald-400 ml-0.5"></i>
                </button>

                <button
                  onClick={() => setRole(role === 'freelancer' ? 'client' : 'freelancer')}
                  className="hidden sm:flex px-2.5 sm:px-3 py-1.5 rounded-xl border border-cyan-500/40 text-cyan-300 text-[11px] sm:text-xs font-semibold bg-cyan-500/10 items-center gap-1.5"
                >
                  <i className={role === 'client' ? "fa-solid fa-briefcase" : "fa-solid fa-user-check"}></i>
                  <span>{role === 'client' ? 'Заказчик' : 'Исполнитель'}</span>
                </button>

                {user ? (
                  <div className="flex items-center gap-1.5">
                    <button 
                      onClick={() => setTab('cabinet')}
                      className={`px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 border transition-all ${
                        tab === 'cabinet' ? 'bg-cyan-500 text-black border-cyan-400' : 'bg-slate-900 border-slate-800 text-cyan-300'
                      }`}
                    >
                      <i className="fa-solid fa-id-badge"></i>
                      <span className="hidden sm:inline">{user.name}</span>
                    </button>
                    <button 
                      onClick={handleLogout}
                      title="Выйти"
                      className="px-2.5 sm:px-3 py-1.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-semibold hover:bg-red-500/20"
                    >
                      <i className="fa-solid fa-right-from-bracket"></i>
                    </button>
                  </div>
                ) : (
                  <button 
                    onClick={() => { setAuthMode('login'); setAuthModalOpen(true); }}
                    className="px-3 sm:px-4 py-1.5 rounded-xl bg-cyan-500 text-black text-xs font-bold hover:bg-cyan-400 flex items-center gap-1.5"
                  >
                    <i className="fa-solid fa-user-lock"></i>
                    <span>Вход</span>
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* Контент */}
          <main className="flex-1 max-w-6xl w-full mx-auto px-3 sm:px-8 py-4 sm:py-6 grid grid-cols-1 lg:grid-cols-12 gap-5">
            {/* Меню слева */}
            <aside className="lg:col-span-3 flex lg:flex-col gap-2 overflow-x-auto no-scrollbar pb-1 lg:pb-0">
              <button
                onClick={() => setTab('feed')}
                className={`flex-shrink-0 lg:flex-none flex items-center gap-2.5 px-3.5 py-2.5 sm:py-3 rounded-xl border font-medium text-xs sm:text-sm transition-all ${
                  tab === 'feed' ? 'bg-cyan-500/20 border-cyan-500 text-cyan-300' : 'bg-slate-900/60 border-slate-800 text-slate-400'
                }`}
              >
                <i className="fa-solid fa-wand-magic-sparkles text-cyan-400"></i>
                <span className="whitespace-nowrap">Лента заказов</span>
              </button>

              <button
                onClick={() => {
                  if (!user) setAuthModalOpen(true);
                  else setTab('cabinet');
                }}
                className={`flex-shrink-0 lg:flex-none flex items-center gap-2.5 px-3.5 py-2.5 sm:py-3 rounded-xl border font-medium text-xs sm:text-sm transition-all ${
                  tab === 'cabinet' ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300' : 'bg-slate-900/60 border-slate-800 text-slate-400'
                }`}
              >
                <i className="fa-solid fa-user-gear text-emerald-400"></i>
                <span className="whitespace-nowrap">Личный кабинет</span>
              </button>

              <button
                onClick={() => {
                  if (!user) setAuthModalOpen(true);
                  else setTab('create');
                }}
                className={`flex-shrink-0 lg:flex-none flex items-center gap-2.5 px-3.5 py-2.5 sm:py-3 rounded-xl border font-medium text-xs sm:text-sm transition-all ${
                  tab === 'create' ? 'bg-fuchsia-500/20 border-fuchsia-500 text-fuchsia-300' : 'bg-slate-900/60 border-slate-800 text-slate-400'
                }`}
              >
                <i className="fa-solid fa-circle-plus text-fuchsia-400"></i>
                <span className="whitespace-nowrap">Разместить таск</span>
              </button>

              <button
                onClick={() => setTab('creators')}
                className={`flex-shrink-0 lg:flex-none flex items-center gap-2.5 px-3.5 py-2.5 sm:py-3 rounded-xl border font-medium text-xs sm:text-sm transition-all ${
                  tab === 'creators' ? 'bg-teal-500/20 border-teal-500 text-teal-300' : 'bg-slate-900/60 border-slate-800 text-slate-400'
                }`}
              >
                <i className="fa-solid fa-users text-teal-400"></i>
                <span className="whitespace-nowrap">Топ Креаторов</span>
              </button>
            </aside>

            {/* Основная панель */}
            <section className="lg:col-span-9 space-y-4 min-w-0">
              {/* ЛЕНТА */}
              {tab === 'feed' && (
                <>
                  {/* Главный презентационный баннер */}
                  <div className="relative overflow-hidden rounded-2xl bg-gradient-to-r from-[#0E1726] via-[#111C35] to-[#0A101D] border border-cyan-500/30 p-5 sm:p-7 shadow-xl">
                    <div className="relative z-10 max-w-xl space-y-2">
                      <span className="text-[11px] font-mono uppercase px-2.5 py-1 rounded-full bg-cyan-500/10 text-cyan-300 border border-cyan-500/30 font-semibold tracking-wider">
                        ✨ Новое поколение фриланса
                      </span>
                      <h1 className="text-xl sm:text-3xl font-extrabold tracking-tight text-white leading-tight">
                        Нанимайте лучших <span className="bg-gradient-to-r from-cyan-400 via-teal-300 to-fuchsia-400 bg-clip-text text-transparent">AI-креаторов</span>
                      </h1>
                      <p className="text-xs sm:text-sm text-slate-300">
                        От кинематографичных видео и сложной архитектуры до автоматизации бизнеса и создания музыки. Безопасные сделки с Escrow-гарантом.
                      </p>
                    </div>
                  </div>

                  {/* Направления и Категории */}
                  <div className="flex items-center gap-2 overflow-x-auto no-scrollbar bg-slate-900/60 p-2 rounded-2xl border border-slate-800">
                    {CATEGORIES.map((cat) => (
                      <button

                        value={depositAmount}
                        onChange={(e) => setDepositAmount(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm font-mono text-cyan-300 outline-none"
                      />
                      <span className="text-[10px] text-slate-500 mt-1 block font-mono">Курс: 1 USDT = 1 AWS (Комиссия 0%)</span>
                    </div>

                    <div className="p-3.5 bg-slate-950 rounded-xl border border-cyan-500/20 text-center space-y-2">
                      <div className="text-[11px] text-slate-400">Адрес для оплаты (BlockBee):</div>
                      <div className="bg-slate-900 p-2 rounded-lg text-xs font-mono text-cyan-400 select-all break-all border border-slate-800">
                        {selectedCrypto === 'usdt_trc20' ? 'TQ9zW3JqM2xP8A4yZ1K7vL6uN5mR4sV8wB' : 'EQD2_k4pZ6qL9vW3jM8aX7yN1uR5sV4mK2'}
                      </div>
                      <div className="text-[10px] text-emerald-400 font-mono">
                        ● Ожидание транзакции в сети {selectedCrypto.toUpperCase()}...
                      </div>
                    </div>

                    <button
                      onClick={handleConfirmDeposit}
                      disabled={depositSuccess}
                      className="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-teal-400 text-black font-bold text-sm hover:opacity-90"
                    >
                      {depositSuccess ? '✓ Оплата успешно подтверждена!' : `Я оплатил ${depositAmount} USDT`}
                    </button>
                  </div>
                )}

                {walletTab === 'withdraw' && (
                  <form onSubmit={handleWithdraw} className="space-y-4">
                    <div>
                      <div className="flex justify-between text-xs text-slate-400 mb-1">
                        <span>Доступно к выводу:</span>
                        <span className="text-cyan-300 font-mono font-bold">{balance.toLocaleString()} AWS</span>
                      </div>
                      <input
                        type="number"
                        required
                        placeholder="Сумма вывода (AWS)"
                        value={withdrawAmount}
                        onChange={(e) => setWithdrawAmount(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm font-mono text-slate-200 outline-none"
                      />
                    </div>

                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Ваш кошелек (USDT TRC-20 / TON):</label>
                      <input
                        type="text"
                        required
                        placeholder="Вставьте адрес кошелька..."
                        value={withdrawAddress}
                        onChange={(e) => setWithdrawAddress(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs font-mono text-slate-200 outline-none"
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3 rounded-xl bg-amber-500 text-black font-bold text-sm hover:bg-amber-400"
                    >
                      Запросить вывод
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* МОДАЛЬНОЕ ОКНО АВТОРИЗАЦИИ */}
          {authModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0D121F] border border-cyan-500/40 rounded-2xl p-5 sm:p-7 max-w-sm w-full relative">
                <button 
                  onClick={() => setAuthModalOpen(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white"
                >
                  <i className="fa-solid fa-xmark text-lg"></i>
                </button>

                {authMode === 'login' && (
                  <>
                    <h3 className="text-lg font-bold text-slate-100 mb-1">Вход в аккаунт</h3>
                    <p className="text-xs text-slate-400 mb-4">Доступ к личным заказам и сделкам</p>
                    {authError && <div className="p-2.5 mb-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs">{authError}</div>}
                    <form onSubmit={handleLogin} className="space-y-3">
                      <input
                        type="email"
                        required
                        placeholder="Ваш Email"
                        value={authEmail}
                        onChange={(e) => setAuthEmail(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:border-cyan-500 outline-none"
                      />
                      <input
                        type="password"
                        required
                        placeholder="Пароль"
                        value={authPassword}
                        onChange={(e) => setAuthPassword(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:border-cyan-500 outline-none"
                      />
                      <button type="submit" className="w-full py-3 rounded-xl bg-cyan-500 text-black font-bold text-sm hover:bg-cyan-400">
                        Войти
                      </button>
                    </form>
                    <div className="mt-3 text-center text-xs text-slate-400">
                      Впервые на платформе?{' '}
                      <button onClick={() => { setAuthMode('register'); setAuthError(''); }} className="text-cyan-400 font-semibold hover:underline">
                        Зарегистрироваться
                      </button>
                    </div>
                  </>
                )}

                {authMode === 'register' && (
                  <>
                    <h3 className="text-lg font-bold text-slate-100 mb-1">Регистрация</h3>
                    <p className="text-xs text-slate-400 mb-4">На ваш Email будет отправлен код подтверждения</p>
                    {authError && <div className="p-2.5 mb-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs">{authError}</div>}
                    <form onSubmit={handleStartRegister} className="space-y-3">
                      <input
                        type="email"
                        required
                        placeholder="Ваш Email"
                        value={authEmail}
                        onChange={(e) => setAuthEmail(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:border-cyan-500 outline-none"
                      />
                      <input
                        type="password"
                        required
                        placeholder="Придумайте пароль (от 6 символов)"
                        value={authPassword}
                        onChange={(e) => setAuthPassword(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:border-cyan-500 outline-none"
                      />
                      <button type="submit" className="w-full py-3 rounded-xl bg-cyan-500 text-black font-bold text-sm hover:bg-cyan-400">
                        Получить код на Email
                      </button>
                    </form>
                    <div className="mt-3 text-center text-xs text-slate-400">
                      Уже есть аккаунт?{' '}
                      <button onClick={() => { setAuthMode('login'); setAuthError(''); }} className="text-cyan-400 font-semibold hover:underline">
                        Войти
                      </button>
                    </div>
                  </>
                )}

                {authMode === 'verify_email' && (
                  <>
                    <h3 className="text-lg font-bold text-slate-100 mb-1">Подтверждение Email</h3>
                    <p className="text-xs text-slate-400 mb-2">Введите код, отправленный на <b>{authEmail}</b></p>
                    <div className="p-2.5 mb-3 rounded-xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 text-xs font-mono">
                      Тестовый код верификации: <b>{generatedOtp}</b>
                    </div>
                    {authError && <div className="p-2.5 mb-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs">{authError}</div>}
                    <form onSubmit={handleVerifyEmail} className="space-y-3">
                      <input
                        type="text"
                        required
                        maxLength="6"
                        placeholder="6-значный код"
                        value={verificationCode}
                        onChange={(e) => setVerificationCode(e.target.value)}
                        className="w-full bg-slate-950 border border-cyan-500 text-center text-lg font-mono tracking-widest rounded-xl px-3.5 py-2.5 text-cyan-300 outline-none"
                      />
                      <button type="submit" className="w-full py-3 rounded-xl bg-emerald-500 text-black font-bold text-sm hover:bg-emerald-400">
                        Подтвердить и войти
                      </button>
                    </form>
                  </>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

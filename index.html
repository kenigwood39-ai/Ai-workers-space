<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI WORKERS SPACE — Биржа ИИ-специалистов</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #07090E; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-[#07090E] min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { createClient } = supabase;

    const SUPABASE_URL = 'https://kxesopofbqwrnzohnbqs.supabase.co';
    const SUPABASE_ANON_KEY = 'Sb_publishable_yOkm8byVqjmQZHvvVKIE6Q_Zx324mjy';
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const INITIAL_TASKS = [
      {
        id: 101,
        title: 'Генерация реалистичного фуд-арта для ресторанного меню',
        prompt: 'Hyper-realistic gourmet burger photoshoot, cinematic warm lighting, 8k resolution --ar 16:9 --v 6.0',
        tool: 'Midjourney v6',
        budget: 450,
        currency: 'AWS',
        author: 'RestoGroup',
        preview: 'https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 102,
        title: 'Анимация персонажа для трейлера инди-игры',
        prompt: 'Cyberpunk nomad warrior standing in neon rain, cinematic camera rotation --motion 5',
        tool: 'Runway Gen-3',
        budget: 800,
        currency: 'AWS',
        author: 'CyberIndie Studio',
        preview: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 103,
        title: 'Разработка серии персонажей для мобильной игры',
        prompt: 'Stylized 3D cartoon characters, isometric view, vibrant colors, Octane render --v 6.0',
        tool: 'FLUX.1',
        budget: 620,
        currency: 'AWS',
        author: 'PlayApex Games',
        preview: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80'
      }
    ];

    const CREATORS = [
      {
        id: 1,
        name: 'Алексей "PromptMaster"',
        rating: '4.98',
        deals: 64,
        skills: ['Midjourney', 'FLUX.1', 'ComfyUI'],
        avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80'
      },
      {
        id: 2,
        name: 'Elena Synthetica',
        rating: '5.00',
        deals: 92,
        skills: ['Runway Gen-3', 'Luma Dream', 'ElevenLabs'],
        avatar: 'https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=200&q=80'
      }
    ];

    function App() {
      const [tab, setTab] = useState('feed');
      const [role, setRole] = useState('freelancer');
      const [tasks, setTasks] = useState(INITIAL_TASKS);
      const [loading, setLoading] = useState(false);
      const [filter, setFilter] = useState('All');

      const [newTitle, setNewTitle] = useState('');
      const [newPrompt, setNewPrompt] = useState('');
      const [newBudget, setNewBudget] = useState('');
      const [newTool, setNewTool] = useState('Midjourney v6');

      const [messages, setMessages] = useState([
        { id: 1, sender: 'Алексей "PromptMaster"', text: 'Здравствуйте! Готов приступить к выполнению вашего ТЗ.', isMe: false }
      ]);
      const [chatInput, setChatInput] = useState('');

      const fetchTasks = async () => {
        setLoading(true);
        try {
          const { data, error } = await db.from('tasks').select('*').order('created_at', { ascending: false });
          if (!error && data && data.length > 0) {
            setTasks(data);
          }
        } catch(e) {
          console.log(e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchTasks();
      }, []);

      const handleCreateTask = async (e) => {
        e.preventDefault();
        if (!newTitle || !newBudget) return;

        const taskObj = {
          id: Date.now(),
          title: newTitle,
          prompt: newPrompt || 'Техническое задание будет предоставлено в чате',
          tool: newTool,
          budget: Number(newBudget),
          currency: 'AWS',
          author: 'Вы (Заказчик)',
          preview: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80'
        };

        try {
          await db.from('tasks').insert([taskObj]);
        } catch(err) {
          console.log(err);
        }

        setTasks([taskObj, ...tasks]);
        setNewTitle('');
        setNewPrompt('');
        setNewBudget('');
        setTab('feed');
      };

      const handleSendMessage = async (e) => {
        e.preventDefault();
        if (!chatInput.trim()) return;

        const msgObj = { id: Date.now(), sender: 'Вы', text: chatInput, isMe: true };
        setMessages([...messages, msgObj]);
        setChatInput('');

        try {
          await db.from('messages').insert([msgObj]);
        } catch(err) {
          console.log(err);
        }
      };

      const displayedTasks = filter === 'All' 
        ? tasks 
        : tasks.filter(t => (t.tool || '').toLowerCase().includes(filter.toLowerCase()));

      return (
        <div className="min-h-screen flex flex-col">
          {/* Хедер */}
          <header className="sticky top-0 z-50 bg-[#07090E]/90 backdrop-blur-md border-b border-cyan-500/20 px-4 py-3 sm:px-8">
            <div className="max-w-6xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setTab('feed')}>
                <div className="h-10 w-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-fuchsia-500 p-[1px]">
                  <div className="w-full h-full bg-[#0B0F19] rounded-[11px] flex items-center justify-center text-cyan-400">
                    <i className="fa-solid fa-robot text-lg"></i>
                  </div>
                </div>
                <div>
                  <span className="font-extrabold text-lg sm:text-xl tracking-wider bg-gradient-to-r from-cyan-400 via-teal-300 to-fuchsia-400 bg-clip-text text-transparent block">
                    AI WORKERS SPACE
                  </span>
                  <span className="text-[10px] text-emerald-400 font-mono flex items-center gap-1">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    SUPABASE LIVE DB
                  </span>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <div className="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900 border border-cyan-500/30 text-xs font-mono">
                  <i className="fa-solid fa-coins text-amber-400"></i>
                  <span className="text-slate-400">Баланс:</span>
                  <span className="text-cyan-300 font-bold">1,450 AWS</span>
                </div>

                <button
                  onClick={() => setRole(role === 'freelancer' ? 'client' : 'freelancer')}
                  className="px-3 py-1.5 rounded-xl border border-cyan-500/40 text-cyan-300 text-xs font-semibold bg-cyan-500/10 flex items-center gap-1.5"
                >
                  <i className={role === 'client' ? "fa-solid fa-briefcase" : "fa-solid fa-user-check"}></i>
                  <span>{role === 'client' ? 'Заказчик' : 'Исполнитель'}</span>
                </button>
              </div>
            </div>
          </header>

          {/* Контент */}
          <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-6 sm:px-8 grid grid-cols-1 lg:grid-cols-12 gap-6">
            {/* Меню слева */}
            <aside className="lg:col-span-3 flex lg:flex-col gap-2 overflow-x-auto pb-2 lg:pb-0">
              <button
                onClick={() => setTab('feed')}
                className={`flex-1 lg:flex-none flex items-center gap-3 px-4 py-3 rounded-xl border font-medium text-sm transition-all ${
                  tab === 'feed' ? 'bg-cyan-500/20 border-cyan-500 text-cyan-300' : 'bg-slate-900/60 border-slate-800 text-slate-400'
                }`}
              >
                <i className="fa-solid fa-wand-magic-sparkles text-cyan-400"></i>
                <span>Лента заказов</span>
                <span className="ml-auto text-xs bg-cyan-950 px-2 py-0.5 rounded-full text-cyan-300 font-mono hidden lg:inline">{tasks.length}</span>
              </button>

              <button
                onClick={() => setTab('create')}
                className={`flex-1 lg:flex-none flex items-center gap-3 px-4 py-3 rounded-xl border font-medium text-sm transition-all ${
                  tab === 'create' ? 'bg-fuchsia-500/20 border-fuchsia-500 text-fuchsia-300' : 'bg-slate-900/60 border-slate-800 text-slate-400'
                }`}
              >
                <i className="fa-solid fa-circle-plus text-fuchsia-400"></i>
                <span>Разместить таск</span>
              </button>

              <button
                onClick={() => setTab('creators')}
                className={`flex-1 lg:flex-none flex items-center gap-3 px-4 py-3 rounded-xl border font-medium text-sm transition-all ${
                  tab === 'creators' ? 'bg-teal-500/20 border-teal-500 text-teal-300' : 'bg-slate-900/60 border-slate-800 text-slate-400'
                }`}
              >
                <i className="fa-solid fa-users text-teal-400"></i>
                <span>Топ Креаторов</span>
              </button>

              <button
                onClick={() => setTab('chat')}
                className={`flex-1 lg:flex-none flex items-center gap-3 px-4 py-3 rounded-xl border font-medium text-sm transition-all ${
                  tab === 'chat' ? 'bg-cyan-500/20 border-cyan-500 text-cyan-300' : 'bg-slate-900/60 border-slate-800 text-slate-400'
                }`}
              >
                <i className="fa-solid fa-comments text-cyan-400"></i>
                <span>Сделки и Чат</span>
              </button>
            </aside>

            {/* Основная панель */}
            <section className="lg:col-span-9 space-y-5">
              {tab === 'feed' && (
                <>
                  <div className="flex flex-wrap items-center justify-between gap-3 bg-slate-900/60 p-3 rounded-2xl border border-slate-800">
                    <div className="flex items-center gap-2 overflow-x-auto py-1">
                      {['All', 'Midjourney', 'FLUX', 'Runway'].map((item) => (
                        <button
                          key={item}
                          onClick={() => setFilter(item)}
                          className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${
                            filter === item ? 'bg-cyan-500 text-black' : 'bg-slate-800 text-slate-400'
                          }`}
                        >
                          {item}
                        </button>
                      ))}
                    </div>
                    <button onClick={fetchTasks} className="text-xs text-cyan-400 flex items-center gap-1.5 font-mono">
                      <i className={`fa-solid fa-rotate-right ${loading ? 'animate-spin' : ''}`}></i>
                      <span>Обновить</span>
                    </button>
                  </div>

                  <div className="grid grid-cols-1 gap-4">
                    {displayedTasks.map((t) => (
                      <div key={t.id} className="bg-[#0D121F] p-5 rounded-2xl border border-slate-800 hover:border-cyan-500/50 flex flex-col md:flex-row gap-5 items-start md:items-center transition-all">
                        <div className="w-full md:w-32 h-32 rounded-xl overflow-hidden border border-cyan-500/20 bg-slate-950 flex-shrink-0">
                          <img src={t.preview || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80'} className="w-full h-full object-cover" />
                        </div>
                        <div className="flex-1 space-y-2 min-w-0">
                          <div className="flex items-center gap-2">
                            <span className="text-[10px] bg-cyan-950 text-cyan-400 border border-cyan-800/40 px-2 py-0.5 rounded font-mono font-bold">{t.tool || 'AI'}</span>
                            <h3 className="font-bold text-base text-slate-100 truncate">{t.title}</h3>
                          </div>
                          <p className="text-xs text-slate-400 line-clamp-2 font-mono bg-slate-950/70 p-2.5 rounded-lg border border-slate-800/60">
                            <span className="text-cyan-400">Prompt: </span>{t.prompt}
                          </p>
                          <div className="flex items-center gap-3 text-xs text-slate-400">
                            <span>{t.author || 'Заказчик'}</span>
                            <span>•</span>
                            <span className="text-emerald-400 font-mono">ID #{t.id}</span>
                          </div>
                        </div>
                        <div className="w-full md:w-auto flex md:flex-col items-center md:items-end justify-between gap-3">
                          <div className="font-mono text-lg font-extrabold text-cyan-400">{t.budget} {t.currency || 'AWS'}</div>
                          <button onClick={() => setTab('chat')} className="px-5 py-2 rounded-xl bg-cyan-500 text-black font-bold text-xs hover:bg-cyan-400">
                            Взять заказ
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </>
              )}

              {tab === 'create' && (
                <div className="bg-[#0D121F] p-6 sm:p-8 rounded-2xl border border-cyan-500/30">
                  <h2 className="text-xl font-bold text-cyan-400 mb-1">Создать задание (Live DB)</h2>
                  <p className="text-xs text-slate-400 mb-6">Задача мгновенно сохранится в базу данных Supabase и отобразится в ленте.</p>
                  <form onSubmit={handleCreateTask} className="space-y-4">
                    <input
                      type="text"
                      required
                      placeholder="Название проекта (например: Генерация постера для игры)"
                      value={newTitle}
                      onChange={(e) => setNewTitle(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:border-cyan-500 outline-none"
                    />
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <select
                        value={newTool}
                        onChange={(e) => setNewTool(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm outline-none text-slate-200"
                      >
                        <option value="Midjourney v6">Midjourney v6</option>
                        <option value="FLUX.1">FLUX.1</option>
                        <option value="Runway Gen-3">Runway Gen-3</option>
                        <option value="ComfyUI">ComfyUI</option>
                      </select>
                      <input
                        type="number"
                        required
                        placeholder="Бюджет (AWS)"
                        value={newBudget}
                        onChange={(e) => setNewBudget(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm outline-none"
                      />
                    </div>
                    <textarea
                      rows="4"
                      placeholder="Вставьте промпт или требования к стилю..."
                      value={newPrompt}
                      onChange={(e) => setNewPrompt(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm outline-none"
                    ></textarea>
                    <button
                      type="submit"
                      className="w-full py-3.5 rounded-xl bg-gradient-to-r from-fuchsia-500 to-cyan-500 text-white font-bold text-sm hover:opacity-90 transition-opacity"
                    >
                      Опубликовать заказ
                    </button>
                  </form>
                </div>
              )}

              {tab === 'chat' && (
                <div className="bg-[#0D121F] rounded-2xl border border-cyan-500/30 overflow-hidden flex flex-col h-[520px]">
                  <div className="bg-slate-950 px-5 py-3.5 border-b border-slate-800 flex justify-between items-center">
                    <span className="text-sm font-bold text-slate-200">Алексей "PromptMaster"</span>
                    <span className="text-xs text-teal-400 font-mono">Escrow Холд: 250 AWS</span>
                  </div>
                  <div className="flex-1 p-4 overflow-y-auto space-y-3">
                    {messages.map((m) => (
                      <div key={m.id} className={`flex flex-col ${m.isMe ? 'items-end' : 'items-start'}`}>
                        <div className={`max-w-[80%] rounded-xl px-4 py-2.5 text-sm ${m.isMe ? 'bg-cyan-600 text-white' : 'bg-slate-900 border border-slate-800 text-slate-200'}`}>
                          <p>{m.text}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                  <form onSubmit={handleSendMessage} className="p-3 bg-slate-950 border-t border-slate-800 flex gap-2">
                    <input
                      type="text"
                      placeholder="Напишите сообщение исполнителям..."
                      value={chatInput}
                      onChange={(e) => setChatInput(e.target.value)}
                      className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm outline-none"
                    />
                    <button type="submit" className="p-2.5 px-4 bg-cyan-500 text-black rounded-xl hover:bg-cyan-400">
                      <i className="fa-solid fa-paper-plane"></i>
                    </button>
                  </form>
                </div>
              )}

              {tab === 'creators' && (
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {CREATORS.map((c) => (
                    <div key={c.id} className="bg-[#0D121F] p-5 rounded-2xl border border-slate-800 space-y-4">
                      <div className="flex items-center gap-4">
                        <img src={c.avatar} className="w-12 h-12 rounded-xl object-cover" />
                        <div>
                          <h3 className="font-bold text-sm text-slate-100">{c.name}</h3>
                          <span className="text-xs text-slate-400 font-mono">{c.deals} сделок • ★ {c.rating}</span>
                        </div>
                      </div>
                      <div className="flex flex-wrap gap-1.5">
                        {c.skills.map(s => <span key={s} className="text-[10px] bg-slate-900 px-2.5 py-1 rounded-md text-cyan-300 border border-slate-800 font-mono">{s}</span>)}
                      </div>
                      <button onClick={() => setTab('chat')} className="w-full py-2 bg-slate-900 text-teal-300 border border-teal-500/30 rounded-xl text-xs font-semibold hover:bg-slate-800">
                        Написать
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </section>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

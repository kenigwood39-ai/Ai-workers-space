<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>AI WORKERS SPACE — Hire Top AI Creators</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html {
      scroll-behavior: smooth;
      background-color: #07090E;
    }
    body { 
      background-color: #07090E; 
      color: #f1f5f9; 
      font-family: system-ui, -apple-system, sans-serif; 
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      min-height: 100vh;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Стили неоновых рамок аватаров */
    .frame-none { border: 2px solid transparent; }
    .frame-cyan { border: 2px solid #06b6d4; box-shadow: 0 0 10px rgba(6, 182, 212, 0.7); }
    .frame-fuchsia { border: 2px solid #d946ef; box-shadow: 0 0 12px rgba(217, 70, 239, 0.8); }
    .frame-emerald { border: 2px solid #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.8); }
    .frame-amber { border: 2px solid #f59e0b; box-shadow: 0 0 18px rgba(245, 158, 11, 0.9); }
    .frame-rainbow { border: 2px solid #ec4899; box-shadow: 0 0 22px rgba(236, 72, 153, 1); animation: pulse 2s infinite; }

    /* Стили рамок карточек объявлений */
    .card-frame-default { border: 1px solid rgba(51, 65, 85, 0.8); }
    .card-frame-neon { border: 1.5px solid #06b6d4; box-shadow: 0 0 15px rgba(6, 182, 212, 0.25); }
    .card-frame-cyber { border: 1.5px solid #d946ef; box-shadow: 0 0 18px rgba(217, 70, 239, 0.3); }
    .card-frame-gold { border: 1.5px solid #f59e0b; box-shadow: 0 0 20px rgba(245, 158, 11, 0.35); }
    .card-frame-fire { border: 1.5px solid #ef4444; box-shadow: 0 0 25px rgba(239, 68, 68, 0.4); }
  </style>
</head>
<body class="bg-[#07090E] min-h-screen text-slate-100 selection:bg-cyan-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TELEGRAM_LINK = "https://t.me/aiworkersspace";

    const calculateResponseFee = (budget) => {
      const b = Number(budget) || 0;
      if (b <= 2000) return 100;
      if (b <= 5000) return Math.max(100, Math.round(b * 0.05));
      const fee = 250 + ((b - 5000) / (100000 - 5000)) * (1200 - 250);
      return Math.round(fee);
    };

    const CRYPTO_RATES = {
      usdt: { rate: 1.0, symbol: 'USDT', net: 'TRC-20' },
      ton: { rate: 0.18, symbol: 'TON', net: 'The Open Network' },
      trx: { rate: 6.8, symbol: 'TRX', net: 'TRON' },
      btc: { rate: 0.000016, symbol: 'BTC', net: 'Bitcoin' },
      rub: { rate: 92.5, symbol: 'RUB', net: 'Банковская карта' }
    };

    // Модные минималистичные аватары
    const MINIMAL_AVATARS = [
      { id: 'min_free_1', url: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=300&q=80', name: 'Dark Sphere', price: 0 },
      { id: 'min_free_2', url: 'https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?auto=format&fit=crop&w=300&q=80', name: 'Minimal Glow', price: 0 },
      { id: 'min_500', url: 'https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?auto=format&fit=crop&w=300&q=80', name: 'Glass Wave', price: 500 },
      { id: 'min_1000', url: 'https://images.unsplash.com/photo-1633167606207-d840b5070fc2?auto=format&fit=crop&w=300&q=80', name: 'Obsidian Cube', price: 1000 },
      { id: 'min_2000', url: 'https://images.unsplash.com/photo-1614680376593-902f749f7ffc?auto=format&fit=crop&w=300&q=80', name: 'Cyber Minimal', price: 2000 },
      { id: 'min_3000', url: 'https://images.unsplash.com/photo-1618005198919-d3d4b5a92ead?auto=format&fit=crop&w=300&q=80', name: 'Liquid Chrome', price: 3000 },
      { id: 'min_5000', url: 'https://images.unsplash.com/photo-1634926878768-2a5b3c42f139?auto=format&fit=crop&w=300&q=80', name: 'Matte VIP Gold', price: 5000 }
    ];

    // Рамки для аватаров
    const AVATAR_FRAMES = [
      { id: 'frame-none', name: 'Без рамки', class: 'frame-none', price: 0 },
      { id: 'frame-cyan', name: 'Cyan Glow', class: 'frame-cyan', price: 500 },
      { id: 'frame-fuchsia', name: 'Fuchsia Neon', class: 'frame-fuchsia', price: 1000 },
      { id: 'frame-emerald', name: 'Emerald Edge', class: 'frame-emerald', price: 2000 },
      { id: 'frame-amber', name: 'Gold Emperor', class: 'frame-amber', price: 3000 },
      { id: 'frame-rainbow', name: 'Rainbow Mythic', class: 'frame-rainbow', price: 5000 }
    ];

    // Рамки карточек объявлений
    const TASK_CARD_FRAMES = [
      { id: 'card-frame-default', name: 'Стандартная', class: 'card-frame-default', price: 0 },
      { id: 'card-frame-neon', name: 'Неон Cyan', class: 'card-frame-neon', price: 1000 },
      { id: 'card-frame-cyber', name: 'Кибер Fuchsia', class: 'card-frame-cyber', price: 2500 },
      { id: 'card-frame-gold', name: 'Золотой VIP', class: 'card-frame-gold', price: 5000 },
      { id: 'card-frame-fire', name: 'Fire Flame Ultra', class: 'card-frame-fire', price: 10000 }
    ];

    const INITIAL_TASKS = [
      {
        id: 101,
        category: 'video',
        title: 'Мультфильм для Корейского ТВ',
        prompt: 'Надо сделать многосерийный мультфильм по сценарию для корейской киностудии в подобной графике и реализмом.',
        tool: 'ComfyUI',
        budget: 150000,
        response_fee: 1500,
        currency: 'AWS',
        author: 'RestoGroup',
        author_id: 'client_sample_1',
        card_frame: 'card-frame-gold',
        executor_id: null,
        status: 'open',
        hidden: false,
        views: 480,
        mainPhotoIndex: 0,
        photos: [
          'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80',
          'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=800&q=80'
        ]
      },
      {
        id: 102,
        category: 'art',
        title: 'Фотореалистичный фуд-арт сет для мишленовского ресторана',
        prompt: 'Gourmet wagyu truffle burger, dripping cheddar, macro lens, shallow depth of field, dramatic cinematic dark restaurant lighting, 8k resolution --ar 16:9 --v 6.0',
        tool: 'Midjourney v6',
        budget: 35000,
        response_fee: 580,
        currency: 'AWS',
        author: 'RestoGroup Luxury',
        author_id: 'client_sample_2',
        card_frame: 'card-frame-neon',
        executor_id: null,
        status: 'open',
        hidden: false,
        views: 310,
        mainPhotoIndex: 0,
        photos: [
          'https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=800&q=80'
        ]
      },
      {
        id: 103,
        category: 'art',
        title: 'Киберпанк-обложка для виниловой пластинки Synthwave альбома',
        prompt: 'Futuristic Tokyo skyline at night, glowing neon kanji, hovering cyber sports car, rain puddles reflecting violet and cyan light, vintage 80s aesthetic --ar 1:1 --stylize 750',
        tool: 'FLUX.1 Pro',
        budget: 5000,
        response_fee: 250,
        currency: 'AWS',
        author: 'NeonRecords NY',
        author_id: 'client_sample_3',
        card_frame: 'card-frame-default',
        executor_id: null,
        status: 'open',
        hidden: false,
        views: 220,
        mainPhotoIndex: 0,
        photos: [
          'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=800&q=80'
        ]
      }
    ];

    function App() {
      const [tab, setTab] = useState('feed');
      const [role, setRole] = useState('client');
      const [cabinetSubTab, setCabinetSubTab] = useState('my-orders'); // 'my-orders' | 'shop'
      
      const [user, setUser] = useState(() => {
        const savedUser = localStorage.getItem('aws_active_user');
        return savedUser ? JSON.parse(savedUser) : null;
      });

      const [balance, setBalance] = useState(() => {
        const b = localStorage.getItem('aws_balance_v9');
        if (b) return Number(b);
        return user?.email === 'kenigwood39@gmail.com' ? 25000 : 1000;
      });

      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem('aws_tasks_v9');
        return saved ? JSON.parse(saved) : INITIAL_TASKS;
      });

      const [inventory, setInventory] = useState(() => {
        const saved = localStorage.getItem('aws_inventory_v9');
        return saved ? JSON.parse(saved) : {};
      });

      const [paidUnlocks, setPaidUnlocks] = useState(() => {
        const saved = localStorage.getItem('aws_paid_unlocks');
        return saved ? JSON.parse(saved) : {};
      });

      const [selectedCat, setSelectedCat] = useState('All');

      // Модалки
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [verificationCode, setVerificationCode] = useState('');
      const [generatedOtp, setGeneratedOtp] = useState('');
      const [authError, setAuthError] = useState('');

      const [walletModalOpen, setWalletModalOpen] = useState(false);
      const [selectedCurrency, setSelectedCurrency] = useState('usdt');
      const [depositAmountAWS, setDepositAmountAWS] = useState('1000');
      const [depositSuccess, setDepositSuccess] = useState(false);

      // Форма создания
      const [newTitle, setNewTitle] = useState('');
      const [newCategory, setNewCategory] = useState('video');
      const [newPrompt, setNewPrompt] = useState('');
      const [newBudget, setNewBudget] = useState('150000');
      const [newTool, setNewTool] = useState('ComfyUI');
      const [taskPhotos, setTaskPhotos] = useState([]);
      const [mainPhotoIndex, setMainPhotoIndex] = useState(0);

      // Редактирование
      const [editingTask, setEditingTask] = useState(null);

      const [viewingTask, setViewingTask] = useState(null);
      const [currentPhotoSlide, setCurrentPhotoSlide] = useState(0);
      const [selectedTaskForChat, setSelectedTaskForChat] = useState(null);
      const [dealMessages, setDealMessages] = useState({});
      const [chatInput, setChatInput] = useState('');

      useEffect(() => {
        localStorage.setItem('aws_tasks_v9', JSON.stringify(tasks));
      }, [tasks]);

      useEffect(() => {
        localStorage.setItem('aws_inventory_v9', JSON.stringify(inventory));
      }, [inventory]);

      useEffect(() => {
        localStorage.setItem('aws_balance_v9', balance.toString());
      }, [balance]);

      // Загрузка аватарки с устройства
      const handleUploadAvatarFromFile = (e) => {
        const file = e.target.files[0];
        if (!file || !user) return;
        const reader = new FileReader();
        reader.onloadend = () => {
          const updated = { ...user, avatar: reader.result };
          setUser(updated);
          localStorage.setItem('aws_active_user', JSON.stringify(updated));
          alert('✓ Ваша аватарка успешно обновлена!');
        };
        reader.readAsDataURL(file);
      };

      // Покупка и выбор аватара из каталога
      const handleSelectAvatar = (item) => {
        if (!user) { setAuthModalOpen(true); return; }
        const userInv = inventory[user.id] || { avatars: [], frames: [], cardFrames: [] };

        if (item.price === 0 || (userInv.avatars && userInv.avatars.includes(item.id))) {
          const updated = { ...user, avatar: item.url };
          setUser(updated);
          localStorage.setItem('aws_active_user', JSON.stringify(updated));
          alert(`✓ Аватар "${item.name}" установлен!`);
        } else {
          if (balance < item.price) {
            alert(`Недостаточно средств. Стоимость: ${item.price} AWS`);
            setWalletModalOpen(true);
            return;
          }
          setBalance(prev => prev - item.price);
          const newInv = {
            ...inventory,
            [user.id]: {
              ...userInv,
              avatars: [...(userInv.avatars || []), item.id]
            }
          };
          setInventory(newInv);
          const updated = { ...user, avatar: item.url };
          setUser(updated);
          localStorage.setItem('aws_active_user', JSON.stringify(updated));
          alert(`🎉 Аватар "${item.name}" успешно куплен и установлен!`);
        }
      };

      // Покупка и выбор рамки профиля
      const handleSelectAvatarFrame = (frame) => {
        if (!user) { setAuthModalOpen(true); return; }
        const userInv = inventory[user.id] || { avatars: [], frames: [], cardFrames: [] };

        if (frame.price === 0 || (userInv.frames && userInv.frames.includes(frame.id))) {
          const updated = { ...user, avatarFrame: frame.class };
          setUser(updated);
          localStorage.setItem('aws_active_user', JSON.stringify(updated));
          alert(`✓ Рамка "${frame.name}" активна!`);
        } else {
          if (balance < frame.price) {
            alert(`Недостаточно средств. Стоимость: ${frame.price} AWS`);
            setWalletModalOpen(true);
            return;
          }
          setBalance(prev => prev - frame.price);
          const newInv = {
            ...inventory,
            [user.id]: {
              ...userInv,
              frames: [...(userInv.frames || []), frame.id]
            }
          };
          setInventory(newInv);
          const updated = { ...user, avatarFrame: frame.class };
          setUser(updated);
          localStorage.setItem('aws_active_user', JSON.stringify(updated));
          alert(`🎉 Неоновая рамка "${frame.name}" куплена!`);
        }
      };

      // Покупка и выбор рамки объявлений
      const handleSelectCardFrame = (cf) => {
        if (!user) { setAuthModalOpen(true); return; }
        const userInv = inventory[user.id] || { avatars: [], frames: [], cardFrames: [] };

        if (cf.price === 0 || (userInv.cardFrames && userInv.cardFrames.includes(cf.id))) {
          const updated = { ...user, cardFrame: cf.class };
          setUser(updated);
          localStorage.setItem('aws_active_user', JSON.stringify(updated));
          setTasks(tasks.map(t => t.author_id === user.id ? { ...t, card_frame: cf.class } : t));
          alert(`✓ Рамка объявлений "${cf.name}" применена!`);
        } else {
          if (balance < cf.price) {
            alert(`Недостаточно средств. Стоимость: ${cf.price} AWS`);
            setWalletModalOpen(true);
            return;
          }
          setBalance(prev => prev - cf.price);
          const newInv = {
            ...inventory,
            [user.id]: {
              ...userInv,
              cardFrames: [...(userInv.cardFrames || []), cf.id]
            }
          };
          setInventory(newInv);
          const updated = { ...user, cardFrame: cf.class };
          setUser(updated);
          localStorage.setItem('aws_active_user', JSON.stringify(updated));
          setTasks(tasks.map(t => t.author_id === user.id ? { ...t, card_frame: cf.class } : t));
          alert(`🎉 Рамка объявлений "${cf.name}" куплена и применена ко всем вашим таскам!`);
        }
      };

      // Загрузка фото таска
      const handleUploadTaskPhotos = (e) => {
        const files = Array.from(e.target.files);
        if (!files.length) return;
        files.forEach((file) => {
          if (taskPhotos.length >= 5) return;
          const reader = new FileReader();
          reader.onloadend = () => {
            setTaskPhotos(prev => (prev.length >= 5 ? prev : [...prev, reader.result]));
          };
          reader.readAsDataURL(file);
        });
      };

      const handleRemoveTaskPhoto = (index) => {
        const updated = taskPhotos.filter((_, i) => i !== index);
        setTaskPhotos(updated);
        if (mainPhotoIndex >= updated.length) {
          setMainPhotoIndex(Math.max(0, updated.length - 1));
        }
      };

      // Публикация
      const handleCreateTask = (e) => {
        e.preventDefault();
        if (!newTitle.trim()) return;

        const authorName = user ? user.name : 'RestoGroup';
        const authorId = user ? user.id : 'client_demo_1';
        const budgetVal = Number(newBudget) || 150000;

        const finalPhotos = taskPhotos.length > 0 ? taskPhotos : [
          'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80',
          'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=800&q=80'
        ];

        const taskObj = {
          id: Date.now(),
          category: newCategory,
          title: newTitle,
          prompt: newPrompt || 'ТЗ и материалы предоставлены в чате сделки',
          tool: newTool,
          budget: budgetVal,
          response_fee: calculateResponseFee(budgetVal),
          currency: 'AWS',
          author: authorName,
          author_id: authorId,
          card_frame: user?.cardFrame || 'card-frame-gold',
          executor_id: null,
          status: 'open',
          hidden: false,
          views: 1,
          mainPhotoIndex: mainPhotoIndex < finalPhotos.length ? mainPhotoIndex : 0,
          photos: finalPhotos
        };

        setTasks([taskObj, ...tasks]);
        setNewTitle('');
        setNewPrompt('');
        setTaskPhotos([]);
        setMainPhotoIndex(0);
        setTab('feed');
      };

      const handleSaveEditedTask = (e) => {
        e.preventDefault();
        if (!editingTask) return;
        const updatedBudget = Number(editingTask.budget) || 1000;
        const updatedTasks = tasks.map(t => {
          if (t.id === editingTask.id) {
            return {
              ...editingTask,
              budget: updatedBudget,
              response_fee: calculateResponseFee(updatedBudget)
            };
          }
          return t;
        });
        setTasks(updatedTasks);
        setEditingTask(null);
        alert('✓ Изменения сохранены!');
      };

      const handleToggleHideTask = (taskId) => {
        setTasks(tasks.map(t => t.id === taskId ? { ...t, hidden: !t.hidden } : t));
      };

      const handleDeleteTask = (taskId) => {
        if (confirm('Удалить этот таск?')) {
          setTasks(tasks.filter(t => t.id !== taskId));
        }
      };

      const handleChangeTaskFrame = (taskId, frameClass) => {
        setTasks(tasks.map(t => t.id === taskId ? { ...t, card_frame: frameClass } : t));
      };

      // Авторизация
      const handleStartRegister = (e) => {
        e.preventDefault();
        if (authPassword.length < 6) { setAuthError('Минимум 6 символов'); return; }
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        setGeneratedOtp(code);
        setAuthMode('verify_email');
      };

      const handleVerifyEmail = (e) => {
        e.preventDefault();
        if (verificationCode.trim() !== generatedOtp) { setAuthError('Неверный код!'); return; }
        const cleanEmail = authEmail.trim().toLowerCase();
        const isMaster = cleanEmail === 'kenigwood39@gmail.com';

        const newUser = {
          id: 'user_' + btoa(cleanEmail).substring(0, 10),
          email: cleanEmail,
          name: cleanEmail.split('@')[0],
          avatar: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=300&q=80',
          avatarFrame: 'frame-none',
          cardFrame: 'card-frame-default',
          verified: true
        };

        setBalance(isMaster ? 25000 : 1000);
        setUser(newUser);
        localStorage.setItem('aws_active_user', JSON.stringify(newUser));
        setAuthModalOpen(false);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const cleanEmail = authEmail.trim().toLowerCase();
        const isMaster = cleanEmail === 'kenigwood39@gmail.com';

        const loggedUser = {
          id: 'user_' + btoa(cleanEmail).substring(0, 10),
          email: cleanEmail,
          name: cleanEmail.split('@')[0],
          avatar: user?.avatar || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=300&q=80',
          avatarFrame: user?.avatarFrame || 'frame-none',
          cardFrame: user?.cardFrame || 'card-frame-default',
          verified: true
        };

        if (isMaster && balance < 25000) setBalance(25000);
        setUser(loggedUser);
        localStorage.setItem('aws_active_user', JSON.stringify(loggedUser));
        setAuthModalOpen(false);
      };

      const handleLogout = () => {
        setUser(null);
        localStorage.removeItem('aws_active_user');
      };

      const openTaskModal = (task) => {
        setViewingTask(task);
        setCurrentPhotoSlide(task.mainPhotoIndex || 0);
      };

      const openTaskChat = (task) => {
        setViewingTask(null);
        setSelectedTaskForChat(task);
        if (!dealMessages[task.id]) {
          setDealMessages(prev => ({
            ...prev,
            [task.id]: [{ id: 1, sender: task.author, text: `Здравствуйте! Таск #${task.id} открыт. Бюджет: ${task.budget.toLocaleString()} AWS. Жду предложения!`, isMe: false }]
          }));
        }
        setTab('deal_chat');
      };

      const handleSendDealMessage = (e) => {
        e.preventDefault();
        if (!chatInput.trim() || !selectedTaskForChat) return;

        const newMsg = {
          id: Date.now(),
          sender: user ? user.name : 'Вы',
          text: chatInput,
          isMe: true
        };

        setDealMessages(prev => ({
          ...prev,
          [selectedTaskForChat.id]: [...(prev[selectedTaskForChat.id] || []), newMsg]
        }));
        setChatInput('');
      };

      const feedTasks = tasks.filter(t => !t.hidden && (selectedCat === 'All' || t.category === selectedCat));
      const myClientTasks = tasks.filter(t => user && t.author_id === user.id);
      const userInv = user ? (inventory[user.id] || { avatars: [], frames: [], cardFrames: [] }) : { avatars: [], frames: [], cardFrames: [] };

      const formBudgetNum = Number(newBudget) || 0;
      const formEstimatedFee = calculateResponseFee(formBudgetNum);

      return (
        <div className="min-h-screen flex flex-col w-full max-w-full overflow-x-hidden">
          {/* Хедер */}
          <header className="sticky top-0 z-40 bg-[#07090E]/95 backdrop-blur-md border-b border-cyan-500/20 px-3 sm:px-8 py-3">

                    <div className="p-2.5 mb-3 rounded-xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 text-xs font-mono text-center">
                      OTP: <b>{generatedOtp}</b>
                    </div>
                    <form onSubmit={handleVerifyEmail} className="space-y-3">
                      <input
                        type="text"
                        required
                        maxLength="6"
                        placeholder="6-значный код"
                        value={verificationCode}
                        onChange={(e) => setVerificationCode(e.target.value)}
                        className="w-full bg-slate-950 border border-cyan-500 text-center text-lg font-mono rounded-xl px-3.5 py-2.5 text-cyan-300 outline-none"
                      />
                      <button type="submit" className="w-full py-3 rounded-xl bg-emerald-500 text-black font-bold text-sm">
                        Забрать +1000 AWS и войти
                      </button>
                    </form>
                  </>
                )}
              </div>
            </div>
          )}

          {/* Футер */}
          <footer className="mt-12 border-t border-cyan-500/20 bg-[#06080C] px-4 py-8 text-xs text-slate-400">
            <div className="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
              <div className="space-y-1 text-center md:text-left">
                <div className="font-bold text-slate-200 text-sm">AI WORKERS SPACE</div>
                <div className="font-mono text-[11px]">Самозанятая: Храппа Марина Николаевна • ИНН: 390400469138</div>
              </div>
              <div className="text-center md:text-right font-mono text-[11px] text-slate-500">
                © 2026 AI WORKERS SPACE. Все права защищены.
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
